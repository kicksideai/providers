version: "1.0"
namespace: kickside.gitlab.connection

entries:
  - name: gitlab_connection
    kind: contract.binding
    meta:
      title: GitLab
      comment: Connect gitlab.com or a self-managed GitLab instance with an access token to discover projects.
      icon: tabler:brand-gitlab
      provider: gitlab
      group: Developer
      tags: [gitlab, git, code, projects]
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: base_url
            label: GitLab URL
            type: text
            required: false
            placeholder: https://gitlab.com
            help: GitLab instance URL. Leave blank for https://gitlab.com.
          - key: token
            label: Access token
            type: password
            required: true
            placeholder: glpat-...
            help: A personal, group, or project access token. Grant read_api for read-only use, or api to allow write actions later.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.gitlab.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.gitlab.connection:get_status
          test_connection: kickside.gitlab.connection:test_connection
          discover_resources: kickside.gitlab.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.gitlab.connection:delete

  - name: get_status
    kind: function.lua
    meta: { comment: "gitlab connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      implementation: kickside.gitlab.connection:connection_lib

  - name: test_connection
    kind: function.lua
    meta: { comment: "gitlab connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      implementation: kickside.gitlab.connection:connection_lib

  - name: discover_resources
    kind: function.lua
    meta: { comment: "gitlab connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      implementation: kickside.gitlab.connection:connection_lib

  - name: delete
    kind: function.lua
    meta: { comment: "gitlab connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      implementation: kickside.gitlab.connection:connection_lib

  - name: connection_lib
    kind: library.lua
    meta: { name: connection_lib, comment: "gitlab connection - shared implementation of the connection contract methods" }
    source: file://connection.lua
    imports:
      transport: kickside.gitlab.client:transport
      types: kickside.gitlab.client:types
      base: kickside.connection:base_connection
