version: "1.0"
namespace: kickside.gitlab

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide GitLab
      comment: GitLab connections and repository agent tools for gitlab.com and self-managed instances.

  - name: dep.kickside.component
    kind: ns.dependency
    component: kickside/component
    version: "*"
    meta:
      comment: Resolves GitLab connection components through the component service.

  - name: dep.kickside.connection
    kind: ns.dependency
    component: kickside/connection
    version: "*"
    meta:
      comment: Implements the shared connection contract and base connection helpers.

  - name: dep.kickside.contract
    kind: ns.dependency
    component: kickside/contract
    version: "*"
    meta:
      comment: Implements the component and deletable contracts used by GitLab connections.
