            || failed || !passed) }'' .wippy-test.clean.log

            cd "$source_root"

            version=$(jq -er --arg path atlassian ''.[$path]'' .release-please-manifest.json)

            wippy publish --config atlassian --version "$version" --dry-run --create
            --module-visibility public --module-type plugin --embed kickside.atlassian.ui:ui_fs

