version: "1.0"
namespace: kickside.fireflies.connection

entries:
  - name: fireflies_connection
    kind: contract.binding
    meta:
      title: Fireflies
      comment: Connect Fireflies.ai with an API key to read meeting transcripts and summaries.
      icon: tabler:flame
      provider: fireflies
      group: Meetings
      tags: [fireflies, meetings, transcripts, notetaker]
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: api_key
            label: API key
            type: password
            required: true
            placeholder: Fireflies API key
            help: Find it in Fireflies under Settings → Developer Settings → API key.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.fireflies.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.fireflies.connection:get_status
          test_connection: kickside.fireflies.connection:test_connection
          discover_resources: kickside.fireflies.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.fireflies.connection:delete

  - name: connection_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://connection.lua
    imports:
      transport: kickside.fireflies.client:transport
      types: kickside.fireflies.client:types
      base: kickside.connection:base_connection

  - name: get_status
    kind: function.lua
    meta: { comment: "fireflies connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      transport: kickside.fireflies.client:transport
      types: kickside.fireflies.client:types
      base: kickside.connection:base_connection
      implementation: kickside.fireflies.connection:connection_implementation

  - name: test_connection
    kind: function.lua
    meta: { comment: "fireflies connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      transport: kickside.fireflies.client:transport
      types: kickside.fireflies.client:types
      base: kickside.connection:base_connection
      implementation: kickside.fireflies.connection:connection_implementation

  - name: discover_resources
    kind: function.lua
    meta: { comment: "fireflies connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      transport: kickside.fireflies.client:transport
      types: kickside.fireflies.client:types
      base: kickside.connection:base_connection
      implementation: kickside.fireflies.connection:connection_implementation

  - name: delete
    kind: function.lua
    meta: { comment: "fireflies connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      transport: kickside.fireflies.client:transport
      types: kickside.fireflies.client:types
      base: kickside.connection:base_connection
      implementation: kickside.fireflies.connection:connection_implementation
