version: "1.0"
namespace: kickside.fireflies.traits

entries:
  - name: reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Fireflies Reader
      public: true
      comment: Reads Fireflies.ai meeting transcripts, summaries, and full text.
      icon: tabler:flame
      tags: [fireflies, meetings, transcripts, read-only]
      web_component: kickside-connection-trait-picker
      provider: fireflies
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Fireflies connection component id selected by the connection trait picker.
        additionalProperties: false
    prompt: |
      You can read Fireflies.ai meeting transcripts through the FirefliesRead tool:
        - get_user: the connected account and its transcript count.
        - list_transcripts: recent meetings (paginate with limit / skip).
        - get_transcript: one meeting's metadata, attendees, and AI summary by transcript_id.
        - get_transcript_text: the full speaker-attributed transcript by transcript_id.
      A typical flow is list_transcripts to find the meeting, then get_transcript
      (summary) or get_transcript_text (full text) for its id. The Fireflies
      connection is selected on the trait, or auto-selected when only one exists.
    tools:
      - kickside.fireflies.traits:get_tool

  - name: get_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: Fireflies Read
      tags: [fireflies, meetings, transcripts, read-only]
      llm_alias: FirefliesRead
      llm_description: Read Fireflies.ai meeting transcripts (account, recent meetings, a meeting's summary/attendees, or its full text) through the configured connection.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "Read action to perform.",
              "enum": ["get_user", "list_transcripts", "get_transcript", "get_transcript_text"]
            },
            "transcript_id": {
              "type": "string",
              "description": "Fireflies transcript id. Required for get_transcript and get_transcript_text."
            },
            "limit": {
              "type": "number",
              "description": "For list_transcripts: maximum rows (default 25, max 50)."
            },
            "skip": {
              "type": "number",
              "description": "For list_transcripts: rows to skip, for pagination; pass next_skip from the previous page."
            }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected Fireflies request returns { success: false, error, status_code, data } with the GraphQL or HTTP error body. Shape depends on action. get_user returns the connected account; list_transcripts returns { transcripts, count, skip, next_skip? }; get_transcript returns one meeting's metadata, meeting_attendees and summary; get_transcript_text returns the transcript with all speaker-attributed sentences. Secret-like keys are redacted.",
          "properties": {
            "success": {"type": "boolean", "description": "true when the action succeeded; false with error otherwise."},
            "error": {"type": "string", "description": "Fireflies error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "GraphQL or HTTP error body of a rejected request."},
            "name": {"type": "string"},
            "email": {"type": "string"},
            "user_id": {"type": "string"},
            "num_transcripts": {"type": "integer"},
            "transcripts": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "title": {"type": "string"}, "date": {"type": "number"}, "duration": {"type": "number"}, "host_email": {"type": "string"}, "organizer_email": {"type": "string"}, "participants": {"type": "array", "items": {"type": "string"}}}}},
            "count": {"type": "integer"},
            "skip": {"type": "integer"},
            "next_skip": {"type": "integer"},
            "id": {"type": "string"},
            "title": {"type": "string"},
            "date": {"type": "number"},
            "dateString": {"type": "string"},
            "duration": {"type": "number"},
            "host_email": {"type": "string"},
            "organizer_email": {"type": "string"},
            "transcript_url": {"type": "string"},
            "meeting_attendees": {"type": "array", "items": {"type": "object", "properties": {"displayName": {"type": "string"}, "email": {"type": "string"}}}},
            "summary": {"type": "object", "properties": {"overview": {"type": "string"}, "keywords": {"type": "array", "items": {"type": "string"}}, "action_items": {"type": "string"}, "outline": {"type": "string"}, "topics_discussed": {"type": "string"}}},
            "sentences": {"type": "array", "items": {"type": "object", "properties": {"index": {"type": "integer"}, "speaker_name": {"type": "string"}, "text": {"type": "string"}, "start_time": {"type": "number"}}}}
          }
        }
    source: file://get_tool.lua
    method: handler
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.fireflies.client:transport
      output: kickside.fireflies.client:output
