version: "1.0"
namespace: kickside.google.traits

# Agent traits + tools — the application layer. Each service is split into a
# read-only Reader trait and a write Writer trait (read-only services expose a
# Reader only), so a capability is granted by attaching "Google <Service> Reader"
# and/or "Google <Service> Writer". The read/write boundary is enforced by each
# tool's action enum; both tools share the service handler. Each tool resolves the
# actor's Google OAuth connection through the transport. The agent editor mounts
# the kickside-google-picker web component so a trait can pin connection_id;
# leaving it blank uses the transport's default auto-discovery.

entries:
  # ─── Gmail ───────────────────────────────────────────────────────────
  - name: gmail_reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Gmail Reader
      public: true
      icon: tabler:mail
      comment: Reads Gmail messages and threads.
      tags: [google, gmail, email, read-only]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can read Gmail on the user's Google account with the GoogleGmailRead
      tool: list_messages (optional Gmail search query, e.g.
      "from:alice@example.com is:unread"), get_message, list_threads, get_thread,
      list_labels, and the read draft actions (list_drafts, get_draft). The Google
      connection is selected on the trait, or auto-selected when none is pinned.
    tools:
      - kickside.google.traits:gmail_read_tool

  - name: gmail_tool_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://gmail_tool.lua
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.google.client:transport
      gmail: kickside.google.client:gmail

  - name: gmail_read_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: Google Gmail Read
      llm_alias: GoogleGmailRead
      llm_description: "Read Gmail. list_messages/list_drafts return compact metadata summaries with selected addressing headers, labels, dates and provider snippets. list_threads returns id, snippet and historyId without message bodies. Use max_results and next_page_token as page_token. fields requests explicit provider fields; metadata_headers requests selected message/thread headers; the drafts API does not support this selector. list_labels uses max_results and numeric page_token offsets because Gmail returns labels in one response. get_message/get_thread/get_draft return complete provider objects with decoded bodies and attachments."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "string", "description": "Gmail response field mask for explicit list detail; default rows are compact summaries. Paging fields are retained separately."},
            "metadata_headers": {"type": "array", "items": {"type": "string"}, "description": "Gmail headers requested for list_messages/list_threads metadata. Defaults to Subject, From, To, Cc and Date; explicit selection returns the metadata record. The drafts API does not support this selector."},
            "action": {
              "type": "string",
              "description": "The read action to perform",
              "enum": ["list_messages", "get_message", "list_threads", "get_thread", "list_labels", "list_drafts", "get_draft"]
            },
            "query": { "type": "string", "description": "Gmail search query for list_messages/list_threads" },
            "message_id": { "type": "string", "description": "Message ID for get_message" },
            "thread_id": { "type": "string", "description": "Thread ID for get_thread" },
            "draft_id": { "type": "string", "description": "Draft ID for get_draft" },
            "max_results": { "type": "integer", "description": "Max items to list (default 10, max 500)" },
            "page_token": { "type": "string", "description": "next_page_token from the previous list page" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Read Gmail. list_messages/list_drafts return compact metadata summaries with selected addressing headers, labels, dates and provider snippets. list_threads returns id, snippet and historyId without message bodies. Use max_results and next_page_token as page_token. fields requests explicit provider fields; metadata_headers requests selected message/thread headers; the drafts API does not support this selector. list_labels uses max_results and numeric page_token offsets because Gmail returns labels in one response. get_message/get_thread/get_draft return complete provider objects with decoded bodies and attachments. A provider rejection returns {success:false,error,status_code,data}; infrastructure failures return (nil, typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "messages": {"type": "array", "items": {"type": "object", "additionalProperties": true}, "description": "Message rows (list_messages) or, for get_thread, full message records"},
            "threads": {"type": "array", "items": {"type": "object", "additionalProperties": true, "properties": {"id": {"type": "string"}, "snippet": {"type": "string"}, "historyId": {"type": "string"}, "messages": {"type": "array", "items": {"type": "object"}, "description": "Message rows of the thread"}}}},
            "drafts": {"type": "array", "items": {"type": "object", "additionalProperties": true, "properties": {"id": {"type": "string"}, "message": {"type": "object", "description": "Message row of the draft"}}}},
            "labels": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "type": {"type": "string"}}}},
            "next_page_token": {"type": "string"},
            "result_size_estimate": {"type": "integer"},
            "id": {"type": "string"},
            "threadId": {"type": "string"},
            "labelIds": {"type": "array", "items": {"type": "string"}},
            "historyId": {"type": "string"},
            "internalDate": {"type": "string"},
            "sizeEstimate": {"type": "integer"},
            "payload": {"type": "object", "description": "Gmail message payload: headers, mimeType, body and parts", "additionalProperties": true},
            "snippet": {"type": "string"},
            "subject": {"type": "string"},
            "from": {"type": "string"},
            "to": {"type": "string"},
            "cc": {"type": "string"},
            "date": {"type": "string"},
            "attachments": {"type": "array", "items": {"type": "object", "properties": {"filename": {"type": "string"}, "mimeType": {"type": "string"}, "size": {"type": "integer"}, "attachmentId": {"type": "string"}}}},
            "body": {"type": "string", "description": "Full plain-text message body"},
            "message": {"type": "object", "description": "Draft message record (get_draft)"}
          }
        }
    source: file://gmail_read_tool.lua
    method: handler
    modules: [ctx]
    imports:
      transport: kickside.google.client:transport
      gmail: kickside.google.client:gmail
      implementation: kickside.google.traits:gmail_tool_implementation

  - name: gmail_writer
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Gmail Writer
      public: true
      icon: tabler:mail
      comment: Composes and drafts Gmail messages.
      tags: [google, gmail, email, write]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can compose Gmail drafts on the user's Google account with the
      GoogleGmailWrite tool: create_draft, update_draft, and delete_draft. Drafts
      are never sent automatically. Pair with Google Gmail Reader to look up the
      messages or drafts you act on. The Google connection is selected on the
      trait, or auto-selected when none is pinned.
    tools:
      - kickside.google.traits:gmail_write_tool

  - name: gmail_write_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read, state.write]
      title: Google Gmail Write
      llm_alias: GoogleGmailWrite
      llm_description: Create, update, and delete Gmail drafts via the Google connection. Drafts are never sent automatically.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "The write action to perform",
              "enum": ["create_draft", "update_draft", "delete_draft"]
            },
            "draft_id": { "type": "string", "description": "Draft ID for update_draft/delete_draft" },
            "to": { "type": "string", "description": "Recipient(s) for create_draft/update_draft" },
            "cc": { "type": "string", "description": "Cc recipient(s)" },
            "bcc": { "type": "string", "description": "Bcc recipient(s)" },
            "subject": { "type": "string", "description": "Subject for create_draft/update_draft" },
            "body": { "type": "string", "description": "Plain-text body for create_draft/update_draft" },
            "html": { "type": "string", "description": "HTML body (overrides body) for create_draft/update_draft" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected Google request returns { success: false, error, status_code, data } with Google's error body. create_draft/update_draft return the Gmail draft { id, message: { id, threadId, labelIds } }; delete_draft returns { id, deleted: true }.",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "id": {"type": "string"},
            "message": {"type": "object", "properties": {"id": {"type": "string"}, "threadId": {"type": "string"}, "labelIds": {"type": "array", "items": {"type": "string"}}}},
            "deleted": {"type": "boolean"}
          }
        }
    source: file://gmail_write_tool.lua
    method: handler
    modules: [ctx]
    imports:
      transport: kickside.google.client:transport
      gmail: kickside.google.client:gmail
      implementation: kickside.google.traits:gmail_tool_implementation

  # ─── Drive ───────────────────────────────────────────────────────────
  - name: drive_reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Drive Reader
      public: true
      icon: tabler:brand-google-drive
      comment: Browses and reads Google Drive files.
      tags: [google, drive, files, storage, read-only]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can read Google Drive with the GoogleDriveRead tool: list_files to
      browse recent files (optional Drive query), search_files to find files by
      name/content, get_file for metadata, and read_file to read a file's text
      (Google Docs/Sheets/Slides export to text/CSV; other text files download).
      The Google connection is selected on the trait, or auto-selected when none
      is pinned.
    tools:
      - kickside.google.traits:drive_read_tool

  - name: drive_tool_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://drive_tool.lua
    modules: [json, ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.google.client:transport
      drive: kickside.google.client:drive

  - name: drive_read_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: Google Drive Read
      llm_alias: GoogleDriveRead
      llm_description: "Read Google drive. Lists and searches return compact file/event metadata with max_results/page_token and next_page_token. fields selects item fields, including * for full records. get/detail actions return the whole object; read actions return complete content."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "string", "description": "Comma-separated provider fields within each item, or * for all fields. The collection paging token is retained separately. Contacts uses personFields/readMask."},
            "action": {
              "type": "string",
              "description": "The read action to perform",
              "enum": ["list_files", "search_files", "get_file", "read_file"]
            },
            "query": { "type": "string", "description": "Search text for search_files; or a raw Drive query for list_files" },
            "file_id": { "type": "string", "description": "Drive file ID — required for get_file, read_file" },
            "max_results": { "type": "integer", "description": "Max files to list (default 20, max 100)" },
            "page_token": { "type": "string", "description": "next_page_token from the previous list_files or search_files page" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Read Google drive. Lists and searches return compact file/event metadata with max_results/page_token and next_page_token. fields selects item fields, including * for full records. get/detail actions return the whole object; read actions return complete content. A provider rejection returns {success:false,error,status_code,data}; infrastructure failures return (nil, typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "files": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "mimeType": {"type": "string"}, "modifiedTime": {"type": "string"}, "size": {"type": "string"}, "owners": {"type": "array", "items": {"type": "object"}}}}},
            "next_page_token": {"type": "string"},
            "id": {"type": "string"},
            "name": {"type": "string"},
            "mimeType": {"type": "string"},
            "modifiedTime": {"type": "string"},
            "owners": {"type": "array", "items": {"type": "object"}},
            "webViewLink": {"type": "string"},
            "mime_type": {"type": "string"},
            "content": {"type": "string", "description": "Complete file text (read_file)"}
          }
        }
    source: file://drive_read_tool.lua
    method: handler
    modules: [json, ctx]
    imports:
      transport: kickside.google.client:transport
      drive: kickside.google.client:drive
      implementation: kickside.google.traits:drive_tool_implementation

  - name: drive_writer
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Drive Writer
      public: true
      icon: tabler:brand-google-drive
      comment: Organizes Google Drive folders and moves files.
      tags: [google, drive, files, storage, write]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can organize Google Drive with the GoogleDriveWrite tool: create_folder
      to make a folder (optionally under a parent). Pair with Google Drive Reader
      to look up files and parent folders. The Google connection is selected on
      the trait, or auto-selected when none is pinned.
    tools:
      - kickside.google.traits:drive_write_tool

  - name: drive_write_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read, state.write]
      title: Google Drive Write
      llm_alias: GoogleDriveWrite
      llm_description: Organize Google Drive — create folders via the Google connection.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "The write action to perform",
              "enum": ["create_folder"]
            },
            "name": { "type": "string", "description": "Folder name — required for create_folder" },
            "parent_id": { "type": "string", "description": "Parent folder ID for create_folder (optional)" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected Google request returns { success: false, error, status_code, data } with Google's error body. The created Drive folder resource.",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "id": {"type": "string"},
            "name": {"type": "string"},
            "webViewLink": {"type": "string"}
          }
        }
    source: file://drive_write_tool.lua
    method: handler
    modules: [json, ctx]
    imports:
      transport: kickside.google.client:transport
      drive: kickside.google.client:drive
      implementation: kickside.google.traits:drive_tool_implementation

  # ─── Calendar ────────────────────────────────────────────────────────
  - name: calendar_reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Calendar Reader
      public: true
      icon: tabler:calendar
      comment: Reads Google Calendar calendars and events.
      tags: [google, calendar, read-only]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can read Google Calendar with the GoogleCalendarRead tool:
      list_calendars, list_events (filter by time_min/time_max RFC3339 and
      free-text query), and get_event. The Google connection is selected on the
      trait, or auto-selected when none is pinned.
    tools:
      - kickside.google.traits:calendar_read_tool

  - name: calendar_tool_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://calendar_tool.lua
    modules: [json, time, ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.google.client:transport
      calendar: kickside.google.client:calendar

  - name: calendar_read_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: Google Calendar Read
      llm_alias: GoogleCalendarRead
      llm_description: "Read Google calendar. Lists and searches return compact file/event metadata with max_results/page_token and next_page_token. fields selects item fields, including * for full records. get/detail actions return the whole object; read actions return complete content."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "string", "description": "Comma-separated provider fields within each item, or * for all fields. The collection paging token is retained separately. Contacts uses personFields/readMask."},
            "action": {
              "type": "string",
              "description": "The read action to perform",
              "enum": ["list_calendars", "list_events", "get_event"]
            },
            "calendar_id": { "type": "string", "description": "Calendar ID (defaults to 'primary')" },
            "event_id": { "type": "string", "description": "Event ID for get_event" },
            "time_min": { "type": "string", "description": "Lower bound for event start (RFC3339); defaults to now for list_events" },
            "time_max": { "type": "string", "description": "Upper bound for event start (RFC3339)" },
            "query": { "type": "string", "description": "Free-text event search" },
            "max_results": { "type": "integer", "description": "Max calendars or events (calendar default 20; event default 10; max 250)" },
            "page_token": { "type": "string", "description": "next_page_token from the previous list page" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Read Google calendar. Lists and searches return compact file/event metadata with max_results/page_token and next_page_token. fields selects item fields, including * for full records. get/detail actions return the whole object; read actions return complete content. A provider rejection returns {success:false,error,status_code,data}; infrastructure failures return (nil, typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "calendars": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "summary": {"type": "string"}, "primary": {"type": "boolean"}, "timeZone": {"type": "string"}, "accessRole": {"type": "string"}}}},
            "events": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "summary": {"type": "string"}, "description": {"type": "string"}, "location": {"type": "string"}, "status": {"type": "string"}, "start": {"type": "object"}, "end": {"type": "object"}, "attendees": {"type": "array", "items": {"type": "object"}}, "htmlLink": {"type": "string"}}}},
            "next_page_token": {"type": "string"},
            "id": {"type": "string"},
            "summary": {"type": "string"},
            "description": {"type": "string"},
            "location": {"type": "string"},
            "status": {"type": "string"},
            "start": {"type": "object"},
            "end": {"type": "object"},
            "attendees": {"type": "array", "items": {"type": "object"}},
            "htmlLink": {"type": "string"}
          }
        }
    source: file://calendar_read_tool.lua
    method: handler
    modules: [json, time, ctx]
    imports:
      transport: kickside.google.client:transport
      calendar: kickside.google.client:calendar
      implementation: kickside.google.traits:calendar_tool_implementation

  - name: calendar_writer
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Calendar Writer
      public: true
      icon: tabler:calendar
      comment: Creates and updates Google Calendar events.
      tags: [google, calendar, write]
      web_component: kickside-google-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: Google connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      You can manage Google Calendar events with the GoogleCalendarWrite tool:
      create_event, update_event, and delete_event. Pair with Google Calendar
      Reader to find the calendar and event you act on. The Google connection is
      selected on the trait, or auto-selected when none is pinned.
    tools:
      - kickside.google.traits:calendar_write_tool

  - name: calendar_write_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read, state.write]
      title: Google Calendar Write
      llm_alias: GoogleCalendarWrite
      llm_description: Manage Google Calendar events — create, update, and delete events via the Google connection.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "The write action to perform",
              "enum": ["create_event", "update_event", "delete_event"]
            },
            "calendar_id": { "type": "string", "description": "Calendar ID (defaults to 'primary')" },
            "event_id": { "type": "string", "description": "Event ID for update/delete" },
            "summary": { "type": "string", "description": "Event title (create/update)" },
            "description": { "type": "string", "description": "Event description (create/update)" },
            "location": { "type": "string", "description": "Event location (create/update)" },
            "start_time": { "type": "string", "description": "Start time RFC3339 (create/update)" },
            "end_time": { "type": "string", "description": "End time RFC3339 (create/update)" },
            "start_date": { "type": "string", "description": "All-day start date YYYY-MM-DD (create/update)" },
            "end_date": { "type": "string", "description": "All-day end date YYYY-MM-DD (create/update)" },
            "attendees": { "type": "array", "items": { "type": "string" }, "description": "Attendee emails (create/update)" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected Google request returns { success: false, error, status_code, data } with Google's error body. create_event/update_event return the full Google Calendar event resource; delete_event returns { id, deleted: true }.",
          "properties": {
            "success": {"type": "boolean", "description": "false with error when Google rejected the request."},
            "error": {"type": "string", "description": "Google's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "Google's error body of a rejected request."},
            "id": {"type": "string"},
            "summary": {"type": "string"},
            "description": {"type": "string"},
            "location": {"type": "string"},
            "status": {"type": "string"},
            "start": {"type": "object"},
            "end": {"type": "object"},
            "attendees": {"type": "array", "items": {"type": "object"}},
            "htmlLink": {"type": "string"},
            "deleted": {"type": "boolean"}
          }
        }
    source: file://calendar_write_tool.lua
    method: handler
    modules: [json, time, ctx]
    imports:
      transport: kickside.google.client:transport
      calendar: kickside.google.client:calendar
      implementation: kickside.google.traits:calendar_tool_implementation

  # ─── Sheets ──────────────────────────────────────────────────────────
  - name: sheets_reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Google Sheets Reader
      public: true
      icon: tabler:table
      comment: Reads Google Sheets values and metadata.
