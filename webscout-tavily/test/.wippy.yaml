version: "1.0"
vars:
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_webscout_tavily
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      "app:db:kind": db.sql.postgres
      "app:db:host": "${pg_host}"
      "app:db:port": "${pg_port}"
      "app:db:database": "${pg_database}"
      "app:db:username": "${pg_username}"
      "app:db:password": "${pg_password}"
      "app:db:options.sslmode": disable
      "app:db:pool.max_open": 16
      "app:db:pool.max_idle": 8
workspace:
  replacements:
    kickside/webscout-tavily: ..

registry:
  dispatch_internal_kinds:
    - registry.entry
    - ns.requirement
    - ns.dependency
    - ns.definition
    - security.scope
