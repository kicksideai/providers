version: "1.0"
workspace:
  replacements:
    kickside/mail: ../../../components/mail
    kickside/mail-mailgun: ..
    kickside/component: ../../../kickside/core/component
    kickside/contract: ../../../kickside/core/contract
    kickside/core: ../../../kickside/core/core
    kickside/execution: ../../../kickside/core/execution
    kickside/jobs: ../../../kickside/core/jobs
    kickside/realtime-dispatch: ../../../kickside/core/realtime-dispatch
    kickside/security: ../../../kickside/platform/security
    kickside/settings: ../../../kickside/platform/settings
    kickside/uploads: ../../../kickside/platform/uploads
    kickside/users: ../../../kickside/platform/users
    kickside/doc2md: ../../../converters/doc2md
override:
  app:dep.driver:parameters:
      - { name: "kickside.mail.mailgun:us_api_base_url", value: "https://127.0.0.1:${stub_port}/v3/*" }
      - { name: "kickside.mail.mailgun:eu_api_base_url", value: "https://localhost:${stub_port}/v3/*" }
      - { name: "kickside.mail.mailgun:sending_domain", value: "mail.example.org" }
      - { name: "kickside.mail.security:user_security_scope", value: "app:user" }
      - { name: "kickside.mail:target_db", value: "app:db" }
      - { name: "kickside.mail:api_router", value: "app:api" }
      - { name: "kickside.mail.mailgun.security:user_security_scope", value: "app:user" }
  app:mailgun_gateway:addr: "127.0.0.1:${stub_port}"
  kickside.mail.binding:library:meta.provision.grants:
    - {subject_id: "system:kickside.mail.retention", subject_type: user, access_mask: 1}
    - {subject_id: "wippy.test:runner", subject_type: user, access_mask: 3}
vars:
  stub_port: 0
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_mail_mailgun
  pg_username: kickside
  pg_password: kickside
profiles:
  defaults:
    override:
      app:dep.driver:parameters:
        - { name: "kickside.mail.security:user_security_scope", value: "app:user" }
        - { name: "kickside.mail:target_db", value: "app:db" }
        - { name: "kickside.mail:api_router", value: "app:api" }
        - { name: "kickside.mail.mailgun.security:user_security_scope", value: "app:user" }
      app:defaults_test:meta.type: test
      app:driver_test:meta.type: test_fixture
      app:mailgun_gateway:addr: "127.0.0.1:0"
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
registry:
  dispatch_internal_kinds:
    - registry.entry
    - ns.requirement
    - ns.dependency
    - ns.definition
    - security.scope
