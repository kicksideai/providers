version: "1.0"
namespace: kickside.mail.mailgun.ui
entries:
  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built Mailgun settings panel bundle.
    directory: ./static
  - name: ui_static
    kind: http.static
    meta:
      server: ""
    path: /kickside-mail-mailgun
    fs: kickside.mail.mailgun.ui:ui_fs
    options:
      mime_types:
        .js: application/javascript
        .css: text/css
        .map: application/json
  - name: settings_view
    kind: registry.entry
    meta:
      type: view.component
      name: settings_view
      title: Mailgun delivery settings
      tag_name: kickside-mailgun-settings
      base_path: kickside-mail-mailgun
      entry_point: settings.js
      announced: true
      auto_register: false
      description: Mailgun's own rows inside the Mail delivery settings block (API key, sending domain, region).
        The block passes the saved values, which secrets are set, and server errors; the panel emits change
        and validity, and the block saves.
  - name: ui_server
    kind: ns.requirement
    default: app:gateway
    meta:
      value_kind: http.service
      comment: HTTP server the Mailgun settings panel is served from.
    targets:
      - { entry: kickside.mail.mailgun.ui:ui_static, path: .meta.server }
