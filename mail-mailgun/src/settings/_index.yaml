version: "1.0"
namespace: kickside.mail.mailgun.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition", comment: Stores the API key for Mailgun delivery. }
    namespace: kickside.mail.mailgun
    key: api_key
    title: API key
    description: API key authorized to send mail through Mailgun.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: kickside.mail.mailgun.settings:validate_api_key
  - name: setting_domain
    kind: registry.entry
    meta: { type: "kickside.settings:definition", comment: Stores the verified Mailgun sending domain. }
    namespace: kickside.mail.mailgun
    key: domain
    read_access: admin
    title: Sending domain
    description: Mailgun domain authorized to send mail.
    scope: global
    value_type: string
    default: ""
    order: 20
    validate_func: kickside.mail.mailgun.settings:validate_domain
  - name: setting_region
    kind: registry.entry
    meta: { type: "kickside.settings:definition", comment: Selects the Mailgun API region for delivery. }
    namespace: kickside.mail.mailgun
    key: region
    read_access: admin
    title: Region
    description: Mailgun API region for the sending domain.
    scope: global
    value_type: string
    default: us
    schema: { enum: [us, eu] }
    order: 30
    validate_func: kickside.mail.mailgun.settings:validate_region
  - name: validate
    kind: library.lua
    meta: { comment: Shares Mailgun’s setting validation with the transport. }
    source: file://validate.lua
    imports: &validation_imports
      mail_types: kickside.mail:types
      config: kickside.mail.driver:config
  - name: validate_domain
    kind: function.lua
    meta: { comment: Checks the Mailgun sending domain. }
    source: file://validate.lua
    method: domain
    imports: *validation_imports
  - name: validate_region
    kind: function.lua
    meta: { comment: Checks the Mailgun API region. }
    source: file://validate.lua
    method: region
    imports: *validation_imports
  - name: validate_api_key
    kind: function.lua
    meta: { comment: Checks the provider API key format. }
    source: file://validate.lua
    method: api_key
    imports: *validation_imports
