version: "1.0"
namespace: kickside.mail.mailgun.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: api_key
    title: API key
    description: API key authorized to send mail through Mailgun.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: kickside.mail.mailgun.settings:validate_api_key
  - name: setting_domain
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: domain
    read_access: admin
    title: Sending domain
    description: Mailgun domain authorized to send mail.
    scope: global
    value_type: string
    default: ""
    order: 20
    validate_func: kickside.mail.mailgun.settings:validate_domain
  - name: setting_region
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: region
    read_access: admin
    title: Region
    description: Mailgun API region for the sending domain.
    scope: global
    value_type: string
    default: us
    schema: { enum: [us, eu] }
    order: 30
    validate_func: kickside.mail.mailgun.settings:validate_region
  - name: validate
    kind: library.lua
    source: file://validate.lua
    imports: &validation_imports
      mail_types: kickside.mail:types
      config: kickside.mail.driver:config
  - name: validate_domain
    kind: function.lua
    source: file://validate.lua
    method: domain
    imports: *validation_imports
  - name: validate_region
    kind: function.lua
    source: file://validate.lua
    method: region
    imports: *validation_imports
  - name: validate_api_key
    kind: function.lua
    source: file://validate.lua
    method: api_key
    imports: *validation_imports
  - name: settings_block
    kind: registry.entry
    meta:
      type: kickside.settings:block
      comment: The Mailgun entry in System Settings, beside Mail; the shared settings card edits this namespace.
    key: mail-mailgun
    title: Mailgun
    icon: simple-icons:mailgun
    group: Integrations
    order: 31
    component_tag: kickside-settings-provider
    namespace: kickside.mail.mailgun
    config:
      namespace: kickside.mail.mailgun
      title: Mailgun
      icon: simple-icons:mailgun
      help: Mailgun API key, sending domain and region for Mail delivery.
