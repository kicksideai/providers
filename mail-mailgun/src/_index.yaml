version: "1.0"
namespace: kickside.mail.mailgun
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: Mailgun Mail }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: types
    kind: library.lua
    source: file://types.lua
    imports: { mail_types: kickside.mail:types }
  - name: driver
    kind: registry.entry
    meta: { type: "kickside.mail:driver" }
    id: mailgun
    max_recipients: 1000
    max_message_bytes: 25000000
    label: Mailgun
    icon: simple-icons:mailgun
    description: Deliver mail through Mailgun.
    binding: kickside.mail.mailgun:transport
    settings_ns: kickside.mail.mailgun
    available_func: kickside.mail.mailgun:available
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: api_key
    title: API key
    description: API key authorized to send mail through Mailgun.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
  - name: setting_domain
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: domain
    read_access: admin
    title: Sending domain
    description: Mailgun domain authorized to send mail.
    scope: global
    value_type: string
    default: ""
    order: 20
    validate_func: kickside.mail.mailgun.config:validate_domain
  - name: setting_region
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.mailgun
    key: region
    read_access: admin
    title: Region
    description: Mailgun API region for the sending domain.
    scope: global
    value_type: string
    default: us
    schema: { enum: [us, eu] }
    order: 30
    validate_func: kickside.mail.mailgun.config:validate_region
  - name: settings_block
    kind: registry.entry
    meta: { type: "kickside.settings:block" }
    key: mail_mailgun
    title: Mailgun
    icon: simple-icons:mailgun
    group: Integrations
    order: 40
    namespace: kickside.mail.mailgun
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: us_api_base_url
    kind: ns.requirement
    default: https://api.mailgun.net
    targets:
      - { entry: "kickside.mail.mailgun:endpoints", path: ".endpoints.us" }
  - name: eu_api_base_url
    kind: ns.requirement
    default: https://api.eu.mailgun.net
    targets:
      - { entry: "kickside.mail.mailgun:endpoints", path: ".endpoints.eu" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: { send: "kickside.mail.mailgun:send" }
  - name: send
    kind: function.lua
    source: file://mailgun.lua
    method: send
    modules: [uuid]
    imports:
      types: kickside.mail.mailgun:types
      mail_types: kickside.mail:types
      settings: kickside.mail:settings
      validate: kickside.mail.mailgun.config:validate
      message: kickside.mail:message
      delivery: kickside.mail.service:delivery
    security:
      policies:
        - kickside.mail.security:settings_read
        - kickside.mail.security:settings_admin_read
        - kickside.mail.mailgun.security:http_access
        - kickside.mail.mailgun.security:provider_reads
  - name: available
    kind: function.lua
    source: file://mailgun.lua
    method: available
    modules: [uuid]
    imports:
      types: kickside.mail.mailgun:types
      mail_types: kickside.mail:types
      settings: kickside.mail:settings
      validate: kickside.mail.mailgun.config:validate
      message: kickside.mail:message
      delivery: kickside.mail.service:delivery
    security:
      policies: [kickside.mail.security:settings_read, kickside.mail.security:settings_admin_read]
