# SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0
version: "1.0"
namespace: kickside.mail.mailgun
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: Mailgun Mail }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: types
    kind: library.lua
    source: file://types.lua
    imports: { mail_types: kickside.mail:types }
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: us_api_base_url
    kind: ns.requirement
    default: https://api.mailgun.net
    targets:
      - { entry: "kickside.mail.mailgun:endpoints", path: ".endpoints.us" }
  - name: eu_api_base_url
    kind: ns.requirement
    default: https://api.eu.mailgun.net
    targets:
      - { entry: "kickside.mail.mailgun:endpoints", path: ".endpoints.eu" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.mailgun:send, status: kickside.mail.mailgun:status}
  - name: send
    kind: function.lua
    source: file://mailgun.lua
    method: send
    modules: [uuid]
    imports:
      types: kickside.mail.mailgun:types
      mail_types: kickside.mail:types
      settings: kickside.mail.driver:config
      validate: kickside.mail.mailgun.settings:validate
      delivery: kickside.mail.driver:http
    security:
      policies:
        - kickside.mail.mailgun.security:settings_read
        - kickside.mail.mailgun.security:settings_admin_read
        - kickside.mail.mailgun.security:http_access
        - kickside.mail.mailgun.security:provider_reads
  - name: status
    kind: function.lua
    source: file://mailgun.lua
    method: status
    modules: [uuid]
    imports:
      types: kickside.mail.mailgun:types
      mail_types: kickside.mail:types
      settings: kickside.mail.driver:config
      validate: kickside.mail.mailgun.settings:validate
      delivery: kickside.mail.driver:http
    security:
      policies: [kickside.mail.mailgun.security:settings_read, kickside.mail.mailgun.security:settings_admin_read]
