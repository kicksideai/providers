version: "1.0"
namespace: kickside.mail.mailgun.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      title: Mailgun Mail
      surface: kickside.mail.mailgun
      intent: module_access
      includes:
        - kickside.mail.mailgun.security:module_runtime
    groups: []
    policy:
      resources: [kickside.mail.mailgun:definition]
      actions: [registry.get, registry.find]
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta: { private: true }
    groups: []
    policy:
      resources: [kickside.mail.mailgun:transport, kickside.mail.mailgun.transport:send, kickside.mail.mailgun.transport:status]
      actions: [registry.get, registry.find]
      effect: allow
  - name: driver_admin
    kind: security.policy
    meta:
      title: Administer Mailgun mail delivery
      surface: kickside.mail.mailgun
      intent: settings_access
    groups: []
    policy:
      resources:
        - kickside.mail.mailgun.settings:setting_api_key
        - kickside.mail.mailgun.settings:validate_api_key
        - kickside.mail.mailgun.settings:setting_domain
        - kickside.mail.mailgun.settings:setting_region
        - kickside.mail.mailgun.settings:validate_domain
        - kickside.mail.mailgun.settings:validate_region
      actions: [registry.get, registry.find, funcs.call]
      effect: allow
  - name: user_security_scope
    kind: ns.requirement
    default: kickside.security.groups:members
    meta: { value_kind: security.scope }
    targets:
      - { entry: kickside.mail.mailgun.security:module_access, path: ".groups +=" }
      - { entry: kickside.mail.mailgun.security:module_runtime, path: ".groups +=" }
  - name: transport_open
    kind: security.policy
    meta: {private: true}
    groups: [kickside.mail.security:transports]
    policy:
      resources: [kickside.mail.mailgun:transport]
      actions: [contract.open]
      effect: allow
  - name: settings_read
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [kickside.settings:settings, kickside.settings:settings_binding, get_namespace]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
  - name: settings_admin_read
    kind: security.policy
    meta: {private: true}
    policy:
      resources: [kickside.settings.api:list_settings.endpoint]
      actions: [access]
      effect: allow
  - name: http_access
    kind: security.policy
    meta: { private: true }
    policy:
      resources: []
      actions: [http_client.request]
      effect: allow
  - name: provider_reads
    kind: security.policy
    meta: { private: true }
    policy:
      resources: [kickside.mail.mailgun:endpoints]
      actions: [registry.get]
      effect: allow
