version: "1.0"
namespace: kickside.slack.connection

entries:
  - name: slack_connection
    kind: contract.binding
    meta:
      title: Slack
      comment: Connect a Slack bot to discover channels and send replies; the app-level token enables Socket Mode for live messages.
      icon: tabler:brand-slack
      provider: slack
      group: Messaging
      tags: [slack, messaging, bot, dm, reply_provider]
      class:
        - connection
        - reply_provider
      # Static reply capabilities (replaces the get_capabilities contract method):
      # declarative metadata the shared reply_sender reads to chunk, and future
      # consumers read to gate features. max_length is Slack's hard message cap.
      reply:
        max_length: 40000
        content_types: [text/plain, text/markdown]
        attachments: false
        embeds: false
      projections:
        - kind: slack.socket.lifecycle
          on: lifecycle
          worker_ref: func://kickside.connection:reconcile_workers
          worker_config:
            hub_name: kickside.slack.socket.hub
          events:
            input:
              - type: kickside.component.events:created
              - type: kickside.component.events:updated
              - type: kickside.component.events:deleted
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: bot_token
            label: Bot token
            type: password
            required: true
            placeholder: xoxb-...
            help: Create a Slack app, install it to your workspace, and use its Bot User OAuth Token (starts with xoxb-). Needs scopes for reading and posting messages (channels:read, channels:history, chat:write, reactions:write, users:read, plus groups/im/mpim variants for private channels and DMs).
          - key: app_token
            label: App-level token
            type: password
            required: true
            placeholder: xapp-...
            help: An app-level token (starts with xapp-) with the connections:write scope. Enables Socket Mode so the bot receives live messages without a public URL. Create it under Basic Information → App-Level Tokens.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.slack.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.slack.connection:get_status
          test_connection: kickside.slack.connection:test_connection
          discover_resources: kickside.slack.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.slack.connection:delete
      - contract: kickside.connection:reply_provider
        context_required:
          - component_id
        methods:
          send_reply: kickside.slack.connection:send_reply
          update_reply: kickside.slack.connection:update_reply
          send_status: kickside.slack.connection:send_status

  - name: get_status
    kind: function.lua
    meta: { comment: "slack connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: test_connection
    kind: function.lua
    meta: { comment: "slack connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: discover_resources
    kind: function.lua
    meta: { comment: "slack connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: send_reply
    kind: function.lua
    meta: { comment: "slack reply_provider - send_reply" }
    source: file://send_reply.lua
    method: send_reply
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: update_reply
    kind: function.lua
    meta: { comment: "slack reply_provider - update_reply" }
    source: file://update_reply.lua
    method: update_reply
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: send_status
    kind: function.lua
    meta: { comment: "slack reply_provider - send_status (no native Slack status surface; succeeds unrendered)" }
    source: file://send_status.lua
    method: send_status
    imports: { implementation: kickside.slack.connection:connection_lib }

  - name: delete
    kind: function.lua
    meta: { comment: "slack connection - delete" }
    source: file://delete.lua
    method: delete
    imports: { implementation: kickside.slack.connection:connection_lib }

  # The shared implementation exposed as a library so the flow's pure shaping /
  # validation can be unit-tested as one module.
  - name: connection_lib
    kind: library.lua
    meta: { name: connection_lib, comment: "slack connection - shared implementation (for tests)" }
    source: file://connection.lua
    imports:
      transport: kickside.slack.client:transport
      types: kickside.slack.client:types
      base: kickside.connection:base_connection
