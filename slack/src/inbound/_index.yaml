version: "1.0"
namespace: kickside.slack.inbound

entries:
  - name: inbound_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://inbound.lua
    modules: [contract]
    imports:
      transport: kickside.slack.client:transport
      types: kickside.slack.client:types

  - name: normalize_message
    kind: function.lua
    meta:
      comment: Normalize a Slack message event into kickside.dm:receive payload shape.
    source: file://normalize_message.lua
    method: normalize
    modules: [contract]
    imports:
      transport: kickside.slack.client:transport
      types: kickside.slack.client:types
      implementation: kickside.slack.inbound:inbound_implementation

  - name: receive_message
    kind: function.lua
    meta:
      comment: Normalize a Slack inbound DM event and hand it to kickside.dm:receive.
    source: file://receive_message.lua
    method: receive_message
    modules: [contract]
    imports:
      transport: kickside.slack.client:transport
      types: kickside.slack.client:types
      implementation: kickside.slack.inbound:inbound_implementation

  - name: receive_channel_message
    kind: function.lua
    meta:
      comment: Normalize a Slack channel message and hand it to kickside.channel:receive (routing + installer identity live there).
    source: file://receive_channel_message.lua
    method: receive_channel_message
    modules: [contract]
    imports:
      transport: kickside.slack.client:transport
      types: kickside.slack.client:types
      implementation: kickside.slack.inbound:inbound_implementation
