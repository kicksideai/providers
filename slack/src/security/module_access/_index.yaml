version: '1.0'
namespace: kickside.slack.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Slack
    surface: kickside.slack
    intent: module_access
    includes:
    - kickside.slack.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.slack:*
    - kickside.slack.client:*
    - kickside.slack.connection:*
    - kickside.slack.inbound:*
    - kickside.slack.security:*
    - kickside.slack.socket:*
    - kickside.slack.traits:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.slack:*
    - kickside.slack.client:*
    - kickside.slack.connection:*
    - kickside.slack.inbound:*
    - kickside.slack.security:*
    - kickside.slack.socket:*
    - kickside.slack.traits:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
