version: "1.0"
namespace: kickside.mail.resend.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      title: Resend Mail
      surface: kickside.mail.resend
      intent: module_access
      includes:
        - kickside.mail.resend.security:module_runtime
    groups: []
    policy:
      resources: [kickside.mail.resend:definition]
      actions: [registry.get, registry.find]
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta: { private: true }
    groups: []
    policy:
      resources: [kickside.mail.resend:transport, kickside.mail.resend.transport:send, kickside.mail.resend.transport:status]
      actions: [registry.get, registry.find]
      effect: allow
  - name: driver_admin
    kind: security.policy
    meta:
      title: Administer Resend mail delivery
      surface: kickside.mail.resend
      intent: module_management
    groups: []
    policy:
      resources:
        - kickside.mail.resend.settings:settings_block
        - kickside.mail.resend.settings:setting_api_key
        - kickside.mail.resend.settings:validate_api_key
      actions: [registry.get, registry.find, funcs.call]
      effect: allow
  - name: user_security_scope
    kind: ns.requirement
    default: kickside.security.groups:members
    meta: { value_kind: security.scope }
    targets:
      - { entry: kickside.mail.resend.security:module_access, path: ".groups +=" }
      - { entry: kickside.mail.resend.security:module_runtime, path: ".groups +=" }
  - name: transport_open
    kind: security.policy
    meta: { private: true, comment: Admits this driver to the Mail transports group. }
    groups: [kickside.mail.security:transports]
    policy:
      resources: [kickside.mail.resend:transport]
      actions: [contract.open]
      effect: allow
  - name: settings_read
    kind: security.policy
    meta: { private: true, comment: Opens the Settings contract for the driver namespace. }
    policy:
      resources: [kickside.settings:settings, kickside.settings:settings_binding, get_namespace]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
  - name: settings_admin_read
    kind: security.policy
    meta: { private: true, comment: Allows the driver to read its protected API key. }
    policy:
      resources: [kickside.settings.api:list_settings.endpoint]
      actions: [access]
      effect: allow
  - name: http_access
    kind: security.policy
    meta: { private: true }
    policy:
      resources: []
      actions: [http_client.request]
      effect: allow
  - name: provider_reads
    kind: security.policy
    meta: { private: true }
    policy:
      resources: [kickside.mail.resend:endpoints]
      actions: [registry.get]
      effect: allow
