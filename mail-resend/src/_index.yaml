version: "1.0"
namespace: kickside.mail.resend
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: Resend Mail }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: api_base_url
    kind: ns.requirement
    meta:
      value_type: string
      description: Complete HTTPS URL for the Resend email delivery endpoint.
    default: https://api.resend.com/emails
    targets:
      - { entry: "kickside.mail.resend:endpoints", path: ".endpoints.api" }
      - { entry: kickside.mail.resend.security:http_access, path: ".policy.resources +=" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods:
          send: kickside.mail.resend.transport:send
          status: kickside.mail.resend.transport:status
