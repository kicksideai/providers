version: "1.0"
namespace: kickside.mail.resend.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition", comment: Stores the API key for Resend delivery. }
    namespace: kickside.mail.resend
    key: api_key
    title: API key
    description: API key authorized to send mail through Resend.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: kickside.mail.resend.settings:validate_api_key
  - name: validate_api_key
    kind: function.lua
    meta: { comment: Checks the provider API key format. }
    source: file://validate.lua
    method: api_key
    imports: {config: kickside.mail.driver:config}
  - name: settings_block
    kind: registry.entry
    meta:
      type: kickside.settings:block
      comment: The Resend entry in System Settings, beside Mail; the shared settings card edits this namespace.
    key: mail-resend
    title: Resend
    icon: simple-icons:resend
    group: Integrations
    order: 32
    component_tag: kickside-settings-provider
    namespace: kickside.mail.resend
    config:
      namespace: kickside.mail.resend
      title: Resend
      icon: simple-icons:resend
      help: Resend API key for Mail delivery.
