version: "1.0"
namespace: app
entries:
  - name: definition
    kind: ns.definition
    meta: { title: Example Workspace }
  - name: dep.fixture
    kind: ns.dependency
    component: kickside/mail-driver-fixture
    version: "*"
  - name: dep.driver
    kind: ns.dependency
    component: kickside/mail-resend
    version: "*"
  - name: dep.driver_example
    kind: ns.dependency
    component: kickside/mail-driver-example
    version: "*"
  - name: resend_gateway
    kind: http.service
    addr: "127.0.0.1:0"
    lifecycle: { auto_start: true }
  - name: resend_router
    kind: http.router
    meta: { server: "app:resend_gateway" }
    prefix: /
  - name: resend_emails
    kind: http.endpoint
    meta: { router: "app:resend_router" }
    method: POST
    path: /emails
    func: app:resend_stub
  - name: resend_requests
    kind: fs.directory
    directory: ./.wippy/resend-requests
    auto_init: true
  - name: resend_stub
    kind: function.lua
    source: file://resend_stub.lua
    method: handle
    modules: [http, fs, json, uuid]
    security:
      policies: [app:stub_capture_access]
  - name: stub_capture_access
    kind: security.policy
    policy:
      resources: ['app:resend_requests']
      actions: [fs.get]
      effect: allow
  - name: transport_status_access
    kind: security.policy
    policy:
      resources: [kickside.mail.resend:transport, status]
      actions: [contract.open, contract.call]
      effect: allow
  - name: stub_private_ip
    kind: security.policy
    policy:
      resources: ['127.0.0.1']
      actions: [http_client.private_ip]
      effect: allow
  - name: actor_probe
    kind: function.lua
    source: file://actor_probe.lua
    method: run
    imports:
      actor_probe: test.mail_driver_fixture.testing:actor_probe
    security:
      policies: [test.mail_driver_fixture.host:settings_probe_access]
  - name: settings_block_test
    kind: function.lua
    meta: { type: test, suite: mail_resend_settings }
    source: file://settings_block_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      settings_blocks: kickside.settings:settings_blocks
  - name: driver_test
    kind: function.lua
    meta: { type: test, suite: mail_resend }
    source: file://driver_test.lua
    method: run
    modules: [base64, uuid, fs, json, registry, contract]
    imports:
      test: wippy.test:test
      fixture: test.mail_driver_fixture.testing:fixture
      uploads_types: kickside.uploads:types
  - name: driver_example_test
    kind: function.lua
    meta: { type: test, suite: mail_resend_driver_example }
    source: file://driver_example_test.lua
    method: run
    modules: [uuid, fs, json]
    imports:
      test: wippy.test:test
      fixture: test.mail_driver_fixture.testing:fixture
