version: "1.0"
namespace: app

entries:
  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  - name: db
    kind: db.sql.sqlite
    file: ":memory:"
    foreign_keys: true

  - name: env_storage
    kind: env.storage.file
    meta: { type: envstorage }
    file_path: ./.wippy/test.env
    auto_create: true

  - name: temp_fs
    kind: fs.directory
    directory: ./.wippy

  - name: gateway
    kind: http.service
    addr: :19110
    lifecycle: { auto_start: true }

  - name: api
    kind: http.router
    meta: { server: gateway }
    prefix: /api

  - name: api_public
    kind: http.router
    meta: { server: gateway }
    prefix: /public

  - name: processes
    kind: process.host
    lifecycle: { auto_start: true }

  - name: user
    kind: security.policy
    groups: [asr_test]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: admin
    kind: security.policy
    groups: [asr_test_admin]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: session_delegate_stub
    kind: function.lua
    source: file://session_delegate_stub.lua
    method: handler

  - name: dep.kickside.users
    kind: ns.dependency
    component: kickside/users
    version: "*"
    parameters:
      - { name: kickside.users:public_router, value: app:api_public }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:user_security_scope, value: app:user }
      - { name: kickside.users:admin_security_scope, value: app:admin }
      - { name: kickside.users:login_role_resource, value: 'app:*' }
      - { name: kickside.users:ui_server, value: app:gateway }

  - name: dep.kickside.asr
    kind: ns.dependency
    component: kickside/asr
    version: '*'
    parameters:
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.connection:api_router
      value: app:api
    - name: kickside.connection:ui_server
      value: app:gateway
    - name: kickside.uploads.security:user_security_scope
      value: app:user
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.threads.hydration:user_security_scope
      value: app:user
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:admin
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.threads.hydration:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.jobs:temp_fs
      value: app:temp_fs
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.jobs:api_router
      value: app:api
    - name: kickside.core.scheduler:process_host
      value: app:processes
    - name: kickside.core.scheduler:env_storage
      value: app:env_storage
    - name: kickside.channel:target_db
      value: app:db
    - name: kickside.channel:process_host
      value: app:processes
    - name: kickside.channel:ui_server
      value: app:gateway
    - name: kickside.identity:target_db
      value: app:db
    - name: kickside.identity:api_router
      value: app:api
    - name: kickside.identity:ui_server
      value: app:gateway
    - name: kickside.agents:api_router
      value: app:api
    - name: kickside.agents:ui_server
      value: app:gateway
    - name: kickside.automation:api_router
      value: app:api
    - name: kickside.automation:target_db
      value: app:db
    - name: kickside.automation:ui_server
      value: app:gateway
    - name: kickside.transform:api_router
      value: app:api
    - name: kickside.transform:env_storage
      value: app:env_storage
    - name: kickside.transform:ui_server
      value: app:gateway
    - name: kickside.transform.security:user_security_scope
      value: app:user
    - name: kickside.users:public_router
      value: app:api_public
    - name: kickside.users:api_router
      value: app:api
    - name: kickside.users:target_db
      value: app:db
    - name: kickside.users:user_security_scope
      value: app:user
    - name: kickside.users:admin_security_scope
      value: app:admin
    - name: kickside.users:login_role_resource
      value: app:*
    - name: kickside.users:ui_server
      value: app:gateway
    - name: kickside.settings:target_db
      value: app:db
    - name: kickside.settings:api_router
      value: app:api
    - name: kickside.settings:ui_server
      value: app:gateway
    - name: kickside.uploads:database_resource
      value: app:db
    - name: kickside.uploads:env_storage
      value: app:env_storage
    - name: kickside.uploads:api_router
      value: app:api
    - name: kickside.uploads:storage_id
      value: app:temp_fs
    - name: kickside.uploads:ui_server
      value: app:gateway
    - name: wippy.bootloader:application_host
      value: app:processes
    - name: wippy.bootloader:env_storage
      value: app:env_storage
    - name: wippy.llm:process_host
      value: app:processes
    - name: wippy.llm:env_storage
      value: app:env_storage
    - name: wippy.migration:app_db
      value: app:db
    - name: userspace.dataflow:target_db
      value: app:db
    - name: userspace.dataflow:user_security_scope
      value: app:user
    - name: wippy.relay:application_host
      value: app:processes
    - name: wippy.relay:user_security_scope
      value: app:user
    - name: wippy.session:api_router
      value: app:api
    - name: wippy.session:database_resource
      value: app:db
    - name: wippy.session:default_host
      value: app:processes
    - name: wippy.session:delegation_func_id
      value: app:session_delegate_stub
    - name: wippy.session:env_storage
      value: app:env_storage
    - name: wippy.views:api_router
      value: app:api_public
    - name: wippy.views:env_storage
      value: app:env_storage

  - name: transcriber_stub
    kind: function.lua
    meta:
      comment: The transcriber this harness binds, so the stage has something to call without a model.
    source: file://transcriber_stub.lua
    method: transcribe

  - name: transcriber_binding
    kind: contract.binding
    meta:
      comment: The deployment's choice of transcriber -- here, the stub above.
    contracts:
      - contract: kickside.asr:transcriber
        default: true
        methods:
          transcribe: app:transcriber_stub

  - name: asr_pipeline_test
    kind: function.lua
    meta:
      type: test
      suite: asr
      comment: Creates a real audio upload and runs the stage against it, so storage, the contract and the artifact repository are all exercised.
    source: file://asr_pipeline_test.lua
    modules: [funcs, fs]
    imports:
      test: wippy.test:test
      upload_record_repo: kickside.uploads.persist:upload_record_repo
      artifact_parts_repo: kickside.uploads.persist:artifact_parts_repo
    method: run

  - name: asr_stage_test
    kind: function.lua
    meta:
      type: test
      suite: asr
      comment: Drives the transcription stage through injected dependencies, so no storage, contract or transcriber is touched.
    source: file://asr_stage_test.lua
    method: run
    imports:
      test: wippy.test:test
      stage: kickside.asr:stage_implementation

  - name: asr_smoke_test
    kind: function.lua
    meta:
      type: test
      suite: asr
      comment: Checks the module's declarations - the universal stage, the transcriber contract, the settings it ships, and that uploads actually resolves the stage into a pipeline.
    source: file://asr_smoke_test.lua
    modules: [registry]
    imports:
      test: wippy.test:test
      upload_type: kickside.uploads:upload_type
    method: run
