version: '1.0'
namespace: kickside.sso.providers.google.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Sso Google
    surface: kickside.sso.providers.google
    intent: module_access
    includes:
    - kickside.sso.providers.google.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.sso.providers.google:*
    - kickside.sso.providers.google.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.sso.providers.google:*
    - kickside.sso.providers.google.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
