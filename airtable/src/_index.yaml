version: '1.0'
namespace: kickside.airtable
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Airtable
      comment: Airtable HTTP connection provider with OAuth and separate reader/writer capabilities.
  - name: dep.kickside.component
    kind: ns.dependency
    component: kickside/component
    version: '*'
  - name: dep.kickside.connection
    kind: ns.dependency
    component: kickside/connection
    version: '>=0.3.1'
  - name: dep.kickside.contract
    kind: ns.dependency
    component: kickside/contract
    version: '*'
  - name: dep.kickside.oauth
    kind: ns.dependency
    component: kickside/oauth
    version: '*'
  - name: dep.kickside.settings
    kind: ns.dependency
    component: kickside/settings
    version: '*'
  - name: endpoints
    kind: registry.entry
    meta:
      type: kickside.connection:endpoints
    endpoints:
      api: https://api.airtable.com/v0
      content: https://content.airtable.com/v0
      authorization: https://airtable.com/oauth2/v1/authorize
      token: https://airtable.com/oauth2/v1/token
  - name: endpoint_api
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint api.
      description: Host supplied endpoint api.
    targets:
      - entry: kickside.airtable:endpoints
        path: .endpoints.api
    default: https://api.airtable.com/v0
  - name: endpoint_content
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint content.
      description: Host supplied endpoint content.
    targets:
      - entry: kickside.airtable:endpoints
        path: .endpoints.content
    default: https://content.airtable.com/v0
  - name: endpoint_authorization
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint authorization.
      description: Host supplied endpoint authorization.
    targets:
      - entry: kickside.airtable:endpoints
        path: .endpoints.authorization
      - entry: kickside.airtable.oauth:provider
        path: .connector_contract.context_values.oauth_authorization_endpoint
    default: https://airtable.com/oauth2/v1/authorize
  - name: endpoint_token
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint token.
      description: Host supplied endpoint token.
    targets:
      - entry: kickside.airtable:endpoints
        path: .endpoints.token
      - entry: kickside.airtable.oauth:provider
        path: .connector_contract.context_values.oauth_token_endpoint
    default: https://airtable.com/oauth2/v1/token
  - name: env_storage
    kind: ns.requirement
    meta:
      comment: Host supplied env storage.
      description: Host supplied env storage.
    targets:
      - entry: kickside.airtable.oauth:client_id
        path: .storage
      - entry: kickside.airtable.oauth:client_secret
        path: .storage
