version: '1.0'
namespace: kickside.telegram.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Telegram
    surface: kickside.telegram
    intent: module_access
    includes:
    - kickside.telegram.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.telegram:*
    - kickside.telegram.client:*
    - kickside.telegram.connection:*
    - kickside.telegram.inbound:*
    - kickside.telegram.polling:*
    - kickside.telegram.security:*
    - kickside.telegram.sink:*
    - kickside.telegram.traits:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.telegram:*
    - kickside.telegram.client:*
    - kickside.telegram.connection:*
    - kickside.telegram.inbound:*
    - kickside.telegram.polling:*
    - kickside.telegram.security:*
    - kickside.telegram.sink:*
    - kickside.telegram.traits:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
