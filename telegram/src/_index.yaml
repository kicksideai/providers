version: "1.0"
namespace: kickside.telegram

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Telegram
      comment: Telegram bot-token connection, reply provider, chat-id discovery, normalized inbound adapter, and agent traits.

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    meta:
      comment: Resolves Telegram connection components for the polling supervisor and transport.
    component: kickside/component

  - name: dep.kickside.connection
    version: '>=0.3.0'
    kind: ns.dependency
    meta:
      comment: Implements the shared connection contract and base connection helpers.
    component: kickside/connection

  - name: dep.kickside.contract
    version: '*'
    kind: ns.dependency
    meta:
      comment: Implements the component and deletable contracts used by Telegram connections.
    component: kickside/contract

  - name: dep.kickside.dm
    version: '*'
    kind: ns.dependency
    meta:
      comment: Receives normalized direct messages through the shared DM ingress contract.
    component: kickside/dm

  - name: dep.kickside.channel
    version: '*'
    kind: ns.dependency
    meta:
      comment: Receives normalized channel messages through the shared channel ingress contract.
    component: kickside/channel

  - name: dep.kickside.uploads
    version: '*'
    kind: ns.dependency
    meta:
      comment: Declares the attachment fetcher the upload ingest resolves Telegram refs through.
    component: kickside/uploads

  - name: dep.wippy.security
    version: '*'
    kind: ns.dependency
    component: wippy/security

  - name: endpoints
    kind: registry.entry
    meta:
      type: kickside.connection:endpoints
      comment: Instance endpoints resolved from namespace requirements.
    endpoints:
      api: https://api.telegram.org
      file: https://api.telegram.org
  - name: endpoint_api
    kind: ns.requirement
    meta:
      comment: Instance api endpoint.
      description: Instance api endpoint.
    default: https://api.telegram.org
    targets:
    - entry: kickside.telegram:endpoints
      path: .endpoints.api
  - name: endpoint_file
    kind: ns.requirement
    meta:
      comment: Instance file endpoint.
      description: Instance file endpoint.
    default: https://api.telegram.org
    targets:
    - entry: kickside.telegram:endpoints
      path: .endpoints.file
