version: "1.0"
namespace: kickside.telegram.inbound

entries:
  - name: fetcher
    kind: library.lua
    meta:
      comment: Shared implementation behind kickside.telegram.inbound:fetch_attachment.
    source: file://fetcher.lua
    imports:
      transport: kickside.telegram.client:transport

  - name: fetch_attachment
    kind: function.lua
    meta:
      comment: Resolve a Telegram file_id to bounded bytes for the declared uploads attachment fetcher.
    source: file://fetch_attachment.lua
    method: fetch_attachment
    imports:
      fetcher: kickside.telegram.inbound:fetcher

  - name: attachment_fetcher
    kind: registry.entry
    meta:
      type: attachment.fetcher
      comment: Resolve opaque Telegram refs without putting the bot token in an attachment envelope.
    provider: telegram
    fetch_func: kickside.telegram.inbound:fetch_attachment

  - name: inbound_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://inbound.lua
    modules: [contract]
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types

  - name: normalize_message
    kind: function.lua
    meta:
      comment: Normalize a Telegram private-message update into kickside.dm:receive payload shape.
    source: file://normalize_message.lua
    method: normalize
    modules: [contract]
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      implementation: kickside.telegram.inbound:inbound_implementation

  - name: receive_message
    kind: function.lua
    meta:
      comment: Normalize a Telegram private-message update and hand it to kickside.dm:receive.
    source: file://receive_message.lua
    method: receive_message
    modules: [contract]
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      implementation: kickside.telegram.inbound:inbound_implementation

  - name: receive_channel_message
    kind: function.lua
    meta:
      comment: Normalize a Telegram group/supergroup/channel update and hand it to kickside.channel:receive (routing + installer identity live there).
    source: file://receive_channel_message.lua
    method: receive_channel_message
    modules: [contract]
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      implementation: kickside.telegram.inbound:inbound_implementation
