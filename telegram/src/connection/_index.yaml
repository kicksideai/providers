version: "1.0"
namespace: kickside.telegram.connection

entries:
  - name: telegram_connection
    kind: contract.binding
    meta:
      title: Telegram
      comment: Connect a Telegram bot to send replies, show typing status, and route inbound Telegram updates.
      icon: tabler:brand-telegram
      provider: telegram
      group: Messaging
      tags: [telegram, messaging, bot, dm, reply_provider]
      class:
        - connection
        - reply_provider
      reply:
        max_length: 4096
        content_types: [text/plain, text/markdown]
        attachments: false
        embeds: false
      projections:
        - kind: telegram.polling.lifecycle
          on: lifecycle
          worker_ref: func://kickside.connection:reconcile_workers
          worker_config:
            hub_name: kickside.telegram.polling:polling.service
          events:
            input:
              - type: kickside.component.events:created
              - type: kickside.component.events:updated
              - type: kickside.component.events:deleted
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: bot_token
            label: Bot token
            type: password
            required: true
            placeholder: "123456:ABC..."
            help: Create a bot with BotFather and paste the bot token. The bot must be added to chats before it can send or receive messages there.
          - key: default_chat_id
            label: Default chat id
            type: text
            required: false
            placeholder: "-1001234567890 or @channel"
            help: Optional chat id used by resource discovery. Telegram bots cannot enumerate all chats; use inbound updates or a known chat id.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.telegram.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.telegram.connection:get_status
          test_connection: kickside.telegram.connection:test_connection
          discover_resources: kickside.telegram.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.telegram.connection:delete
      - contract: kickside.connection:reply_provider
        context_required:
          - component_id
        methods:
          send_reply: kickside.telegram.connection:send_reply
          update_reply: kickside.telegram.connection:update_reply
          send_status: kickside.telegram.connection:send_status

  - name: get_status
    kind: function.lua
    meta: { comment: "telegram connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: test_connection
    kind: function.lua
    meta: { comment: "telegram connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: discover_resources
    kind: function.lua
    meta: { comment: "telegram connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: send_reply
    kind: function.lua
    meta: { comment: "telegram reply_provider - send_reply" }
    source: file://send_reply.lua
    method: send_reply
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: update_reply
    kind: function.lua
    meta: { comment: "telegram reply_provider - update_reply" }
    source: file://update_reply.lua
    method: update_reply
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: send_status
    kind: function.lua
    meta: { comment: "telegram reply_provider - send_status (typing action)" }
    source: file://send_status.lua
    method: send_status
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  - name: delete
    kind: function.lua
    meta: { comment: "telegram connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
      implementation: kickside.telegram.connection:connection_lib

  # The shared implementation exposed as a library so the flow's pure shaping /
  # validation can be unit-tested as one module.
  - name: connection_lib
    kind: library.lua
    meta: { name: connection_lib, comment: "telegram connection - shared implementation (for tests)" }
    source: file://connection.lua
    imports:
      transport: kickside.telegram.client:transport
      types: kickside.telegram.client:types
      base: kickside.connection:base_connection
