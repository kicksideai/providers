version: "1.0"
namespace: kickside.phantombuster.traits

entries:
  - name: reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: PhantomBuster Reader
      public: true
      icon: tabler:robot
      comment: Inspects PhantomBuster organization, agents, and outputs.
      tags: [phantombuster, automation, read-only]
      web_component: kickside-phantombuster-picker
      provider: phantombuster
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: PhantomBuster connection component id selected by the trait picker.
          control_bounds:
            type: object
            description: Installed SourceOperationControlBounds/v1 document; read limits must be explicit and within these bounds.
        required: [connection_id, control_bounds]
        additionalProperties: false
    prompt: |
      You can query PhantomBuster through the PhantomBusterRead tool. Use it to
      inspect the org, list agents, inspect an agent, read live/recent output,
      list containers, inspect a container, and fetch result objects. The
      PhantomBuster connection and control bounds are selected on the trait
      context; both are required for every read.
    tools:
      - kickside.phantombuster.traits:get_tool

  - name: operator
    kind: registry.entry
    meta:
      type: agent.trait
      title: PhantomBuster Operator
      public: true
      icon: tabler:robot
      comment: Launches and controls PhantomBuster agent jobs.
      tags: [phantombuster, automation, write]
      web_component: kickside-phantombuster-picker
      provider: phantombuster
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: PhantomBuster connection component id selected by the trait picker.
          control_bounds:
            type: object
            description: Installed SourceOperationControlBounds/v1 document for tool output and operation controls.
        required: [connection_id, control_bounds]
        additionalProperties: false
    prompt: |
      You can run PhantomBuster jobs through the PhantomBusterWrite tool. Launch
      an agent now, schedule it to launch soon, or stop a running agent. Use
      write actions only when the user explicitly wants to run or stop a real
      automation. The PhantomBuster connection and control bounds are selected
      on the trait context; both are required for every write.
    tools:
      - kickside.phantombuster.traits:write_tool

  - name: manager
    kind: registry.entry
    meta:
      type: agent.trait
      title: PhantomBuster Manager
      public: true
      icon: tabler:robot
      comment: Full read and run access to PhantomBuster agents and jobs.
      tags: [phantombuster, automation, read-write]
      web_component: kickside-phantombuster-picker
      provider: phantombuster
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: PhantomBuster connection component id selected by the trait picker.
          control_bounds:
            type: object
            description: Installed SourceOperationControlBounds/v1 document for tool output and operation controls.
        required: [connection_id, control_bounds]
        additionalProperties: false
    prompt: |
      You can inspect and run PhantomBuster automations. Use PhantomBusterRead for
      get_org, get_org_resources, list_running_containers, list_agents,
      get_agent, list_deleted_agents, get_agent_output, list_containers,
      get_container, get_container_output, and get_result. Use
      PhantomBusterWrite for launch_agent, launch_agent_soon, and stop_agent. A
      typical run is: list_agents, launch_agent, then poll get_agent_output or
      get_container for the returned container.
      The PhantomBuster connection and control bounds are selected on the trait
      context; both are required for every operation.
    tools:
      - kickside.phantombuster.traits:get_tool
      - kickside.phantombuster.traits:write_tool

  - name: get_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: PhantomBuster Read
      tags: [phantombuster, automation, read-only]
      llm_alias: PhantomBusterRead
      llm_description: "Read PhantomBuster. Agent and container lists return compact identifiers, names, status and dates, with limit/offset and next_offset. get_agent/get_container return the complete object; get_agent_output/get_container_output/get_result return full provider content."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "Read action to perform.",
              "enum": [
                "get_org",
                "get_org_resources",
                "list_running_containers",
                "list_agents",
                "get_agent",
                "list_deleted_agents",
                "get_agent_output",
                "list_containers",
                "get_container",
                "get_container_output",
                "get_result"
              ]
            },
            "agent_id": {
              "type": "string",
              "description": "PhantomBuster agent ID. Required for get_agent, get_agent_output, and list_containers."
            },
            "container_id": {
              "type": "string",
              "description": "PhantomBuster container ID. Required for get_container, get_container_output, and get_result."
            },
            "mode": {
              "type": "string",
              "description": "Output mode for get_container_output.",
              "enum": ["json", "raw"]
            },
            "limit": {
              "type": "number",
              "description": "Required maximum rows per page for list actions; it must be within the installed control_bounds tool.list_limit range."
            },
            "offset": {
              "type": "integer",
              "description": "Zero-based list position for list actions; use next_offset from the prior provider page."
            },
            "from_output_pos": {
              "type": "number",
              "description": "For get_agent_output, return output from this output position."
            },
            "prev_container_id": {
              "type": "string",
              "description": "For get_agent_output, retrieve output after this previous container id."
            },
            "prev_status": {
              "type": "string",
              "description": "For get_agent_output, previously retrieved status."
            },
            "prev_runtime_event_index": {
              "type": "number",
              "description": "For get_agent_output, return runtime events after this index."
            }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Read PhantomBuster. Agent and container lists return compact identifiers, names, status and dates, with limit/offset and next_offset. get_agent/get_container return the complete object; get_agent_output/get_container_output/get_result return full provider content. Provider rejections return {success:false,error,status_code?,data?}; infrastructure failures return (nil, typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "true when the action succeeded; false with error otherwise."},
            "error": {"type": "string", "description": "Rejection message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "PhantomBuster's error body of a rejected request."},
            "id": {"type": ["string", "number"]},
            "name": {"type": "string"},
            "display_name": {"type": "string"},
            "plan": {"type": "string"},
            "count": {"type": "integer"},
            "limit": {"type": "integer"},
            "offset": {"type": "integer"},
            "next_offset": {"type": "integer"},
            "agents": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": ["string", "number"]}, "name": {"type": "string"}, "script": {"type": "string"}, "launch_type": {"type": "string"}, "last_end_type": {"type": "string"}, "last_ended_at": {"type": ["string", "number"]}, "running_count": {"type": "integer"}}}},
            "containers": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": ["string", "number"]}, "agent_id": {"type": ["string", "number"]}, "agent_name": {"type": "string"}, "status": {"type": "string"}, "created_at": {"type": ["string", "number"]}, "ended_at": {"type": ["string", "number"]}, "exit_code": {"type": "integer"}}}},
            "output": {"type": "string"},
            "status": {"type": "string"},
            "resultObject": {"type": ["string", "object", "array"]}
          }
        }
    source: file://get_tool.lua
    method: handler
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.phantombuster.client:transport
      output: kickside.phantombuster.client:output
      operation_policy: kickside.phantombuster.source:operation_policy

  - name: write_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read, state.write]
      title: PhantomBuster Write
      tags: [phantombuster, automation, write]
      llm_alias: PhantomBusterWrite
      llm_description: Launch, schedule, or stop PhantomBuster agents through the configured connection.
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "Write action to perform.",
              "enum": ["launch_agent", "launch_agent_soon", "stop_agent"]
            },
            "agent_id": {
              "type": "string",
              "description": "PhantomBuster agent ID. Required for launch_agent, launch_agent_soon, and stop_agent."
            },
            "argument_json": {
              "type": "string",
              "description": "Optional JSON-stringified argument override for launch_agent or launch_agent_soon."
            },
            "minutes": {
              "type": "number",
              "description": "For launch_agent_soon, non-negative minutes before launch."
            },
            "soft_abort": {
              "type": "boolean",
              "description": "For stop_agent, try a soft abort."
            },
            "cascade_to_all_slaves": {
              "type": "boolean",
              "description": "For stop_agent, recursively stop slave agents."
            },
            "dont_launch_soon": {
              "type": "boolean",
              "description": "For stop_agent, disable the next scheduled launch-soon run."
            },
            "switch_to_manual_launch": {
              "type": "boolean",
              "description": "For stop_agent, switch the agent to manual launch."
            }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected PhantomBuster request returns { success: false, error, status_code, data } with its error body. The PhantomBuster API response, with secret-like keys redacted: launch_agent and launch_agent_soon return the launched containerId; stop_agent returns the provider acknowledgement.",
          "properties": {
            "success": {"type": "boolean", "description": "true when the action succeeded; false with error otherwise."},
            "error": {"type": "string", "description": "Rejection message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "data": {"description": "PhantomBuster's error body of a rejected request."},
            "containerId": {"type": ["string", "number"]},
            "status": {"type": "string"}
          }
        }
    source: file://write_tool.lua
    method: handler
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.phantombuster.client:transport
      output: kickside.phantombuster.client:output
      operation_policy: kickside.phantombuster.source:operation_policy
