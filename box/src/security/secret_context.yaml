version: '1.0'
namespace: kickside.box.security
entries:
  - name: secret_context_dispatch
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: funcs.call
      resources:
        - kickside.component.system:read_runtime_context
        - kickside.component.system:read_private_context
        - kickside.component.system:list_runtime_context
      effect: allow
  - name: secret_context_read
    kind: security.policy
    meta: {private: true, service_only: true}
    policy:
      actions: component.secrets.read
      resources: [kickside.box.connection:connection]
      effect: allow
