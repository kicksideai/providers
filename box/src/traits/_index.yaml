      type: agent.trait
      title: Box Reader
      public: true
      comment: Read Box resources through a selected connection.
      icon: simple-icons:box
      tags:
        - box
        - read
      provider: box
      web_component: kickside-connection-trait-picker
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
        additionalProperties: false
