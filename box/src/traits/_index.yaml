      get_download_url, list_file_versions, list_file_comments, list_file_collaborations, list_folder_collaborations,
      get_collaboration, list_collections, list_collection_items, list_trash, get_trashed_file, get_trashed_folder,
      list_file_metadata, get_file_metadata, list_events, list_tasks, get_task, list_task_assignments, list_webhooks,
      get_webhook, get_upload_session, list_upload_session_parts. Pass action-specific params. Follow next_cursor
      using the provider cursor parameter. Select the account on this capability. Use the writer capability for
      changes.'
    tools:
      - kickside.box.traits:read_tool
