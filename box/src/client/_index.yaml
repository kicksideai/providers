    kind: library.lua
    source: file://config.lua
    modules:
      - json
    imports:
      endpoints: kickside.connection:endpoints
      types: kickside.connection.client:types
  - name: service
    kind: library.lua
    source: file://service.lua
    imports:
      driver: kickside.connection.client:driver
      config: kickside.box.client:config
      types: kickside.connection.client:types
