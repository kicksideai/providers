version: "1.0"
workspace:
  replacements:
    kickside/mail-driver-fixture: ../../test-support/mail-driver-fixture
    kickside/mail: ../../../components/mail
    kickside/mail-sendgrid: ..
    kickside/component: ../../../kickside/core/component
    kickside/contract: ../../../kickside/core/contract
    kickside/core: ../../../kickside/core/core
    kickside/execution: ../../../kickside/core/execution
    kickside/jobs: ../../../kickside/core/jobs
    kickside/realtime-dispatch: ../../../kickside/core/realtime-dispatch
    kickside/security: ../../../kickside/platform/security
    kickside/settings: ../../../kickside/platform/settings
    kickside/uploads: ../../../kickside/platform/uploads
    kickside/users: ../../../kickside/platform/users
    kickside/doc2md: ../../../converters/doc2md
override:
  app:dep.driver:parameters:
      - { name: "kickside.mail.sendgrid:api_base_url", value: "https://127.0.0.1:${stub_port}/v3/mail/send" }
      - { name: "kickside.mail.security:user_security_scope", value: "test.mail_driver_fixture.host:user" }
      - { name: "kickside.mail:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.mail:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.mail.sendgrid.security:user_security_scope", value: "test.mail_driver_fixture.host:user" }
  app:sendgrid_gateway:addr: "127.0.0.1:${stub_port}"
vars:
  stub_port: 0
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_mail_sendgrid
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      test.mail_driver_fixture.host:db:kind: db.sql.postgres
      test.mail_driver_fixture.host:db:host: ${pg_host}
      test.mail_driver_fixture.host:db:port: ${pg_port}
      test.mail_driver_fixture.host:db:database: ${pg_database}
      test.mail_driver_fixture.host:db:username: ${pg_username}
      test.mail_driver_fixture.host:db:password: ${pg_password}
      test.mail_driver_fixture.host:db:options.sslmode: disable
      test.mail_driver_fixture.host:db:pool.max_open: 16
      test.mail_driver_fixture.host:db:pool.max_idle: 8
registry:
  dispatch_internal_kinds:
    - registry.entry
    - ns.requirement
    - ns.dependency
    - ns.definition
    - security.scope
