version: "1.0"
namespace: app
entries:
  - name: definition
    kind: ns.definition
    meta: { title: Example Workspace }
  - name: dep.fixture
    kind: ns.dependency
    component: kickside/mail-driver-fixture
    version: "*"
  - name: dep.driver
    kind: ns.dependency
    component: kickside/mail-sendgrid
    version: "*"
  - name: sendgrid_gateway
    kind: http.service
    addr: "127.0.0.1:0"
    lifecycle: { auto_start: true }
  - name: sendgrid_router
    kind: http.router
    meta: { server: "app:sendgrid_gateway" }
    prefix: /
  - name: sendgrid_mail_send
    kind: http.endpoint
    meta: { router: "app:sendgrid_router" }
    method: POST
    path: /v3/mail/send
    func: app:sendgrid_stub
  - name: sendgrid_requests
    kind: fs.directory
    directory: ./.wippy/sendgrid-requests
    auto_init: true
  - name: sendgrid_stub
    kind: function.lua
    source: file://sendgrid_stub.lua
    method: handle
    modules: [http, fs, json, uuid, time]
    security:
      policies: [app:stub_capture_access]
  - name: stub_capture_access
    kind: security.policy
    policy:
      resources: ['app:sendgrid_requests']
      actions: [fs.get]
      effect: allow
  - name: transport_status_access
    kind: security.policy
    policy:
      resources: [kickside.mail.sendgrid:transport, status]
      actions: [contract.open, contract.call]
      effect: allow
  - name: stub_private_ip
    kind: security.policy
    policy:
      resources: ['127.0.0.1']
      actions: [http_client.private_ip]
      effect: allow
  - name: actor_probe
    kind: function.lua
    source: file://actor_probe.lua
    method: run
    imports:
      actor_probe: kickside.mail_driver_fixture.testing:actor_probe
    security:
      policies: [kickside.mail_driver_fixture.host:settings_probe_access]
  - name: settings_block_test
    kind: function.lua
    meta: { type: test, suite: mail_sendgrid_settings }
    source: file://settings_block_test.lua
    method: run
    modules: [registry]
    imports:
      test: wippy.test:test
      settings_blocks: kickside.settings:settings_blocks
  - name: driver_test
    kind: function.lua
    meta: { type: test, suite: mail_sendgrid }
    source: file://driver_test.lua
    method: run
    modules: [uuid, fs, json, registry, contract]
    imports:
      test: wippy.test:test
      cases: app:driver_cases
      fixture: kickside.mail_driver_fixture.testing:fixture
  - name: delivery_test
    kind: function.lua
    meta: { type: test, suite: mail_sendgrid }
    source: file://delivery_test.lua
    method: run
    modules: [json, registry]
    imports:
      test: wippy.test:test
      cases: app:driver_cases
      fixture: kickside.mail_driver_fixture.testing:fixture
  - name: driver_cases
    kind: library.lua
    source: file://driver_cases.lua
    modules: [uuid, fs, json, base64]
    imports:
      test: wippy.test:test
      fixture: kickside.mail_driver_fixture.testing:fixture
