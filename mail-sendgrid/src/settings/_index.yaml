version: "1.0"
namespace: kickside.mail.sendgrid.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition", comment: Stores the API key for SendGrid delivery. }
    namespace: kickside.mail.sendgrid
    key: api_key
    title: API key
    description: API key authorized to send mail through SendGrid.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: kickside.mail.sendgrid.settings:validate_api_key
  - name: validate_api_key
    kind: function.lua
    meta: { comment: Checks the provider API key format. }
    source: file://validate.lua
    method: api_key
    imports: {config: kickside.mail.driver:config}
  - name: settings_block
    kind: registry.entry
    meta:
      type: kickside.settings:block
      comment: The SendGrid entry in System Settings, beside Mail; the shared settings card edits this namespace.
    key: mail-sendgrid
    title: SendGrid
    icon: simple-icons:sendgrid
    group: Integrations
    order: 33
    component_tag: kickside-settings-provider
    namespace: kickside.mail.sendgrid
    config:
      namespace: kickside.mail.sendgrid
      title: SendGrid
      icon: simple-icons:sendgrid
      help: SendGrid API key for Mail delivery.
