version: "1.0"
namespace: kickside.mail.sendgrid.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: kickside.mail.sendgrid
    key: api_key
    title: API key
    description: API key authorized to send mail through SendGrid.
    scope: global
    visible: false
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: kickside.mail.settings:validate_api_key
