version: "1.0"
namespace: kickside.mail.sendgrid
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: SendGrid Mail }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: api_base_url
    kind: ns.requirement
    default: https://api.sendgrid.com
    targets:
      - { entry: "kickside.mail.sendgrid:endpoints", path: ".endpoints.api" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods:
          send: kickside.mail.sendgrid.transport:send
          status: kickside.mail.sendgrid.transport:status
