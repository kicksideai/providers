version: "1.0"
namespace: kickside.mail.sendgrid
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: SendGrid Mail }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: types
    kind: library.lua
    source: file://types.lua
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: api_base_url
    kind: ns.requirement
    default: https://api.sendgrid.com
    targets:
      - { entry: "kickside.mail.sendgrid:endpoints", path: ".endpoints.api" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods: {send: kickside.mail.sendgrid:send, status: kickside.mail.sendgrid:status}
  - name: send
    kind: function.lua
    source: file://sendgrid.lua
    method: send
    imports:
      types: kickside.mail.sendgrid:types
      mail_types: kickside.mail:types
      settings: kickside.mail.driver:config
      delivery: kickside.mail.driver:http
    security:
      policies:
        - kickside.mail.sendgrid.security:settings_read
        - kickside.mail.sendgrid.security:settings_admin_read
        - kickside.mail.sendgrid.security:http_access
        - kickside.mail.sendgrid.security:provider_reads
  - name: status
    kind: function.lua
    source: file://sendgrid.lua
    method: status
    imports:
      types: kickside.mail.sendgrid:types
      mail_types: kickside.mail:types
      settings: kickside.mail.driver:config
      delivery: kickside.mail.driver:http
    security:
      policies: [kickside.mail.sendgrid.security:settings_read, kickside.mail.sendgrid.security:settings_admin_read]
