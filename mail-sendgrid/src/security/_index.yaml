version: "1.0"
namespace: kickside.mail.sendgrid.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      comment: Makes the driver discoverable to application members.
      title: SendGrid Mail
      surface: kickside.mail.sendgrid
      intent: module_access
      includes:
        - kickside.mail.sendgrid.security:module_runtime
    groups: []
    policy:
      resources: [kickside.mail.sendgrid:definition]
      actions: [registry.get, registry.find]
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta: { private: true, comment: Lets application members discover this driver’s transport entries. }
    groups: []
    policy:
      resources: [kickside.mail.sendgrid:transport, kickside.mail.sendgrid.transport:send, kickside.mail.sendgrid.transport:status]
      actions: [registry.get, registry.find]
      effect: allow
  - name: driver_admin
    kind: security.policy
    meta:
      comment: Exposes this driver’s Settings declarations to delivery administrators.
      title: Administer SendGrid mail delivery
      surface: kickside.mail.sendgrid
      intent: module_management
    groups: []
    policy:
      resources:
        - kickside.mail.sendgrid.settings:setting_api_key
        - kickside.mail.sendgrid.settings:validate_api_key
      actions: [registry.get, registry.find, funcs.call]
      effect: allow
  - name: user_security_scope
    kind: ns.requirement
    default: kickside.security.groups:members
    meta:
      value_kind: security.scope
      description: Application member scope with access to the driver module.
      comment: Grants member discovery of the driver.
    targets:
      - { entry: kickside.mail.sendgrid.security:module_access, path: ".groups +=" }
      - { entry: kickside.mail.sendgrid.security:module_runtime, path: ".groups +=" }
  - name: transport_open
    kind: security.policy
    meta: {private: true, comment: Admits this driver to the Mail transports group. }
    groups: [kickside.mail.security:transports]
    policy:
      resources: [kickside.mail.sendgrid:transport]
      actions: [contract.open]
      effect: allow
  - name: settings_read
    kind: security.policy
    meta: {private: true, comment: Opens the Settings contract for the driver namespace. }
    policy:
      resources: [kickside.settings:settings, kickside.settings:settings_binding, get_namespace]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
  - name: settings_admin_read
    kind: security.policy
    meta: {private: true, comment: Allows the driver to read its protected configuration. }
    policy:
      resources: [kickside.settings.api:list_settings.endpoint]
      actions: [access]
      effect: allow
  - name: http_access
    kind: security.policy
    meta: { private: true, comment: Restricts sends to the linked outbound HTTPS destinations. }
    policy:
      resources: []
      actions: [http_client.request]
      effect: allow
  - name: provider_reads
    kind: security.policy
    meta: { private: true, comment: Reads the linked delivery destinations. }
    policy:
      resources: [kickside.mail.sendgrid:endpoints]
      actions: [registry.get]
      effect: allow
