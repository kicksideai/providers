version: '1.0'
namespace: kickside.dropbox
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Dropbox
      comment: Dropbox HTTP connection provider with OAuth and separate reader/writer capabilities.
  - name: dep.kickside.component
    kind: ns.dependency
    component: kickside/component
    version: '*'
  - name: dep.kickside.connection
    kind: ns.dependency
    component: kickside/connection
    version: '*'
  - name: dep.kickside.contract
    kind: ns.dependency
    component: kickside/contract
    version: '*'
  - name: dep.kickside.oauth
    kind: ns.dependency
    component: kickside/oauth
    version: '*'
  - name: dep.kickside.settings
    kind: ns.dependency
    component: kickside/settings
    version: '*'
  - name: endpoints
    kind: registry.entry
    meta:
      type: kickside.connection:endpoints
    endpoints:
      api: https://api.dropboxapi.com/2
      content: https://content.dropboxapi.com/2
      authorization: https://www.dropbox.com/oauth2/authorize
      token: https://api.dropboxapi.com/oauth2/token
  - name: endpoint_api
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint api.
      description: Host supplied endpoint api.
    targets:
      - entry: kickside.dropbox:endpoints
        path: .endpoints.api
    default: https://api.dropboxapi.com/2
  - name: endpoint_content
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint content.
      description: Host supplied endpoint content.
    targets:
      - entry: kickside.dropbox:endpoints
        path: .endpoints.content
    default: https://content.dropboxapi.com/2
  - name: endpoint_authorization
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint authorization.
      description: Host supplied endpoint authorization.
    targets:
      - entry: kickside.dropbox:endpoints
        path: .endpoints.authorization
      - entry: kickside.dropbox.oauth:provider
        path: .connector_contract.context_values.oauth_authorization_endpoint
    default: https://www.dropbox.com/oauth2/authorize
  - name: endpoint_token
    kind: ns.requirement
    meta:
      comment: Host supplied endpoint token.
      description: Host supplied endpoint token.
    targets:
      - entry: kickside.dropbox:endpoints
        path: .endpoints.token
      - entry: kickside.dropbox.oauth:provider
        path: .connector_contract.context_values.oauth_token_endpoint
    default: https://api.dropboxapi.com/oauth2/token
  - name: env_storage
    kind: ns.requirement
    meta:
      comment: Host supplied env storage.
      description: Host supplied env storage.
    targets:
      - entry: kickside.dropbox.oauth:client_id
        path: .storage
      - entry: kickside.dropbox.oauth:client_secret
        path: .storage
