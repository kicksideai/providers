version: '1.0'
namespace: kickside.dropbox.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      title: Dropbox
      surface: kickside.dropbox
      intent: module_access
      includes:
        - kickside.dropbox.security:module_runtime
    groups: []
    policy:
      resources:
        - kickside.dropbox:*
        - kickside.dropbox.client:*
        - kickside.dropbox.connection:*
        - kickside.dropbox.oauth:*
        - kickside.dropbox.traits:*
        - kickside.dropbox.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta:
      private: true
    groups: []
    policy:
      resources:
        - kickside.dropbox:*
        - kickside.dropbox.client:*
        - kickside.dropbox.connection:*
        - kickside.dropbox.oauth:*
        - kickside.dropbox.traits:*
        - kickside.dropbox.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
