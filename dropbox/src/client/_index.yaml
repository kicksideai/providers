version: '1.0'
namespace: kickside.dropbox.client
entries:
  - name: config
    kind: library.lua
    source: file://config.lua
    modules:
      - json
    imports:
      endpoints: kickside.connection:endpoints
      types: kickside.connection.client:types
  - name: service
    kind: library.lua
    source: file://service.lua
    imports:
      wire: kickside.dropbox.client:wire
      driver: kickside.connection.client:driver
      config: kickside.dropbox.client:config
      types: kickside.connection.client:types
  - name: wire
    kind: library.lua
    meta: {private: true}
    source: file://wire.lua
    modules: [json]
    imports:
      driver: kickside.connection.client:driver
      types: kickside.connection.client:types
