version: "1.0"
namespace: kickside.hubspot.connection

entries:
  - name: hubspot_connection
    kind: contract.binding
    meta:
      title: HubSpot
      comment: Connect HubSpot with a private-app access token to read and write CRM records.
      icon: simple-icons:hubspot
      provider: hubspot
      group: CRM
      tags: [hubspot, crm, contacts, deals]
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: api_key
            label: Private app token
            type: password
            required: true
            placeholder: pat-...
            help: Create a Private App in HubSpot (Settings → Integrations → Private Apps) with CRM scopes, and paste its access token.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.hubspot.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.hubspot.connection:get_status
          test_connection: kickside.hubspot.connection:test_connection
          discover_resources: kickside.hubspot.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.hubspot.connection:delete

  - name: connection_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://connection.lua
    imports:
      transport: kickside.hubspot.client:transport
      types: kickside.hubspot.client:types
      base: kickside.connection:base_connection

  - name: get_status
    kind: function.lua
    meta: { comment: "hubspot connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      transport: kickside.hubspot.client:transport
      types: kickside.hubspot.client:types
      base: kickside.connection:base_connection
      implementation: kickside.hubspot.connection:connection_implementation

  - name: test_connection
    kind: function.lua
    meta: { comment: "hubspot connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      transport: kickside.hubspot.client:transport
      types: kickside.hubspot.client:types
      base: kickside.connection:base_connection
      implementation: kickside.hubspot.connection:connection_implementation

  - name: discover_resources
    kind: function.lua
    meta: { comment: "hubspot connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      transport: kickside.hubspot.client:transport
      types: kickside.hubspot.client:types
      base: kickside.connection:base_connection
      implementation: kickside.hubspot.connection:connection_implementation

  - name: delete
    kind: function.lua
    meta: { comment: "hubspot connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      transport: kickside.hubspot.client:transport
      types: kickside.hubspot.client:types
      base: kickside.connection:base_connection
      implementation: kickside.hubspot.connection:connection_implementation
