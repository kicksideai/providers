version: "1.0"
namespace: kickside.memory.persist

# The memory read model on target_db: store rows, typed items with their
# provenance, vectors and full-text index, capture cursors and deferred runs.
# Every write runs inside the component existence fence.

entries:
  - name: db
    kind: library.lua
    meta:
      comment: Connection, transaction and component-fence helpers for the memory tables.
    source: file://db.lua
    modules: [sql, registry]
    imports:
      component: kickside.component:component
      types: kickside.memory:types

  - name: stores
    kind: library.lua
    meta:
      comment: Memory store rows and the bounded purge of a memory's rows.
    source: file://stores.lua
    modules: [json]
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index

  - name: items
    kind: library.lua
    meta:
      comment: Ledger fold into typed items, item reads and hybrid search.
    source: file://items.lua
    modules: [sql, json]
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index

  - name: runs
    kind: library.lua
    meta:
      comment: Deferred run records with frozen identity, capture cursors and soul pins.
    source: file://runs.lua
    modules: [sql, json]
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
