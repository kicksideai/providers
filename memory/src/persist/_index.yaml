version: "1.0"
namespace: kickside.memory.persist

entries:
  - name: db
    kind: library.lua
    meta:
      comment: Connection, transaction and component-fence helpers for the memory tables.
    source: file://db.lua
    modules: [sql, registry]
    imports:
      component: kickside.component:component
      types: kickside.memory:types

  - name: stores
    kind: library.lua
    meta:
      comment: Memory store rows and the bounded purge of a memory's rows.
    source: file://stores.lua
    modules: []
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index

  - name: items
    kind: library.lua
    meta:
      comment: Item queries and hybrid search.
    source: file://items.lua
    modules: []
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index

  - name: payloads
    kind: library.lua
    source: file://payloads.lua
    modules: [sql, json]
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index

  - name: fold
    kind: library.lua
    source: file://fold.lua
    modules: [sql]
    imports:
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index
      memory_items: kickside.memory.persist:items
      memory_payloads: kickside.memory.persist:payloads

  - name: runs
    kind: library.lua
    meta:
      comment: Deferred run records with frozen identity, capture cursors and soul pins.
    source: file://runs.lua
    modules: [sql, json]
    imports:
      jobs: kickside.core.jobs:jobs
      jobs_wake: kickside.core.jobs.persist:wake
      memory_db: kickside.memory.persist:db
      types: kickside.memory:types
      search_index: kickside.search_index:index
