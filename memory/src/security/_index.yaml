version: '1.0'
namespace: kickside.memory.security

entries:
- name: module_access
  kind: security.policy
  meta:
    title: Memory
    surface: kickside.memory
    intent: module_access
    includes:
    - kickside.memory.security:module_runtime
    - kickside.memory.security:endpoint_access
  groups: []
  policy: &memory_runtime_policy
    resources:
    - kickside.memory:*
    - kickside.memory.agent:*
    - kickside.memory.security:*
    - kickside.memory.engine:*
    - kickside.memory.persist:*
    - kickside.memory.api:*
    - kickside.memory.events:*
    - kickside.memory.migrations:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow

- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy: *memory_runtime_policy

- name: endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.memory.api:list_memories.endpoint
    - kickside.memory.api:list_topics.endpoint
    - kickside.memory.api:list_items.endpoint
    - kickside.memory.api:get_item.endpoint
    - kickside.memory.api:create_item.endpoint
    - kickside.memory.api:edit_item.endpoint
    - kickside.memory.api:forget_item.endpoint
    - kickside.memory.api:archive_item.endpoint
    - kickside.memory.api:restore_item.endpoint
    - kickside.memory.api:list_conflicts.endpoint
    - kickside.memory.api:resolve_conflict.endpoint
    - kickside.memory.api:status.endpoint
    actions: access
    effect: allow

- name: deferred_owner
  kind: security.policy
  meta:
    private: true
  policy:
    resources:
    - kickside.memory.engine:derive_worker
    - kickside.memory.engine:consolidate_worker
    - kickside.memory.engine:reembed_worker
    actions: kickside.execution.defer
    effect: allow

- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: "Application security group whose members use the memory module: its endpoints, tools and contracts."
  targets:
  - entry: kickside.memory.security:module_access
    path: .groups +=
  - entry: kickside.memory.security:module_runtime
    path: .groups +=
  - entry: kickside.memory.security:endpoint_access
    path: .groups +=
