version: '1.0'
namespace: kickside.memory.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Memory
    surface: kickside.memory
    intent: module_access
    includes:
    - kickside.memory.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.memory:*
    - kickside.memory.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.memory:*
    - kickside.memory.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application group allowed to resolve and run the public Memory capability.
  targets:
  - entry: kickside.memory.security:module_access
    path: .groups +=
  - entry: kickside.memory.security:module_runtime
    path: .groups +=
