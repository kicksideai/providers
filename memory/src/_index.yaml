# SPDX-License-Identifier: LicenseRef-KickSide-Community-1.0
version: "1.0"
namespace: kickside.memory

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Memory
      comment: Memory knowledge bases (kb_type memory) holding typed, versioned memory items on a ledger thread, and the agent trait and memory provider that capture conversations into them, render the pinned soul, and recall from them.

  - name: dep.wippy.agent
    version: '>=0.5.7'
    kind: ns.dependency
    component: wippy/agent
    meta:
      comment: Lifecycle, checkpoint, memory and run_context contracts; the after_persist lifecycle phase.

  - name: dep.wippy.llm
    version: '*'
    kind: ns.dependency
    component: wippy/llm

  - name: dep.wippy.migration
    version: '*'
    kind: ns.dependency
    component: wippy/migration

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    component: kickside/component
    meta:
      comment: Memory knowledge bases are components; access, public meta and the write fence go through the component service.

  - name: dep.kickside.contract
    version: '*'
    kind: ns.dependency
    component: kickside/contract
    meta:
      comment: Implements embeddable, queryable and deletable; shared error helpers.

  - name: dep.kickside.core
    version: '*'
    kind: ns.dependency
    component: kickside/core
    meta:
      comment: The memory ledger is the knowledge base's thread; the ledger projection folds it.

  - name: dep.kickside.jobs
    version: '*'
    kind: ns.dependency
    component: kickside/jobs
    meta:
      comment: Derive, consolidation and re-embed runs execute as jobs.

  - name: dep.kickside.execution
    version: '*'
    kind: ns.dependency
    component: kickside/execution
    meta:
      comment: Deferred runs hold and re-admit the requester's execution identity.

  - name: dep.kickside.knowledge
    version: '*'
    kind: ns.dependency
    component: kickside/knowledge
    meta:
      comment: Memory is a knowledge-base engine of the knowledge control plane.

  - name: dep.kickside.search_index
    version: '>=0.1.1'
    kind: ns.dependency
    component: kickside/search-index
    meta:
      comment: Hybrid retrieval and group-aware conflict paging over the memory item tables (release search-index before Memory).

  # Host requirements.
  - name: ui_server
    kind: ns.requirement
    meta:
      comment: HTTP server the memory web components are served from.
      description: HTTP server the memory web components are served from.
    targets:
      - entry: kickside.memory:ui_static
        path: .meta.server

  - name: api_router
    kind: ns.requirement
    meta:
      value_kind: http.router
      comment: Authenticated HTTP router for the memory API.
      description: Authenticated HTTP router for the memory API.
    targets:
      - { entry: kickside.memory.api:list_memories.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_topics.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_items.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:get_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:create_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:edit_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:forget_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:archive_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:restore_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_conflicts.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:resolve_conflict.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:status.endpoint, path: .meta.router }

  - name: target_db
    kind: ns.requirement
    meta:
      value_kind: db.sql
      comment: SQL database resource backing the kickside_memory_kb_* tables; the component database.
      description: SQL database resource backing the kickside_memory_kb_* tables; the component database.
    targets:
      - entry: kickside.memory.migrations:01_memory_schema
        path: .meta.target_db
      - entry: kickside.memory:db_config
        path: .meta.db_id

  - name: db_config
    kind: registry.entry
    meta:
      comment: Holds the configured memory database id (rewritten by target_db).
      db_id: ""

  - name: types
    kind: library.lua
    meta:
      comment: Memory vocabulary - kinds, scopes, statuses, ledger events, run types and value helpers.
    source: file://types.lua
    modules: [time, json, security]
    imports:
      canonical_json: kickside.contract:canonical_json

  - name: config
    kind: library.lua
    meta:
      comment: Engine configuration - defaults and schema from the engine descriptor, server-side validation.
    source: file://config.lua
    modules: [registry]
    imports:
      types: kickside.memory:types

  # Web components.
  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built KickSide memory web components.
    directory: ./static

  - name: ui_static
    kind: http.static
    meta:
      server: ""
    path: /kickside-memory
    fs: kickside.memory:ui_fs
    options:
      cache: "no-cache"

  - name: memory_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_view
      title: Memory
      comment: Memory knowledge base page - memories, conflicts, activity and settings.
      tag_name: kickside-memory
      base_path: kickside-memory
      entry_point: index.js
      announced: true
      auto_register: true

  - name: memory_create_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_create_view
      title: Memory Settings
      comment: The memory engine's pane of the knowledge base create and edit dialog.
      tag_name: kickside-memory-create
      base_path: kickside-memory
      entry_point: memory_create.js
      announced: true
      auto_register: true

  # Knowledge-base engine. The component impl binding carries the store
  # contracts; the descriptor declares the ledger thread, its projection,
  # configuration and the manage view.
  - name: memory_kb
    kind: contract.binding
    meta:
      title: Memory
      comment: Memory knowledge base - typed memory items on a ledger thread with hybrid recall.
      icon: tabler:brain
      class: [knowledge]
      events:
        output:
          - type: kickside.memory.events:item.added
          - type: kickside.memory.events:item.superseded
          - type: kickside.memory.events:item.merged
          - type: kickside.memory.events:item.conflicted
          - type: kickside.memory.events:item.revised
          - type: kickside.memory.events:item.archived
          - type: kickside.memory.events:item.forgotten
          - type: kickside.memory.events:item.restored
          - type: kickside.memory.events:provenance.added
          - type: kickside.memory.events:capture.advanced
          - type: kickside.memory.events:consolidation.completed
          - type: kickside.knowledge.events:content.upserted
          - type: kickside.knowledge.events:content.deleted
      component:
        create: { view: kickside.knowledge:kb_create_view }
        manage: { view: kickside.knowledge:knowledge_view, deep_link: true }
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status
      - contract: kickside.contract:embeddable
        context_required: [component_id]
        methods:
          embed_content: kickside.memory.engine:embed_func
          embed_reference: kickside.knowledge.binding:embed_reference_func
      - contract: kickside.contract:queryable
        context_required: [component_id]
        methods:
          query: kickside.memory.engine:query_func
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: kickside.memory.engine:delete_func

  - name: store_lifecycle
    kind: contract.binding
    meta:
      title: Memory Store Lifecycle
      comment: Memory engine implementation of kickside.knowledge:kb_store_lifecycle, named by the engine descriptor's store_binding.
    contracts:
      - contract: kickside.knowledge:kb_store_lifecycle
        methods:
          create_store: kickside.memory.engine:create_store
          get_store: kickside.memory.engine:get_store
          update_config: kickside.memory.engine:update_config
          delete_store: kickside.memory.engine:delete_store

  - name: maintainable
    kind: contract.binding
    meta:
      comment: Memory maintenance - bring consolidation forward, re-embed every item, read the latest runs.
    contracts:
      - contract: kickside.knowledge:maintainable
        context_required: [component_id]
        methods:
          schedule_resummarize: kickside.memory.engine:schedule_resummarize_func
          schedule_reembed: kickside.memory.engine:schedule_reembed_func
          maintenance_status: kickside.memory.engine:maintenance_status_func

  - name: engine_memory
    kind: registry.entry
    meta:
      type: kickside.kb_engine
      kb_type: memory
      title: Memory
      label: Memory
      comment: Typed long-term memory for agents - facts, preferences, profile, identity and rules, versioned with provenance.
      icon: tabler:brain
      impl_id: kickside.memory:memory_kb
      embed_binding: kickside.memory:memory_kb
      query_binding: kickside.memory:memory_kb
      maintenance_binding: kickside.memory:maintainable
      store_contract: kickside.knowledge:kb_store_lifecycle
      store_binding: kickside.memory:store_lifecycle
      is_graph: false
      thread:
        class: kickside.knowledge.injection
      # The ledger is the source of truth and the read model is rebuilt from it,
      # so its events are kept for the lifetime of the memory.
      retention:
        event_days: 36500
      ui:
        badge: { label: Memory, icon: tabler:brain, tone: info }
        stats:
          - { path: item_count, singular: memory, plural: memories, icon: tabler:brain }
          - { path: conflict_count, singular: conflict, plural: conflicts, icon: tabler:alert-triangle, min: 1 }
      component:
        create: { view: kickside.memory:memory_create_view }
        manage: { view: kickside.memory:memory_view }
      projections:
        - kind: kickside.memory.ledger
          projection_key: ledger
          cursor_key: ledger
          worker_ref: "func://kickside.memory.engine:ledger_projection"
          input_mode: prefetch_events
          events:
            input:
              - type: kickside.memory.events:item.added
              - type: kickside.memory.events:item.superseded
              - type: kickside.memory.events:item.merged
              - type: kickside.memory.events:item.conflicted
              - type: kickside.memory.events:item.revised
              - type: kickside.memory.events:item.archived
              - type: kickside.memory.events:item.forgotten
              - type: kickside.memory.events:item.restored
              - type: kickside.memory.events:provenance.added
              - type: kickside.memory.events:capture.advanced
              - type: kickside.memory.events:consolidation.completed
              - type: kickside.knowledge.events:content.upserted
      default_config:
        extraction_model: class:fast
        judge_model: class:fast
        extraction_instructions: ""
        recall_max_items: 5
        recall_max_length: 4000
        soul_agent_max_chars: 2000
        soul_owner_max_chars: 2000
        consolidation_interval_hours: 24
        capture_conversation: true
        capture_experience: false
      config_schema:
        type: object
        additionalProperties: false
        properties:
          extraction_model:
            order: 1
            type: string
            minLength: 1
            title: Extraction model
            description: Model that reads conversations and picks what to remember. Consolidation uses it too.
            web_component: wc-model-picker
          judge_model:
            order: 2
            type: string
            minLength: 1
            title: Reconcile model
            description: Model that decides whether a new memory is new, a duplicate, an update or a contradiction.
            web_component: wc-model-picker
          extraction_instructions:
            group: advanced
            order: 3
            type: string
            title: Memory policy
            description: Extra instructions for what this memory keeps.
            format: textarea
          recall_max_items:
            group: advanced
            order: 6
            type: integer
            minimum: 1
            maximum: 50
            title: Recall items
            description: Memories recalled per step.
          recall_max_length:
            group: advanced
            order: 7
            type: integer
            minimum: 200
            maximum: 50000
            title: Recall budget (characters)
          soul_agent_max_chars:
            group: advanced
            order: 8
            type: integer
            minimum: 0
            maximum: 20000
            title: Agent identity and rules budget (characters)
          soul_owner_max_chars:
            group: advanced
            order: 9
            type: integer
            minimum: 0
            maximum: 20000
            title: User profile budget (characters)
          consolidation_interval_hours:
            group: advanced
            order: 10
            type: number
            minimum: 1
            maximum: 720
            title: Consolidation every (hours)
          capture_conversation:
            order: 4
            type: boolean
            title: Capture conversations
          capture_experience:
            group: advanced
            order: 5
            type: boolean
            title: Capture tool outcomes

  # Agent side. The runtime library keeps its published id.

  - name: knowledge_memory_component
    kind: registry.entry
    meta:
      type: view.component
      name: knowledge_memory_component
      title: Knowledge Base Memory Capability
      tag_name: kickside-knowledge-memory
      base_path: kickside-memory
      entry_point: knowledge_memory.js
      announced: true
      auto_register: false

  - name: runtime
    kind: library.lua
    meta:
      name: runtime
      comment: KB-backed lifecycle/checkpoint runtime for the Knowledge Base Memory capability.
    source: file://runtime.lua
    modules: [ctx, contract, json]
    imports:
      typed_runtime: kickside.memory.agent:runtime
      component: kickside.component:component
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt

  - name: runtime_lifecycle
    kind: function.lua
    meta:
      comment: Lifecycle binding for Knowledge Based Memory.
    source: file://runtime_lifecycle.lua
    modules: [ctx, contract, json]
    imports:
      component: kickside.component:component
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt
      implementation: kickside.memory:runtime
    method: apply

  - name: runtime_checkpoint
    kind: function.lua
    meta:
      comment: Checkpoint binding for Knowledge Based Memory.
    source: file://runtime_checkpoint.lua
    modules: [ctx, contract, json]
    imports:
      component: kickside.component:component
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt
      implementation: kickside.memory:runtime
    method: create

  - name: memory_recall_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.read] }
      title: Search Long-Term Memory
      llm_alias: SearchMemory
      llm_description: "Search long-term memory. Returns compact identifiers, title, type, score and a provider snippet where available. Follow next_cursor with the same query. fields explicitly selects content, text, metadata or other provider fields; [\"*\"] returns full matched records."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "array", "items": {"type": "string"}, "description": "Additional provider fields to return. Use [\"*\"] for the whole record. Default list rows contain identifiers and selection metadata."},
            "query": { "type": "string", "description": "What memory to search for" },
            "kb_id": { "type": "string", "description": "Optional memory knowledge base id. Omit to search the capability's configured KBs." },
            "limit": { "type": "integer", "description": "Maximum memories to return in this page", "minimum": 1, "maximum": 100 },
            "cursor": { "type": "string", "description": "next_cursor from a previous SearchMemory result with the same query, to read the following page" }
          },
          "required": ["query"]
        }
      output_schema: |
        {
          "type": "object",
          "description": "A ranked memory page {success,query,count,items,next_cursor?,note}. items are compact summaries by default; fields requests additional provider fields. Domain errors return {success:false,error}; infrastructure failures return (nil,typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "true when the search ran; false with error otherwise."},
            "error": {"type": "string", "description": "Failure reason when success is false."},
            "query": {"type": "string", "description": "The query that was searched (present when success is true)."},
            "count": {"type": "integer", "description": "Number of memories returned in items."},
            "items": {"type": "array", "description": "Matched memory records from the configured knowledge base(s).", "items": {"type": "object", "description": "A compact knowledge-base match with its source kb id. fields requests content/text/summary/metadata explicitly.", "properties": {"id": {"type": "string"}, "title": {"type": "string"}, "source": {"type": "string"}, "score": {"type": "number"}, "kb_id": {"type": "string", "description": "Id of the knowledge base the memory came from."}, "content": {"type": "string", "description": "Memory content, when the item exposes it."}, "text": {"type": "string", "description": "Memory text, when the item exposes it."}, "summary": {"type": "string", "description": "Memory summary, when the item exposes it."}, "snippet": {"type": "string", "description": "Memory snippet, when the item exposes it."}}}},
            "next_cursor": {"type": "string", "description": "Pass as cursor with the same query to read the next page; absent on the last page."},
            "message": {"type": "string", "description": "Message for a disabled-recall domain outcome."},
            "note": {"type": "string", "description": "Caveat that memory may be incomplete or inaccurate (present when success is true)."}
          },
          "required": ["success"]
        }
    source: file://memory_recall_tool.lua
    modules: [ctx, contract, json]
    imports:
      component: kickside.component:component
      llm: wippy.llm:llm
      prompt: wippy.llm:prompt
      implementation: kickside.memory:runtime
    method: recall

  - name: lifecycle_binding
    kind: contract.binding
    meta:
      title: Knowledge Based Memory Lifecycle
      comment: Implements wippy.agent:lifecycle for KB-backed memory recall and final commit.
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: kickside.memory:runtime_lifecycle

  - name: checkpoint_binding
    kind: contract.binding
    meta:
      title: Knowledge Based Memory Checkpoint
      comment: Supplies working session summaries and separate durable KB digests when an agent mounts Knowledge Base Memory.
    contracts:
      - contract: wippy.agent:checkpoint
        methods:
          create: kickside.memory:runtime_checkpoint

  - name: knowledge_based_memory
    kind: registry.entry
    meta:
      type: agent.trait
      public: true
      title: Memory
      icon: tabler:brain
      comment: Remembers conversations in one memory knowledge base, puts the agent's identity and rules and the user's profile into the prompt, and gives the agent Remember, SearchMemory and ForgetMemory.
      tags: [memory, checkpoint, knowledge]
      web_component: kickside-knowledge-memory
      context_schema:
        type: object
        properties:
          memory_id:
            type: string
            title: Memory
            description: The memory knowledge base this agent remembers into and recalls from.
            role: picker
            web_component: wc-kb-picker
          kb_ids:
            description: Document recall bases when memory_id is absent; preserved otherwise.
            type: array
            title: Memory knowledge bases
            role: picker
            web_component: wc-kb-picker
            items: { type: string }
          write_kb_id:
            description: Document write target when memory_id is absent; preserved otherwise.
            type: string
            title: Write target knowledge base
            role: picker
            web_component: wc-kb-picker
          read_enabled:
            type: boolean
            title: Recall memory
            role: value
          write_enabled:
            type: boolean
            title: Write checkpoints
            role: value
          recall_limit:
            type: integer
            title: Recall result limit
            role: value
          recall_max_chars:
            description: Document activation recall budget; typed recall uses the Memory KB budget.
            type: integer
            title: Recall character budget
            role: value
          recall_prompt:
            description: Document recall guidance; no effect on typed recall.
            type: string
            title: Recall prompt
            role: value
          checkpoint_model:
            description: Document checkpoint model; typed extraction uses the Memory KB models.
            type: string
            title: Checkpoint model
            role: value
          checkpoint_prompt:
            description: Document digest instructions; no effect on typed extraction.
            type: string
            title: Checkpoint prompt
            role: value
          checkpoint_temperature:
            description: Document checkpoint temperature; no effect on typed extraction.
            type: number
            title: Checkpoint temperature
            role: value
          checkpoint_max_tokens:
            description: Document checkpoint output bound; typed working summaries use host options.
            type: integer
            title: Checkpoint max tokens
            role: value
          checkpoint_source_max_chars:
            description: Document checkpoint source bound; typed working summaries use host options.
            type: integer
            title: Checkpoint source chars
            role: value
        additionalProperties: false
    prompt: |
      You have Knowledge Base Memory. Relevant long-term memory may
      be injected when you become active, including after an agent switch. This
      memory is derived from prior chats and may be incomplete or
      inaccurate. Treat it as advisory context; decide what is useful before
      relying on it.

      Use SearchMemory when you need to query memory explicitly. When
      checkpoint persistence is enabled, checkpoints and session deactivation
      store relevant details for future chats in the selected
      knowledge base. This does not grant a general knowledge-base authoring
      tool.
    tools:
      - kickside.memory:memory_recall_tool
    build_func_id: kickside.memory.agent:memory_build
    prompt_func_id: kickside.memory.agent:memory_prompt
    behaviors:
      - id: knowledge_memory
        kind: memory
        handles: [activate, before_step, after_persist, deactivate, checkpoint]
        handlers:
          lifecycle: kickside.memory:lifecycle_binding
          checkpoint: kickside.memory:checkpoint_binding
        priority: 10
        checkpoint:
          token_threshold: 64000
          model: class:fast
          max_tokens: 1000
