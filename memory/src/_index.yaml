version: "1.0"
namespace: kickside.memory

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Memory
      comment: Memory knowledge bases (kb_type memory) holding typed, versioned memory items on a ledger thread, and the agent trait and memory provider that capture conversations into them, render the pinned soul, and recall from them.

  - name: dep.wippy.agent
    version: '>=0.5.7'
    kind: ns.dependency
    component: wippy/agent
    meta:
      comment: Lifecycle, checkpoint, memory and run_context contracts; the after_persist lifecycle phase.

  - name: dep.wippy.llm
    version: '*'
    kind: ns.dependency
    component: wippy/llm

  - name: dep.wippy.migration
    version: '*'
    kind: ns.dependency
    component: wippy/migration

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    component: kickside/component
    meta:
      comment: Memory knowledge bases are components; access, public meta and the write fence go through the component service.

  - name: dep.kickside.contract
    version: '*'
    kind: ns.dependency
    component: kickside/contract
    meta:
      comment: Implements embeddable, queryable and deletable; shared error helpers.

  - name: dep.kickside.core
    version: '*'
    kind: ns.dependency
    component: kickside/core
    meta:
      comment: The memory ledger is the knowledge base's thread; the ledger projection folds it.

  - name: dep.kickside.jobs
    version: '*'
    kind: ns.dependency
    component: kickside/jobs
    meta:
      comment: Derive, consolidation and re-embed runs execute as jobs.

  - name: dep.kickside.execution
    version: '*'
    kind: ns.dependency
    component: kickside/execution
    meta:
      comment: Deferred runs hold and re-admit the requester's execution identity.

  - name: dep.kickside.knowledge
    version: '*'
    kind: ns.dependency
    component: kickside/knowledge
    meta:
      comment: Memory is a knowledge-base engine of the knowledge control plane.

  - name: dep.kickside.search_index
    version: '>=0.1.1'
    kind: ns.dependency
    component: kickside/search-index
    meta:
      comment: Hybrid retrieval and group-aware conflict paging over memory items.

  - name: ui_server
    kind: ns.requirement
    meta:
      comment: HTTP server the memory web components are served from.
      description: HTTP server the memory web components are served from.
    targets:
      - entry: kickside.memory:ui_static
        path: .meta.server

  - name: api_router
    kind: ns.requirement
    meta:
      value_kind: http.router
      comment: Authenticated HTTP router for the memory API.
      description: Authenticated HTTP router for the memory API.
    targets:
      - { entry: kickside.memory.api:list_memories.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_topics.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_items.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:get_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:create_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:edit_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:forget_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:archive_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:restore_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_conflicts.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:resolve_conflict.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:status.endpoint, path: .meta.router }

  - name: target_db
    kind: ns.requirement
    meta:
      value_kind: db.sql
      comment: SQL database resource backing the kickside_memory_* tables; the component database.
      description: SQL database resource backing the kickside_memory_* tables; the component database.
    targets:
      - entry: kickside.memory.migrations:01_memory_schema
        path: .meta.target_db
      - entry: kickside.memory.migrations:05_memory_upgrade
        path: .meta.target_db
      - entry: kickside.memory:db_config
        path: .meta.db_id

  - name: db_config
    kind: registry.entry
    meta:
      comment: Holds the configured memory database id (rewritten by target_db).
      db_id: ""

  - name: types
    kind: library.lua
    meta:
      comment: Memory vocabulary - kinds, scopes, statuses, ledger events, run types and value helpers.
    source: file://types.lua
    modules: [time, json, security]
    imports:
      canonical_json: kickside.contract:canonical_json
      execution_identity: kickside.execution:execution_identity

  - name: config
    kind: library.lua
    meta:
      comment: Engine configuration - defaults and schema from the engine descriptor, server-side validation.
    source: file://config.lua
    modules: [registry]
    imports:
      memory_models: kickside.memory.engine:models
      types: kickside.memory:types

  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built KickSide memory web components.
    directory: ./static

  - name: ui_static
    kind: http.static
    meta:
      server: ""
    path: /kickside-memory
    fs: kickside.memory:ui_fs
    options:
      cache: "no-cache"

  - name: memory_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_view
      title: Memory
      comment: Memory knowledge base page - memories, conflicts, activity and settings.
      tag_name: kickside-memory
      base_path: kickside-memory
      entry_point: index.js
      announced: true
      auto_register: true

  - name: memory_create_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_create_view
      title: Memory Settings
      comment: The memory engine's pane of the knowledge base create and edit dialog.
      tag_name: kickside-memory-create
      base_path: kickside-memory
      entry_point: memory_create.js
      announced: true
      auto_register: true

  - name: memory_store
    kind: contract.binding
    meta:
      title: Memory
      comment: Memory knowledge base - typed memory items on a ledger thread with hybrid recall.
      icon: tabler:brain
      class: [knowledge]
      events:
        output:
          - type: kickside.memory.events:item.added
          - type: kickside.memory.events:item.superseded
          - type: kickside.memory.events:item.merged
          - type: kickside.memory.events:item.conflicted
          - type: kickside.memory.events:item.revised
          - type: kickside.memory.events:item.archived
          - type: kickside.memory.events:item.forgotten
          - type: kickside.memory.events:item.restored
          - type: kickside.memory.events:provenance.added
          - type: kickside.memory.events:capture.advanced
          - type: kickside.memory.events:consolidation.completed
          - type: kickside.knowledge.events:content.upserted
          - type: kickside.knowledge.events:content.deleted
      component:
        create: { view: kickside.knowledge:kb_create_view }
        manage: { view: kickside.knowledge:knowledge_view, deep_link: true }
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status
      - contract: kickside.contract:embeddable
        context_required: [component_id]
        methods:
          embed_content: kickside.memory.engine:embed_func
          embed_reference: kickside.knowledge.binding:embed_reference_func
      - contract: kickside.contract:queryable
        context_required: [component_id]
        methods:
          query: kickside.memory.engine:query_func
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: kickside.memory.engine:delete_func

  - name: store_lifecycle
    kind: contract.binding
    meta:
      title: Memory Store Lifecycle
      comment: Memory engine implementation of kickside.knowledge:kb_store_lifecycle, named by the engine descriptor's store_binding.
    contracts:
      - contract: kickside.knowledge:kb_store_lifecycle
        methods:
          create_store: kickside.memory.engine:create_store
          get_store: kickside.memory.engine:get_store
          update_config: kickside.memory.engine:update_config
          delete_store: kickside.memory.engine:delete_store

  - name: maintainable
    kind: contract.binding
    meta:
      comment: Memory maintenance - bring consolidation forward, re-embed every item, read the latest runs.
    contracts:
      - contract: kickside.knowledge:maintainable
        context_required: [component_id]
        methods:
          schedule_resummarize: kickside.memory.engine:schedule_resummarize_func
          schedule_reembed: kickside.memory.engine:schedule_reembed_func
          maintenance_status: kickside.memory.engine:maintenance_status_func

  - name: engine_memory
    kind: registry.entry
    meta:
      type: kickside.kb_engine
      kb_type: memory
      title: Memory
      label: Memory
      comment: Typed long-term memory for agents - facts, preferences, profile, identity and rules, versioned with provenance.
      icon: tabler:brain
      impl_id: kickside.memory:memory_store
      embed_binding: kickside.memory:memory_store
      query_binding: kickside.memory:memory_store
      maintenance_binding: kickside.memory:maintainable
      store_contract: kickside.knowledge:kb_store_lifecycle
      store_binding: kickside.memory:store_lifecycle
      is_graph: false
      thread:
        class: kickside.knowledge.injection
      retention:
        event_days: 36500
      ui:
        badge: { label: Memory, icon: tabler:brain, tone: info }
        stats:
          - { path: item_count, singular: memory, plural: memories, icon: tabler:brain }
          - { path: conflict_count, singular: conflict, plural: conflicts, icon: tabler:alert-triangle, min: 1 }
      component:
        create: { view: kickside.memory:memory_create_view }
        manage: { view: kickside.memory:memory_view }
      projections:
        - kind: kickside.memory.ledger
          projection_key: ledger
          cursor_key: ledger
          worker_ref: "func://kickside.memory.engine:ledger_projection"
          input_mode: prefetch_events
          events:
            input:
              - type: kickside.memory.events:item.added
              - type: kickside.memory.events:item.superseded
              - type: kickside.memory.events:item.merged
              - type: kickside.memory.events:item.conflicted
              - type: kickside.memory.events:item.revised
              - type: kickside.memory.events:item.archived
              - type: kickside.memory.events:item.forgotten
              - type: kickside.memory.events:item.restored
              - type: kickside.memory.events:provenance.added
              - type: kickside.memory.events:capture.advanced
              - type: kickside.memory.events:consolidation.completed
              - type: kickside.knowledge.events:content.upserted
      default_config:
        extraction_model: class:fast
        judge_model: class:fast
        judge_min_similarity: 0.55
        extraction_instructions: ""
        recall_max_items: 5
        recall_max_length: 4000
        soul_agent_max_chars: 2000
        soul_owner_max_chars: 2000
        consolidation_interval_hours: 24
        capture_conversation: true
        capture_experience: false
        plan_expiry_days: 30
      config_schema:
        type: object
        additionalProperties: false
        properties:
          plan_expiry_days:
            section: learning
            order: 11
            type: integer
            minimum: 1
            maximum: 3650
            title: Open plan expiry (days)
            description: Open goals remain pinned for this many days after their last update. Expired and completed goals remain searchable.
          extraction_model:
            section: models
            order: 1
            type: string
            minLength: 1
            title: Extraction model
            description: Model that reads conversations and picks what to remember. Consolidation uses it too.
            web_component: wc-model-picker
          judge_model:
            section: models
            order: 2
            type: string
            minLength: 1
            title: Reconcile model
            description: Model that decides whether a new memory is new, a duplicate, an update or a contradiction.
            web_component: wc-model-picker
          judge_min_similarity:
            section: learning
            order: 12
            type: number
            minimum: 0
            maximum: 1
            title: Reconcile similarity floor
            description: Minimum cosine similarity for a compatible memory to reach the semantic judge. Exact claims and single-valued key updates reconcile deterministically.
          extraction_instructions:
            section: learning
            order: 5
            type: string
            title: Memory rules
            description: Tell this memory what to remember and what to skip. These rules apply to conversations and isolated learning, for example, never remember access codes.
            format: textarea
          recall_max_items:
            section: recall
            order: 6
            type: integer
            minimum: 1
            maximum: 50
            title: Recall items
            description: Memories recalled per step.
          recall_max_length:
            section: recall
            order: 7
            type: integer
            minimum: 200
            maximum: 50000
            title: Recall budget (characters)
            description: Most text recalled into one step.
          soul_agent_max_chars:
            section: recall
            order: 8
            type: integer
            minimum: 0
            maximum: 20000
            title: Agent identity and rules budget (characters)
            description: Most text of the agent's identity and rules in its instructions.
          soul_owner_max_chars:
            section: recall
            order: 9
            type: integer
            minimum: 0
            maximum: 20000
            title: User profile budget (characters)
            description: Most text of what is known about the person, pinned at the start of a conversation.
          consolidation_interval_hours:
            section: upkeep
            order: 10
            type: number
            minimum: 1
            maximum: 720
            title: Consolidation every (hours)
            description: How often the memory reviews what changed and draws lessons from it.
          capture_conversation:
            section: learning
            order: 3
            type: boolean
            title: Capture conversations
            description: Learn from what people say to agents that use this memory.
          capture_experience:
            section: learning
            order: 4
            type: boolean
            title: Capture tool outcomes
            description: Also learn from how tool calls turned out.

  - name: memory_settings
    kind: registry.entry
    meta:
      type: view.component
      name: memory_settings
      title: Memory Settings
      comment: Memory trait settings - selects the agent's memory.
      tag_name: kickside-memory-settings
      base_path: kickside-memory
      entry_point: memory_settings.js
      announced: true
      auto_register: false

  - name: memory
    kind: registry.entry
    meta:
      type: agent.trait
      public: true
      title: Memory
      icon: tabler:brain
      comment: Captures conversations, adds agent identity and rules, pins the user's profile and supplies SearchMemory and ForgetMemory.
      tags: [memory, checkpoint]
      web_component: kickside-memory-settings
      context_schema:
        type: object
        required: [memory_id]
        properties:
          memory_id:
            type: string
            minLength: 1
            title: Memory
            description: The memory this agent captures into and recalls from.
            role: picker
          learn_in_isolation:
            type: boolean
            default: false
            title: Learn from isolated runs
            description: Keep reusable lessons, skills and stable knowledge from runs without a human conversation. Skip task inputs and one-off results. Recall stays active when this is off.
          read_enabled:
            type: boolean
            title: Recall memory
            description: Include saved memory in prompts, automatic recall and SearchMemory.
          write_enabled:
            type: boolean
            title: Write memory
            description: Capture conversations and allow ForgetMemory.
          recall_limit:
            type: integer
            minimum: 1
            title: Search result limit
            description: Default number of results from SearchMemory.
        additionalProperties: false
    prompt: |
      Memory learns from the conversation automatically, including facts, corrections
      and goal progress. Use SearchMemory to look things up.
      Use ForgetMemory only when the user asks to forget.
      Memories come from conversations and may be incomplete or out of date.
    tools:
      - kickside.memory.agent:search_tool
      - kickside.memory.agent:forget_tool
    build_func_id: kickside.memory.agent:memory_build
    prompt_func_id: kickside.memory.agent:memory_prompt
    behaviors:
      - id: memory
        kind: memory
        handles: [recall, activate, before_step, after_persist, deactivate, checkpoint]
        handlers:
          recall: kickside.memory.agent:memory_binding
          lifecycle: kickside.memory.agent:lifecycle_binding
          checkpoint: kickside.memory.agent:checkpoint_binding
        priority: 10
        checkpoint:
          token_threshold: 64000
          model: class:fast
          max_tokens: 1000
