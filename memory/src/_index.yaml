version: "1.0"
namespace: kickside.memory

entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide Memory
      comment: Memory knowledge bases (kb_type memory) holding typed, versioned memory items on a ledger thread, and the agent trait and memory provider that capture conversations into them, render the pinned soul, and recall from them.

  - name: dep.wippy.agent
    version: '*'
    kind: ns.dependency
    component: wippy/agent
    meta:
      comment: Lifecycle, checkpoint, memory and run_context contracts; the after_persist lifecycle phase.

  - name: dep.wippy.llm
    version: '*'
    kind: ns.dependency
    component: wippy/llm

  - name: dep.wippy.migration
    version: '*'
    kind: ns.dependency
    component: wippy/migration

  - name: dep.kickside.component
    version: '*'
    kind: ns.dependency
    component: kickside/component
    meta:
      comment: Memory knowledge bases are components; access, public meta and the write fence go through the component service.

  - name: dep.kickside.contract
    version: '*'
    kind: ns.dependency
    component: kickside/contract
    meta:
      comment: Implements embeddable, queryable and deletable; shared error helpers.

  - name: dep.kickside.core
    version: '*'
    kind: ns.dependency
    component: kickside/core
    meta:
      comment: The memory ledger is the knowledge base's thread; the ledger projection folds it.

  - name: dep.kickside.jobs
    version: '*'
    kind: ns.dependency
    component: kickside/jobs
    meta:
      comment: Derive, consolidation and re-embed runs execute as jobs.

  - name: dep.kickside.execution
    version: '*'
    kind: ns.dependency
    component: kickside/execution
    meta:
      comment: Deferred runs hold and re-admit the requester's execution identity.

  - name: dep.kickside.knowledge
    version: '*'
    kind: ns.dependency
    component: kickside/knowledge
    meta:
      comment: Memory is a knowledge-base engine of the knowledge control plane.

  - name: dep.kickside.search_index
    version: '*'
    kind: ns.dependency
    component: kickside/search-index
    meta:
      comment: Hybrid vector and full-text search over the memory item tables.

  # Host requirements.
  - name: ui_server
    kind: ns.requirement
    meta:
      comment: HTTP server the memory web components are served from.
      description: HTTP server the memory web components are served from.
    targets:
      - entry: kickside.memory:ui_static
        path: .meta.server

  - name: api_router
    kind: ns.requirement
    meta:
      comment: Authenticated HTTP router for the memory API.
      description: Authenticated HTTP router for the memory API.
    targets:
      - { entry: kickside.memory.api:list_items.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:get_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:create_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:edit_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:forget_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:restore_item.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:list_conflicts.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:resolve_conflict.endpoint, path: .meta.router }
      - { entry: kickside.memory.api:status.endpoint, path: .meta.router }

  - name: target_db
    kind: ns.requirement
    meta:
      comment: SQL database resource backing the kickside_memory_* tables; the component database.
      description: SQL database resource backing the kickside_memory_* tables; the component database.
    targets:
      - entry: kickside.memory.migrations:01_memory_schema
        path: .meta.target_db
      - entry: kickside.memory:db_config
        path: .meta.db_id

  - name: db_config
    kind: registry.entry
    meta:
      comment: Holds the configured memory database id (rewritten by target_db).
      db_id: ""

  - name: types
    kind: library.lua
    meta:
      comment: Memory vocabulary - kinds, scopes, statuses, ledger events, run types and value helpers.
    source: file://types.lua
    modules: [time, hash, json]

  - name: config
    kind: library.lua
    meta:
      comment: Engine configuration - defaults and schema from the engine descriptor, server-side validation.
    source: file://config.lua
    modules: [registry]
    imports:
      types: kickside.memory:types

  # Web components.
  - name: ui_fs
    kind: fs.directory
    meta:
      comment: Built KickSide memory web components.
    directory: ./static

  - name: ui_static
    kind: http.static
    meta:
      server: ""
    path: /kickside-memory
    fs: kickside.memory:ui_fs
    options:
      cache: "no-cache"

  - name: knowledge_memory_component
    kind: registry.entry
    meta:
      type: view.component
      name: knowledge_memory_component
      title: Memory Trait Settings
      tag_name: kickside-knowledge-memory
      base_path: kickside-memory
      entry_point: index.js
      announced: true
      auto_register: false

  - name: memory_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_view
      title: Memory
      comment: Memory knowledge base page - memories, conflicts, activity and settings.
      tag_name: kickside-memory-kb
      base_path: kickside-memory
      entry_point: memory_kb.js
      announced: true
      auto_register: true

  - name: memory_create_view
    kind: registry.entry
    meta:
      type: view.component
      name: memory_create_view
      title: Memory Settings
      comment: The memory engine's pane of the knowledge base create and edit dialog.
      tag_name: kickside-memory-create
      base_path: kickside-memory
      entry_point: memory_create.js
      announced: true
      auto_register: true

  # Knowledge-base engine. The component impl binding carries the store
  # contracts; the descriptor declares the ledger thread, its projection,
  # configuration and the manage view.
  - name: memory_kb
    kind: contract.binding
    meta:
      title: Memory
      comment: Memory knowledge base - typed memory items on a ledger thread with hybrid recall.
      icon: tabler:brain
      class: [knowledge]
      events:
        output:
          - type: kickside.memory.events:item.added
          - type: kickside.memory.events:item.superseded
          - type: kickside.memory.events:item.merged
          - type: kickside.memory.events:item.conflicted
          - type: kickside.memory.events:item.forgotten
          - type: kickside.memory.events:item.restored
          - type: kickside.memory.events:provenance.added
          - type: kickside.memory.events:capture.advanced
          - type: kickside.memory.events:consolidation.completed
          - type: kickside.knowledge.events:content.upserted
          - type: kickside.knowledge.events:content.deleted
      component:
        create: { view: kickside.knowledge:kb_create_view }
        manage: { view: kickside.knowledge:knowledge_view, deep_link: true }
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.core.threads:thread_status
      - contract: kickside.contract:embeddable
        context_required: [component_id]
        methods:
          embed_content: kickside.memory.engine:embed_func
          embed_reference: kickside.knowledge.binding:embed_reference_func
      - contract: kickside.contract:queryable
        context_required: [component_id]
        methods:
          query: kickside.memory.engine:query_func
      - contract: kickside.contract:deletable
        context_required: [component_id]
        methods:
          delete: kickside.memory.engine:delete_func

  # The knowledge control plane opens an engine's store_contract without naming a
  # binding, so every engine that binds kickside.knowledge:kb_store_lifecycle
  # resolves to that contract's default binding. Memory therefore declares its
  # own store contract with the same four methods and names it as the engine's
  # store_contract; the control plane routes create, read, update and delete of
  # memory stores to it through that descriptor field.
  - name: kb_store_lifecycle
    kind: contract.definition
    meta:
      title: Memory Store Lifecycle
      comment: Per-component memory store lifecycle (create/get/update/delete) the knowledge control plane drives for kb_type memory; the method shapes of kickside.knowledge:kb_store_lifecycle.
    methods:
      - name: create_store
        description: Create the memory store row. Input { component_id, embedding_model, config?, opts? }; config is validated against the engine config_schema. Arms the memory's consolidation slot.
        input_schemas:
          - definition: |
              { "type": "object", "properties": { "component_id": { "type": "string" }, "embedding_model": { "type": "string" }, "config": { "type": "object" }, "opts": { "type": "object" } }, "required": ["component_id", "embedding_model"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object", "properties": { "success": { "type": "boolean" }, "store_id": {}, "error": { "type": "string" } } }
            format: application/schema+json
      - name: get_store
        description: Fetch the memory store row. Input { component_id }. Returns { success, component_id, kb_type, embedding_model, config, created_at, updated_at }.
        input_schemas:
          - definition: |
              { "type": "object", "properties": { "component_id": { "type": "string" } }, "required": ["component_id"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object", "properties": { "success": { "type": "boolean" }, "component_id": { "type": "string" }, "kb_type": { "type": "string" }, "embedding_model": { "type": "string" }, "config": { "type": "object" }, "error": { "type": "string" } } }
            format: application/schema+json
      - name: update_config
        description: Replace the memory configuration. Input { component_id, config }; validated against the engine config_schema.
        input_schemas:
          - definition: |
              { "type": "object", "properties": { "component_id": { "type": "string" }, "config": { "type": "object" } }, "required": ["component_id", "config"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object", "properties": { "success": { "type": "boolean" }, "error": { "type": "string" } } }
            format: application/schema+json
      - name: delete_store
        description: Delete the memory store and every row it keeps. Input { component_id }.
        input_schemas:
          - definition: |
              { "type": "object", "properties": { "component_id": { "type": "string" } }, "required": ["component_id"] }
            format: application/schema+json
        output_schemas:
          - definition: |
              { "type": "object", "properties": { "success": { "type": "boolean" }, "error": { "type": "string" } } }
            format: application/schema+json

  - name: store_lifecycle
    kind: contract.binding
    meta:
      title: Memory Store Lifecycle
      comment: Memory engine implementation of kickside.memory:kb_store_lifecycle.
    contracts:
      - contract: kickside.memory:kb_store_lifecycle
        default: true
        methods:
          create_store: kickside.memory.engine:create_store
          get_store: kickside.memory.engine:get_store
          update_config: kickside.memory.engine:update_config
          delete_store: kickside.memory.engine:delete_store

  - name: maintainable
    kind: contract.binding
    meta:
      comment: Memory maintenance - bring consolidation forward, re-embed every item, read the latest runs.
    contracts:
      - contract: kickside.knowledge:maintainable
        context_required: [component_id]
        methods:
          schedule_resummarize: kickside.memory.engine:schedule_resummarize_func
          schedule_reembed: kickside.memory.engine:schedule_reembed_func
          maintenance_status: kickside.memory.engine:maintenance_status_func

  - name: engine_memory
    kind: registry.entry
    meta:
      type: kickside.kb_engine
      kb_type: memory
      title: Memory
      label: Memory
      comment: Typed long-term memory for agents - facts, preferences, profile, identity and rules, versioned with provenance.
      icon: tabler:brain
      impl_id: kickside.memory:memory_kb
      embed_binding: kickside.memory:memory_kb
      query_binding: kickside.memory:memory_kb
      maintenance_binding: kickside.memory:maintainable
      store_contract: kickside.memory:kb_store_lifecycle
      is_graph: false
      thread:
        class: kickside.knowledge.injection
      # The ledger is the source of truth and the read model is rebuilt from it,
      # so its events are kept for the lifetime of the memory.
      retention:
        event_days: 36500
      ui:
        badge: { label: Memory, icon: tabler:brain, tone: info }
        stats:
          - { path: item_count, singular: memory, plural: memories, icon: tabler:brain }
          - { path: conflict_count, singular: conflict, plural: conflicts, icon: tabler:alert-triangle, min: 1 }
      component:
        create: { view: kickside.memory:memory_create_view }
        manage: { view: kickside.memory:memory_view }
      projections:
        - kind: kickside.memory.ledger
          projection_key: ledger
          cursor_key: ledger
          worker_ref: "func://kickside.memory.engine:ledger_projection"
          input_mode: prefetch_events
          events:
            input:
              - type: kickside.memory.events:item.added
              - type: kickside.memory.events:item.superseded
              - type: kickside.memory.events:item.merged
              - type: kickside.memory.events:item.conflicted
              - type: kickside.memory.events:item.forgotten
              - type: kickside.memory.events:item.restored
              - type: kickside.memory.events:provenance.added
              - type: kickside.memory.events:capture.advanced
              - type: kickside.memory.events:consolidation.completed
              - type: kickside.knowledge.events:content.upserted
      default_config:
        extraction_model: class:fast
        judge_model: class:fast
        extraction_instructions: ""
        recall_max_items: 5
        recall_max_length: 4000
        soul_agent_max_chars: 2000
        soul_owner_max_chars: 2000
        consolidation_interval_hours: 24
        capture_conversation: true
        capture_experience: false
      config_schema:
        type: object
        additionalProperties: false
        properties:
          extraction_model:
            order: 1
            type: string
            minLength: 1
            title: Extraction model
            description: Model that reads conversations and picks what to remember. Consolidation uses it too.
            web_component: wc-model-picker
          judge_model:
            order: 2
            type: string
            minLength: 1
            title: Reconcile model
            description: Model that decides whether a new memory is new, a duplicate, an update or a contradiction.
            web_component: wc-model-picker
          extraction_instructions:
            group: advanced
            order: 3
            type: string
            title: Memory policy
            description: Extra instructions for what this memory keeps.
            format: textarea
          recall_max_items:
            group: advanced
            order: 6
            type: integer
            minimum: 1
            maximum: 50
            title: Recall items
            description: Memories recalled per step.
          recall_max_length:
            group: advanced
            order: 7
            type: integer
            minimum: 200
            maximum: 50000
            title: Recall budget (characters)
          soul_agent_max_chars:
            group: advanced
            order: 8
            type: integer
            minimum: 0
            maximum: 20000
            title: Agent identity and rules budget (characters)
          soul_owner_max_chars:
            group: advanced
            order: 9
            type: integer
            minimum: 0
            maximum: 20000
            title: User profile budget (characters)
          consolidation_interval_hours:
            group: advanced
            order: 10
            type: number
            minimum: 1
            maximum: 720
            title: Consolidation every (hours)
          capture_conversation:
            order: 4
            type: boolean
            title: Capture conversations
          capture_experience:
            group: advanced
            order: 5
            type: boolean
            title: Capture tool outcomes

  # Agent side. The runtime library keeps its published id.
  - name: runtime
    kind: library.lua
    meta:
      name: runtime
      comment: Agent memory runtime - capture, pinned soul, recall, checkpoint and memory tools.
    source: file://runtime.lua
    modules: &runtime_modules [ctx, contract, security]
    imports: &runtime_imports
      component: kickside.component:component
      types: kickside.memory:types
      memory_config: kickside.memory:config
      memory_stores: kickside.memory.persist:stores
      memory_items: kickside.memory.persist:items
      memory_runs: kickside.memory.persist:runs
      memory_jobs: kickside.memory.engine:jobs
      memory_models: kickside.memory.engine:models
      memory_writer: kickside.memory.engine:writer
      memory_ledger: kickside.memory.engine:ledger
      memory_ops: kickside.memory.engine:ops
      memory_recall: kickside.memory.engine:recall

  - name: runtime_lifecycle
    kind: function.lua
    meta:
      comment: wippy.agent:lifecycle apply - pins the soul on activate, captures on before_step, after_persist and deactivate.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: apply

  - name: runtime_checkpoint
    kind: function.lua
    meta:
      comment: wippy.agent:checkpoint create - working summary for the host and capture of the compacted range.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: create

  - name: memory_provider_recall
    kind: function.lua
    meta:
      comment: wippy.agent:memory recall - scoped hybrid recall of current memories, skipping previously injected ids. Called by the agent runtime each step, not by the model.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: recall

  - name: list_memory_targets
    kind: function.lua
    meta:
      comment: Lists the memory knowledge bases the caller can read, for the agent memory picker.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: list_targets

  - name: memory_build
    kind: function.lua
    meta:
      comment: Trait build function - contributes the agent's identity, rules, skills and lessons to the compiled prompt.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: build

  - name: memory_prompt
    kind: function.lua
    meta:
      comment: Trait prompt function - the owner profile and preferences pinned when the agent activated in this host.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: prompt

  - name: memory_recall_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.read] }
      title: Search Long-Term Memory
      llm_alias: SearchMemory
      llm_description: "Search long-term memory: current memories about the user and this agent, ranked by relevance. Returns compact rows; follow next_cursor with the same query. fields selects extra fields; [\"*\"] returns full records."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "array", "items": {"type": "string"}, "description": "Additional fields to return. Use [\"*\"] for the whole record."},
            "query": { "type": "string", "description": "What memory to search for" },
            "limit": { "type": "integer", "description": "Maximum memories to return in this page", "minimum": 1, "maximum": 50 },
            "cursor": { "type": "string", "description": "next_cursor from a previous SearchMemory result with the same query" }
          },
          "required": ["query"]
        }
      output_schema: |
        {
          "type": "object",
          "description": "A ranked memory page {success,query,count,items,next_cursor?,note}. Domain errors return {success:false,error}; infrastructure failures return (nil,typed error).",
          "properties": {
            "success": {"type": "boolean"},
            "error": {"type": "string"},
            "query": {"type": "string"},
            "count": {"type": "integer"},
            "items": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "kb_id": {"type": "string"}, "content": {"type": "string"}, "node_type": {"type": "string"}, "score": {"type": "number"}, "source": {"type": "string"}, "created_at": {"type": "string"}}}},
            "next_cursor": {"type": "string"},
            "note": {"type": "string"}
          },
          "required": ["success"]
        }
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: search

  - name: memory_remember_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Remember
      llm_alias: Remember
      llm_description: "Store a durable memory about the user that should hold in future conversations: a fact, preference, profile attribute, skill or lesson. The memory is reconciled with what is already known (an update replaces the older value)."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "content": {"type": "string", "description": "One self-contained sentence about the user, e.g. 'The user lives in Berlin.'"},
            "kind": {"type": "string", "enum": ["fact", "preference", "profile_slot", "skill", "lesson"]},
            "key": {"type": "string", "description": "Short stable topic, e.g. home_city"},
            "value": {"type": "string", "description": "The value only, e.g. Berlin"},
            "valid_at": {"type": "string", "description": "RFC3339 instant the memory became true, when known"}
          },
          "required": ["content"]
        }
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "item_ids": {"type": "array", "items": {"type": "string"}}, "outcome": {"type": "object"}}, "required": ["success"]}
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: remember

  - name: memory_forget_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Forget Memory
      llm_alias: ForgetMemory
      llm_description: "Forget a memory by its id (from SearchMemory) when the user asks to forget it or it is wrong. It stops being recalled; the memory's owner can restore it."
      input_schema: |
        {"type": "object", "properties": {"item_id": {"type": "string"}, "reason": {"type": "string"}}, "required": ["item_id"]}
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "item_id": {"type": "string"}}, "required": ["success"]}
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: forget

  - name: lifecycle_binding
    kind: contract.binding
    meta:
      title: Memory Lifecycle
      comment: Implements wippy.agent:lifecycle - pins the soul on activate and captures conversation on before_step, after_persist and deactivate.
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: kickside.memory:runtime_lifecycle

  - name: checkpoint_binding
    kind: contract.binding
    meta:
      title: Memory Checkpoint
      comment: Supplies the working session summary and captures the compacted range into memory.
    contracts:
      - contract: wippy.agent:checkpoint
        methods:
          create: kickside.memory:runtime_checkpoint

  - name: memory_binding
    kind: contract.binding
    meta:
      title: Memory Recall
      comment: Implements wippy.agent:memory recall over a memory knowledge base.
    contracts:
      - contract: wippy.agent:memory
        context_required: [component_id]
        methods:
          recall: kickside.memory:memory_provider_recall

  - name: memory_provider
    kind: registry.entry
    meta:
      type: agent.memory_provider
      title: Memory
      comment: Recalls typed long-term memory from a selected memory knowledge base each step.
      icon: tabler:brain
      order: 20
      implementation_id: kickside.memory:memory_binding
      list_targets: kickside.memory:list_memory_targets

  - name: knowledge_based_memory
    kind: registry.entry
    meta:
      type: agent.trait
      public: true
      title: Memory
      icon: tabler:brain
      comment: Remembers conversations in one memory knowledge base, puts the agent's identity and rules and the user's profile into the prompt, and gives the agent Remember, SearchMemory and ForgetMemory.
      tags: [memory, checkpoint, knowledge]
      web_component: kickside-knowledge-memory
      context_schema:
        type: object
        properties:
          memory_id:
            type: string
            title: Memory
            description: The memory knowledge base this agent remembers into and recalls from.
            role: picker
            web_component: wc-kb-picker
          write_enabled:
            type: boolean
            title: Remember conversations
            description: Off keeps the memory read-only for this agent.
            role: value
          read_enabled:
            type: boolean
            title: SearchMemory tool
            description: Off makes SearchMemory answer that search is disabled.
            role: value
          recall_limit:
            type: integer
            title: SearchMemory page size
            role: value
          kb_ids:
            type: array
            title: Knowledge bases (earlier releases)
            description: When memory_id is empty, the first entry is the memory if it is a memory knowledge base.
            items: { type: string }
          write_kb_id:
            type: string
            title: Write knowledge base (earlier releases)
            description: When memory_id is empty, this is the memory if it is a memory knowledge base.
          recall_max_chars:
            type: integer
            description: Earlier releases; no effect. The memory's settings bound recall.
          recall_prompt:
            type: string
            description: Earlier releases; no effect.
          checkpoint_model:
            type: string
            description: Earlier releases; no effect. Checkpoints use the agent's model.
          checkpoint_prompt:
            type: string
            description: Earlier releases; no effect.
          checkpoint_temperature:
            type: number
            description: Earlier releases; no effect.
          checkpoint_max_tokens:
            type: integer
            description: Earlier releases; no effect.
          checkpoint_source_max_chars:
            type: integer
            description: Earlier releases; no effect.
        additionalProperties: false
    prompt: |
      You have long-term memory. What you know about the user and your own
      identity and rules appear in your instructions; relevant memories may be
      added as notes. Memory comes from earlier conversations and can be out of
      date: prefer what the user says now.

      Conversations are captured into memory automatically. Use SearchMemory to
      look something up, Remember only when the user explicitly asks you to
      remember something, and ForgetMemory when the user asks you to forget
      something.
    tools:
      - kickside.memory:memory_recall_tool
      - kickside.memory:memory_remember_tool
      - kickside.memory:memory_forget_tool
    build_func_id: kickside.memory:memory_build
    prompt_func_id: kickside.memory:memory_prompt
    behaviors:
      - id: knowledge_memory
        kind: memory
        handles: [activate, before_step, after_persist, deactivate, checkpoint]
        handlers:
          lifecycle: kickside.memory:lifecycle_binding
          checkpoint: kickside.memory:checkpoint_binding
        priority: 10
        checkpoint:
          token_threshold: 64000
          model: class:fast
          max_tokens: 1000
