version: "1.0"
namespace: kickside.memory.agent
entries:
  - name: context
    kind: library.lua
    source: file://context.lua
    modules: [ctx]
    imports:
      component: kickside.component:component
      types: kickside.memory:types
      memory_config: kickside.memory:config
      memory_stores: kickside.memory.persist:stores

  - name: history
    kind: library.lua
    source: file://history.lua
    modules: [contract]
    imports:
      types: kickside.memory:types

  - name: prompt
    kind: library.lua
    source: file://prompt.lua
    modules: &prompt_modules [ctx]
    imports: &prompt_imports
      component: kickside.component:component
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      memory_items: kickside.memory.persist:items
      memory_runs: kickside.memory.persist:runs
      memory_ledger: kickside.memory.engine:ledger

  - name: capture
    kind: library.lua
    source: file://capture.lua
    modules: []
    imports:
      component: kickside.component:component
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      agent_history: kickside.memory.agent:history
      memory_runs: kickside.memory.persist:runs
      memory_jobs: kickside.memory.engine:jobs

  - name: recall
    kind: library.lua
    source: file://recall.lua
    modules: &recall_modules [ctx]
    imports: &recall_imports
      component: kickside.component:component
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      memory_recall: kickside.memory.engine:recall

  - name: tools
    kind: library.lua
    source: file://tools.lua
    modules: &tools_modules [ctx]
    imports: &tools_imports
      component: kickside.component:component
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      agent_history: kickside.memory.agent:history
      memory_items: kickside.memory.persist:items
      memory_models: kickside.memory.engine:models
      memory_writer: kickside.memory.engine:writer
      memory_ops: kickside.memory.engine:ops
      memory_recall: kickside.memory.engine:recall
      memory_reconcile: kickside.memory.engine:reconcile

  - name: memory_provider_recall
    kind: function.lua
    meta:
      comment: Scoped hybrid recall of current memories for each agent step.
    source: file://recall.lua
    modules: *recall_modules
    imports: *recall_imports
    method: recall

  - name: memory_build
    kind: function.lua
    meta:
      comment: Trait build function - contributes the agent's identity, rules, skills and lessons to the compiled prompt.
    source: file://prompt.lua
    modules: *prompt_modules
    imports: *prompt_imports
    method: build

  - name: memory_prompt
    kind: function.lua
    meta:
      comment: Owner profile and preferences pinned for the active host.
    source: file://prompt.lua
    modules: *prompt_modules
    imports: *prompt_imports
    method: prompt

  - name: remember_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Remember
      llm_alias: Remember
      llm_description: "Store a durable memory about the user or an ongoing plan. Use this for corrections and changed values: supersession preserves earlier versions. Never call ForgetMemory for a correction. Use one topic key per goal and update its complete state as work progresses."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "content": {"type": "string", "description": "One self-contained sentence about the user or goal."},
            "kind": {"type": "string", "enum": ["fact", "preference", "profile_slot", "skill", "lesson", "plan"]},
            "key": {"type": "string", "description": "Required canonical topic key: 1-64 lowercase letters, digits or underscores, beginning with a letter. Name the attribute, never the memory sentence or value."},
            "value": {"description": "The typed attribute value only. A plan uses an object with status (open or done), next_step and details (strings)."},
            "cardinality": {"type": "string", "enum": ["single", "multi"], "description": "single when the user holds one value of this key at a time; multi when several values hold together. A key the memory already knows keeps its cardinality."},
            "valid_at": {"type": "string", "description": "RFC3339 instant the memory became true, when known"}
          },
          "required": ["content", "key", "value"]
        }
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "item_ids": {"type": "array", "items": {"type": "string"}}, "outcome": {"type": "object"}}, "required": ["success"]}
    source: file://tools.lua
    modules: *tools_modules
    imports: *tools_imports
    method: remember

  - name: forget_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Forget Memory
      llm_alias: ForgetMemory
      llm_description: "Erase a memory and all its versions only when the user explicitly asks to forget or delete that attribute. Never use this for a correction, changed value or update; use Remember to supersede the earlier value. Use the canonical key shown in the profile or SearchMemory. For a multi-valued key, supply value to select the value and its versions."
      input_schema: |
        {"type": "object", "additionalProperties": false, "properties": {"key": {"type": "string", "description": "Canonical topic key of your own attribute to erase"}, "value": {"description": "Required for a multi-valued key: the typed value to erase with all its versions"}}, "required": ["key"]}
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "key": {"type": "string"}, "forgotten": {"type": "integer"}}, "required": ["success"]}
    source: file://tools.lua
    modules: *tools_modules
    imports: *tools_imports
    method: forget

  - name: memory_binding
    kind: contract.binding
    meta:
      title: Memory Recall
      comment: Implements wippy.agent:memory recall over a memory knowledge base.
    contracts:
      - contract: wippy.agent:memory
        context_required: [memory_id]
        methods:
          recall: kickside.memory.agent:memory_provider_recall

  - name: lifecycle
    kind: function.lua
    source: file://lifecycle.lua
    modules: []
    imports:
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      agent_prompt: kickside.memory.agent:prompt
      agent_capture: kickside.memory.agent:capture
      memory_jobs: kickside.memory.engine:jobs
    method: apply

  - name: checkpoint
    kind: function.lua
    source: file://checkpoint.lua
    modules: []
    imports:
      types: kickside.memory:types
      agent_context: kickside.memory.agent:context
      agent_history: kickside.memory.agent:history
      agent_capture: kickside.memory.agent:capture
      memory_models: kickside.memory.engine:models
    method: create

  - name: search_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.read] }
      title: Search Memory
      llm_alias: SearchMemory
      llm_description: Search the selected memory for the user's facts, preferences and goals. Returns canonical keys, typed values and unresolved alternatives. Pass next_cursor with the same query for more results.
      input_schema: |
        {"type":"object","additionalProperties":false,"properties":{"query":{"type":"string"},"limit":{"type":"integer","minimum":1,"maximum":50},"cursor":{"type":"string"}},"required":["query"]}
      output_schema: |
        {"type":"object","properties":{"success":{"type":"boolean"},"error":{"type":"string"},"query":{"type":"string"},"count":{"type":"integer"},"items":{"type":"array","items":{"type":"object","additionalProperties":false,"properties":{"id":{"type":"string"},"kind":{"type":"string"},"key":{"type":"string"},"value":{},"content":{"type":"string"},"valid_at":{"type":"string"},"recorded_at":{"type":"string"},"score":{"type":"number"},"source":{"type":"string"}},"required":["id","kind","key","value","content","valid_at","recorded_at","score","source"]}},"alternatives":{"type":"array","items":{"type":"object"}},"next_cursor":{"type":"string"},"note":{"type":"string"}},"required":["success"]}
    source: file://tools.lua
    modules: *tools_modules
    imports: *tools_imports
    method: search

  - name: lifecycle_binding
    kind: contract.binding
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: kickside.memory.agent:lifecycle

  - name: checkpoint_binding
    kind: contract.binding
    contracts:
      - contract: wippy.agent:checkpoint
        methods:
          create: kickside.memory.agent:checkpoint
