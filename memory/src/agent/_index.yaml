version: "1.0"
namespace: kickside.memory.agent
entries:
  - name: runtime
    kind: library.lua
    meta:
      name: runtime
      comment: Agent memory runtime - capture, pinned soul, recall, checkpoint and memory tools.
    source: file://runtime.lua
    modules: &runtime_modules [ctx, contract, security]
    imports: &runtime_imports
      component: kickside.component:component
      types: kickside.memory:types
      memory_config: kickside.memory:config
      memory_stores: kickside.memory.persist:stores
      memory_items: kickside.memory.persist:items
      memory_runs: kickside.memory.persist:runs
      memory_jobs: kickside.memory.engine:jobs
      memory_models: kickside.memory.engine:models
      memory_writer: kickside.memory.engine:writer
      memory_ledger: kickside.memory.engine:ledger
      memory_ops: kickside.memory.engine:ops
      memory_recall: kickside.memory.engine:recall
      memory_reconcile: kickside.memory.engine:reconcile

  - name: runtime_lifecycle
    kind: function.lua
    meta:
      comment: wippy.agent:lifecycle apply - pins the soul on activate, captures on before_step, after_persist and deactivate.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: apply

  - name: runtime_checkpoint
    kind: function.lua
    meta:
      comment: wippy.agent:checkpoint create - working summary for the host and capture of the compacted range.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: create

  - name: memory_provider_recall
    kind: function.lua
    meta:
      comment: wippy.agent:memory recall - scoped hybrid recall of current memories, skipping previously injected ids. Called by the agent runtime each step, not by the model.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: recall

  - name: list_memory_targets
    kind: function.lua
    meta:
      comment: Lists the memory knowledge bases the caller can read, for the agent memory picker.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: list_targets

  - name: memory_build
    kind: function.lua
    meta:
      comment: Trait build function - contributes the agent's identity, rules, skills and lessons to the compiled prompt.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: build

  - name: memory_prompt
    kind: function.lua
    meta:
      comment: Trait prompt function - the owner profile and preferences pinned when the agent activated in this host.
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: prompt

  - name: memory_recall_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.read] }
      title: Search Long-Term Memory
      llm_alias: SearchMemory
      llm_description: "Search long-term memory: current memories about the user and this agent, ranked by relevance. Returns compact rows; follow next_cursor with the same query. fields selects extra fields; [\"*\"] returns full records."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "fields": {"type": "array", "items": {"type": "string"}, "description": "Additional fields to return. Use [\"*\"] for the whole record."},
            "query": { "type": "string", "description": "What memory to search for" },
            "limit": { "type": "integer", "description": "Maximum memories to return in this page", "minimum": 1, "maximum": 50 },
            "cursor": { "type": "string", "description": "next_cursor from a previous SearchMemory result with the same query" }
          },
          "required": ["query"]
        }
      output_schema: |
        {
          "type": "object",
          "description": "A ranked memory page {success,query,count,items,next_cursor?,note}. Domain errors return {success:false,error}; infrastructure failures return (nil,typed error).",
          "properties": {
            "success": {"type": "boolean"},
            "error": {"type": "string"},
            "query": {"type": "string"},
            "count": {"type": "integer"},
            "items": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "kb_id": {"type": "string"}, "content": {"type": "string"}, "node_type": {"type": "string"}, "score": {"type": "number"}, "source": {"type": "string"}, "created_at": {"type": "string"}}}},
            "next_cursor": {"type": "string"},
            "note": {"type": "string"}
          },
          "required": ["success"]
        }
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: search

  - name: memory_remember_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Remember
      llm_alias: Remember
      llm_description: "Store a durable memory about the user that should hold in future conversations: a fact, preference, profile attribute, skill or lesson. The memory is reconciled with what is already known (an update replaces the older value)."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "content": {"type": "string", "description": "One self-contained sentence about the user, e.g. 'The user lives in Berlin.'"},
            "kind": {"type": "string", "enum": ["fact", "preference", "profile_slot", "skill", "lesson"]},
            "key": {"type": "string", "description": "Required canonical topic key: 1-64 lowercase letters, digits or underscores, beginning with a letter. Name the attribute (for example home_city), never the memory sentence or value."},
            "value": {"description": "The typed value only, e.g. Berlin or false."},
            "cardinality": {"type": "string", "enum": ["single", "multi"], "description": "single when the user holds one value of this key at a time (home city, diet); multi when several hold together (allergies). A key the memory already knows keeps its cardinality."},
            "valid_at": {"type": "string", "description": "RFC3339 instant the memory became true, when known"}
          },
          "required": ["content", "key"]
        }
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "item_ids": {"type": "array", "items": {"type": "string"}}, "outcome": {"type": "object"}}, "required": ["success"]}
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: remember

  - name: memory_forget_tool
    kind: function.lua
    meta:
      type: tool
      mcp: { required_scopes: [state.write] }
      title: Forget Memory
      llm_alias: ForgetMemory
      llm_description: "Forget one of the user's memories by its id (from SearchMemory) when the user asks you to forget it. It is erased for good, with every earlier version of it."
      input_schema: |
        {"type": "object", "properties": {"item_id": {"type": "string"}}, "required": ["item_id"]}
      output_schema: |
        {"type": "object", "properties": {"success": {"type": "boolean"}, "error": {"type": "string"}, "memory_id": {"type": "string"}, "item_id": {"type": "string"}}, "required": ["success"]}
    source: file://runtime.lua
    modules: *runtime_modules
    imports: *runtime_imports
    method: forget

  - name: lifecycle_binding
    kind: contract.binding
    meta:
      title: Memory Lifecycle
      comment: Implements wippy.agent:lifecycle - pins the soul on activate and captures conversation on before_step, after_persist and deactivate.
    contracts:
      - contract: wippy.agent:lifecycle
        methods:
          apply: kickside.memory.agent:runtime_lifecycle

  - name: checkpoint_binding
    kind: contract.binding
    meta:
      title: Memory Checkpoint
      comment: Supplies the working session summary and captures the compacted range into memory.
    contracts:
      - contract: wippy.agent:checkpoint
        methods:
          create: kickside.memory.agent:runtime_checkpoint

  - name: memory_binding
    kind: contract.binding
    meta:
      title: Memory Recall
      comment: Implements wippy.agent:memory recall over a memory knowledge base.
    contracts:
      - contract: wippy.agent:memory
        context_required: [component_id]
        methods:
          recall: kickside.memory.agent:memory_provider_recall

  - name: memory_provider
    kind: registry.entry
    meta:
      type: agent.memory_provider
      title: Memory
      comment: Recalls typed long-term memory from a selected memory knowledge base each step.
      icon: tabler:brain
      order: 20
      implementation_id: kickside.memory.agent:memory_binding
      list_targets: kickside.memory.agent:list_memory_targets

  - name: memory
    kind: registry.entry
    meta:
      type: agent.trait
      public: true
      title: Memory
      icon: tabler:brain
      comment: Remembers conversations in one memory knowledge base, puts the agent's identity and rules and the user's profile into the prompt, and gives the agent Remember, SearchMemory and ForgetMemory.
      tags: [memory, checkpoint, knowledge]
      web_component: kickside-memory-agent
      context_schema:
        type: object
        properties:
          memory_id:
            type: string
            title: Memory
            description: The memory knowledge base this agent remembers into and recalls from.
            role: picker
            web_component: wc-kb-picker
          write_enabled:
            type: boolean
            title: Remember conversations
            description: Off keeps the memory read-only for this agent.
            role: value
          read_enabled:
            type: boolean
            title: SearchMemory tool
            description: Off makes SearchMemory answer that search is disabled.
            role: value
          recall_limit:
            type: integer
            title: SearchMemory page size
            role: value
        additionalProperties: false
    prompt: |
      You have long-term memory. What you know about the user and your own
      identity and rules appear in your instructions; relevant memories may be
      added as notes. Memory comes from earlier conversations and can be out of
      date: prefer what the user says now.

      Conversations are captured into memory automatically. Use SearchMemory to
      look something up, Remember only when the user explicitly asks you to
      remember something, and ForgetMemory when the user asks you to forget
      something.
    tools:
      - kickside.memory.agent:memory_recall_tool
      - kickside.memory.agent:memory_remember_tool
      - kickside.memory.agent:memory_forget_tool
    build_func_id: kickside.memory.agent:memory_build
    prompt_func_id: kickside.memory.agent:memory_prompt
    behaviors:
      - id: knowledge_memory
        kind: memory
        handles: [activate, before_step, after_persist, deactivate, checkpoint]
        handlers:
          lifecycle: kickside.memory.agent:lifecycle_binding
          checkpoint: kickside.memory.agent:checkpoint_binding
        priority: 10
        checkpoint:
          token_threshold: 64000
          model: class:fast
          max_tokens: 1000

  - name: settings_component
    kind: registry.entry
    meta:
      type: view.component
      title: Typed Memory Settings
      tag_name: kickside-memory-agent
      base_path: kickside-memory
      entry_point: index.js
      announced: true
      auto_register: false
