version: '1.0'
namespace: kickside.memory.test.module_access
entries:
- name: explicit_memory_deny
  kind: security.policy
  policy:
    resources: kickside.memory:knowledge_based_memory
    actions: registry.get
    effect: deny
- name: test
  kind: function.lua
  meta:
    type: test
    suite: module_access_policy
  source: file://test.lua
  method: run
  modules:
  - registry
  - security
  imports:
    test: wippy.test:test
