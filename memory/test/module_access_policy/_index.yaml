version: '1.0'
namespace: kickside.memory.test.module_access
entries:
- name: test
  kind: function.lua
  meta:
    type: test
    suite: module_access_policy
  source: file://test.lua
  method: run
  modules:
  - registry
  - security
  imports:
    test: wippy.test:test
- name: outsider_policy
  kind: security.policy
  groups: [app:memory_outsider]
  policy:
    resources: app:unrelated
    actions: access
    effect: allow
- name: explicit_memory_deny
  kind: security.policy
  policy:
    resources: kickside.memory:memory
    actions: registry.get
    effect: deny
