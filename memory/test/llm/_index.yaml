version: "1.0"
namespace: app.llm

entries:
  - name: script
    kind: library.lua
    source: file://script.lua
    modules: [sql, json, time]

  - name: driver_embed
    kind: function.lua
    source: file://provider.lua
    method: embed
    modules: [sql, json, hash]
    imports:
      script: app.llm:script

  - name: driver_structured_output
    kind: function.lua
    source: file://provider.lua
    method: structured_output
    modules: [sql, json, hash]
    imports:
      script: app.llm:script

  - name: driver_generate
    kind: function.lua
    source: file://provider.lua
    method: generate
    modules: [sql, json, hash]
    imports:
      script: app.llm:script

  - name: driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:embedder
        methods:
          embed: app.llm:driver_embed
      - contract: wippy.llm:structured_output
        methods:
          structured_output: app.llm:driver_structured_output
      - contract: wippy.llm:generator
        methods:
          generate: app.llm:driver_generate

  - name: provider
    kind: registry.entry
    meta:
      type: llm.provider
      name: memory-test
      title: Memory test provider
    driver:
      id: app.llm:driver

  - name: test-fast
    kind: registry.entry
    meta:
      type: llm.model
      name: test-fast
      title: Test fast
      capabilities: [generate, structured_output, tool_use]
      class: [default, fast]
      priority: 100
    max_tokens: 100000
    output_tokens: 8000
    providers:
      - id: app.llm:provider
        provider_model: test-fast

  - name: test-embed
    kind: registry.entry
    meta:
      type: llm.model
      name: test-embed
      title: Test embed
      capabilities: [embed]
      class: [embed]
      priority: 100
    dimensions: 512
    providers:
      - id: app.llm:provider
        provider_model: test-embed

  - name: test-small
    kind: registry.entry
    meta:
      type: llm.model
      name: test-small
      title: Small output test model
      capabilities: [generate, structured_output]
    max_tokens: 100000
    output_tokens: 256
    providers:
      - id: app.llm:provider
        provider_model: test-small
