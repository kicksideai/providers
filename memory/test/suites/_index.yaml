version: "1.0"
namespace: app.suites

entries:
  - name: fixture
    kind: library.lua
    source: file://fixture.lua
    modules: [sql, contract, security, funcs, channel, uuid, time]
    imports:
      script: app.llm:script
      history: app.suites:history

  - name: memory_call
    kind: function.lua
    meta: { comment: Runs a named memory operation in the caller's frame. }
    source: file://memory_call.lua
    method: call
    modules: [contract, security, sql, funcs]
    imports:
      memory_ops: kickside.memory.engine:ops
      memory_writer: kickside.memory.engine:writer
      memory_reconcile: kickside.memory.engine:reconcile
      memory_models: kickside.memory.engine:models
      agent_context: kickside.memory.agent:context
      agent_prompt: kickside.memory.agent:prompt
      agent_recall: kickside.memory.agent:recall
      agent_tools: kickside.memory.agent:tools
      memory_items: kickside.memory.persist:items
      memory_runs: kickside.memory.persist:runs
      memory_ledger: kickside.memory.engine:ledger
      memory_jobs: kickside.memory.engine:jobs
      memory_bindings: kickside.memory.engine:bindings
      component: kickside.component:component
      types: kickside.memory:types
      agent_compiler: wippy.agent.compiler:compiler
      agent: wippy.agent:agent
      llm_prompt: wippy.llm:prompt
      agent_lifecycle: wippy.agent:lifecycle_runtime

  - name: history
    kind: library.lua
    source: file://history.lua
    modules: [sql, json]

  - name: history_get_history
    kind: function.lua
    source: file://history.lua
    method: get_history
    modules: [sql, json]

  - name: history_get_prompt
    kind: function.lua
    source: file://history.lua
    method: get_prompt
    modules: [sql, json]

  - name: history_get_context
    kind: function.lua
    source: file://history.lua
    method: get_context
    modules: [sql, json]

  - name: history_binding
    kind: contract.binding
    meta: { comment: Test run_context over app_history. }
    contracts:
      - contract: wippy.agent:run_context
        methods:
          get_history: app.suites:history_get_history
          get_prompt: app.suites:history_get_prompt
          get_context: app.suites:history_get_context

  - name: engine_test
    kind: function.lua
    meta:
      type: test
      suite: memory_engine
      timeout: 300s
    source: file://engine_test.lua
    method: run
    modules: [json, registry]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: agent_test
    kind: function.lua
    meta:
      type: test
      suite: memory_agent
      timeout: 300s
    source: file://agent_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: consolidation_test
    kind: function.lua
    meta:
      type: test
      suite: memory_consolidation
      timeout: 300s
    source: file://consolidation_test.lua
    method: run
    modules: [time]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: state_test
    kind: function.lua
    meta:
      type: test
      suite: memory_state
      timeout: 300s
    source: file://state_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: surface_test
    kind: function.lua
    meta:
      type: test
      suite: memory_surface
      timeout: 300s
    source: file://surface_test.lua
    method: run
    modules: [json, http_client, registry]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture
      session: kickside.users:session
      user_groups_repo: kickside.users.persist:user_groups_repo
      types: kickside.memory:types

  - name: persistence_call
    kind: function.lua
    source: file://persistence_call.lua
    method: call
    modules: [sql]
    imports:
      memory_runs: kickside.memory.persist:runs
      memory_ledger: kickside.memory.engine:ledger
      measured_db: app.suites:measured_db
      memory_writer: kickside.memory.engine:writer
      memory_items: kickside.memory.persist:items
      memory_payloads: kickside.memory.persist:payloads
      memory_fold: kickside.memory.persist:fold
      memory_models: kickside.memory.engine:models
      search_index: kickside.search_index:index
      types: kickside.memory:types

  - name: erasure_test
    kind: function.lua
    meta:
      type: test
      suite: memory_erasure
      timeout: 300s
    source: file://erasure_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: search_test
    kind: function.lua
    meta:
      type: test
      suite: memory_search
      timeout: 300s
    source: file://search_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: concurrency_test
    kind: function.lua
    meta:
      type: test
      suite: memory_concurrency
      timeout: 300s
    source: file://concurrency_test.lua
    method: run
    modules: [sql, time]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture

  - name: measured_db
    kind: library.lua
    source: file://measured_db.lua
    imports:
      memory_db: kickside.memory.persist:db

  - name: models_test
    kind: function.lua
    meta: { type: test, suite: memory_models, timeout: 300s }
    source: file://models_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      fixture: app.suites:fixture
