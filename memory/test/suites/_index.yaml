  - name: upgrade_db
    kind: library.lua
    source: file://upgrade_db.lua
    modules: [sql]

  - name: upgrade_items
    kind: library.lua
    source: file://upgrade_items.lua
    imports:
      memory_db: app.suites:upgrade_db
