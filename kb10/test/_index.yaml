version: "1.0"
namespace: app

# Standalone harness for kickside/kb10. Loads kb10's own src via
# directories.src=../src and boots the kickside/knowledge control plane so the
# integration suites below run against real engine stores. The control plane
# resolves kb10 through the kb_engine registry + the kb_store contract. Host
# resources (db, processes, api, env storage, a permissive actor scope), the
# kb_ingest fetch_url fixture gateway, and kb10's own integration suites
# (exercising kickside/knowledge's control plane against the kb10 engine)
# live here. Harness-only; excluded from publish via the namespace exclude in
# wippy.yaml.

entries:
  - name: dep.kickside.realtime
    kind: ns.dependency
    component: kickside/realtime
    version: '*'

  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta:
      comment: In-memory database for kb10 slice tests.
    file: ":memory:"

  - name: uploads
    kind: fs.directory
    meta:
      comment: Default uploads storage so the artifact content repository can write artifact blobs.
    directory: ./.wippy

  - name: env_storage
    kind: env.storage.file
    meta:
      type: envstorage
    file_path: ./.wippy/test.env
    auto_create: true

  - name: processes
    kind: process.host
    lifecycle:
      auto_start: true

  - name: gateway
    kind: http.service
    meta:
      comment: Test HTTP server.
    addr: :19097
    lifecycle:
      auto_start: true

  - name: api
    kind: http.router
    meta:
      comment: Test API router.
      server: gateway
    prefix: /api

  - name: api_public
    kind: http.router
    meta:
      comment: >-
        Separate router for wippy/views to avoid colliding views'
        /components/by-tag/{tag} with the component module's
        /components/{id}/access on /api.
      server: gateway
    prefix: /public

  - name: user
    kind: security.policy
    meta:
      comment: Permissive scope the kb10 suites run their scoped actors under.
    groups:
      - kb_test
      - app:user
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: runtime_calls_only
    kind: security.policy
    meta:
      comment: >-
        Runtime-level access without any threads.output.publish capability. A caller under
        exactly this scope reaches an output event only through a producer policy declared on
        the entry it runs.
    policy:
      resources: '*'
      actions:
        - access
        - db.get
        - registry.get
        - contract.get
        - contract.open
        - contract.call
        - contract.security
        - process.send
        - funcs.call
        - funcs.security
        - security.policy_group.get
        - security.policy.get
        - security.actor.get
        - security.scope.get
        - security.scope.create
        - security.actor.create
      effect: allow

  - name: admin
    kind: security.policy
    meta:
      comment: Permissive administrator scope used by structured lifecycle grants.
    groups:
      - kb_test_admin
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: graph_fetch_tree
    kind: function.lua
    meta:
      comment: Test-only scoped wrapper for graph_functions.fetch_concept_tree.
    source: file://graph_fetch_tree.lua
    method: run
    imports:
      graph_fn: kickside.kb10.graph:graph_functions

  # Integration suites that exercise kickside/knowledge's control plane against the
  # kb10 engine (document/graph KBs) plus the cross-engine KB control plane. Each
  # opens kb10's kb_store contract and the KickSide embeddable/queryable bindings,
  # asserting on kb10_* rows. The mixed suites (knowledge, knowledge_bases) drive
  # kb10 through the control plane.

  - name: graph_test
    kind: function.lua
    meta:
      type: test
      suite: graph
      timeout: 180s
    source: file://graph_test.lua
    method: run
    modules: [sql, json, crypto, funcs, contract, security]
    imports:
      test: wippy.test:test
      graph_fn: kickside.kb10.graph:graph_functions
      kb10_types: kickside.kb10:types
      materializer_lib: kickside.kb10.injection:materializer_store
      node_store: kickside.kb10.persist:node_store

  - name: graph_change_probe
    kind: function.lua
    meta:
      type: test_helper
      comment: Appends graph.changed from an entry that declares no producer policy.
    source: file://graph_change_probe.lua
    method: handle
    imports:
      thread_ingest: kickside.knowledge.injection:thread_ingest

  - name: graph_change_publish_test
