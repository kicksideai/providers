version: "1.0"
namespace: app
entries:
  - name: source_checkpoint_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint}
    source: file://source_checkpoint_test.lua
    method: run
    modules: [sql, json, time, uuid, fs]
    imports:
      apply: kickside.core.projections:apply
      artifact_input: kickside.kb10.injection:artifact_input
      artifacts: kickside.uploads.persist:artifact_content_repo
      artifact_cleanup: kickside.uploads.persist:artifact_cleanup_repo
      claim: kickside.core.jobs.persist:claim
      clock: kickside.core.jobs:clock
      ops: kickside.kb10.persist:ops
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
      uploads: kickside.uploads.persist:upload_record_repo
      writer: kickside.kb10.persist:writer
      publication_plan: kickside.kb10.injection:source_publication_plan
      publication_slot: kickside.kb10.injection:source_publication_slot

  - name: checkpoint_model_provider
    kind: registry.entry
    meta: {type: llm.provider, name: kb10-checkpoint-fixture}
    driver: {id: app:checkpoint_model_driver}

  - name: checkpoint_model_driver
    kind: contract.binding
    contracts:
      - contract: wippy.llm:provider
        methods: {status: app:checkpoint_model_status}
      - contract: wippy.llm:embedder
        methods: {embed: app:checkpoint_model_embed}

  - name: checkpoint_model_status
    kind: function.lua
    source: file://source_checkpoint_provider.lua
    method: status
    modules: [sql]

  - name: checkpoint_model_embed
    kind: function.lua
    source: file://source_checkpoint_provider.lua
    method: embed
    modules: [sql]

  - name: source_checkpoint_outage_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint, timeout: 75s}
    source: file://source_checkpoint_outage_test.lua
    method: run
    modules: [channel, fs, hash, json, process, sql, time, uuid]
    imports:
      projection_owner: app:projection_owner_fixture
      artifact_cleanup: kickside.uploads.persist:artifact_cleanup_repo
      artifacts: kickside.uploads.persist:artifact_content_repo
      enrichment_consts: kickside.kb10.graph:enrichment_consts
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer
      uploads: kickside.uploads.persist:upload_record_repo

  - name: source_worker_outage_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint, timeout: 75s}
    source: file://source_checkpoint_outage_test.lua
    method: ordinary
    modules: [channel, fs, hash, json, process, sql, time, uuid]
    imports:
      projection_owner: app:projection_owner_fixture
      artifact_cleanup: kickside.uploads.persist:artifact_cleanup_repo
      artifacts: kickside.uploads.persist:artifact_content_repo
      enrichment_consts: kickside.kb10.graph:enrichment_consts
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer
      uploads: kickside.uploads.persist:upload_record_repo

  - name: source_provider_rejection_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint, timeout: 75s}
    source: file://source_provider_rejection_test.lua
    method: run
    modules: [json, process, sql, time, uuid]
    imports:
      apply: kickside.core.projections:apply
      claim: kickside.core.jobs.persist:claim
      clock: kickside.core.jobs:clock
      ops: kickside.kb10.persist:ops
      source_repair: kickside.kb10.injection:source_repair
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer

  - name: source_worker_finalizer_edges_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint, timeout: 75s}
    source: file://source_checkpoint_outage_test.lua
    method: finalizer_edges
    modules: [channel, fs, hash, json, process, sql, time, uuid]
    imports:
      projection_owner: app:projection_owner_fixture
      artifact_cleanup: kickside.uploads.persist:artifact_cleanup_repo
      artifacts: kickside.uploads.persist:artifact_content_repo
      enrichment_consts: kickside.kb10.graph:enrichment_consts
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer
      uploads: kickside.uploads.persist:upload_record_repo

  - name: finalizer_empty_source
    kind: registry.entry
    meta: {type: kickside.core.threads.event}
    schema:
      type: object
      properties:
        kb_id: {type: string}
      required: [kb_id]

  - name: finalizer_empty_extractor
    kind: function.lua
    meta:
      type: projection.extractor
      source: fixture.empty
      event_types: [app:finalizer_empty_source]
    source: file://finalizer_empty_extractor.lua
    method: run
    modules: [sql]

  - name: projection_owner_fixture
    kind: library.lua
    source: file://../fixtures/projection_owner.lua
    modules: [contract, security, sql]

  - name: retry_fixture_api
    kind: http.router
    meta:
      server: gateway
    prefix: /retry-fixture
    middleware: [token_auth]
    options:
      token_store: kickside.users.security:tokens

  - name: retry_fixture.endpoint
    kind: http.endpoint
    meta:
      router: retry_fixture_api
    method: POST
    path: /knowledge/{id}/retry-source
    func: kickside.knowledge.api:retry_source

  - name: same_revision_retry_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint, timeout: 75s}
    source: file://source_checkpoint_outage_test.lua
    method: same_revision
    modules: [channel, contract, fs, hash, http_client, json, process, registry, security, sql, time, uuid]
    imports:
      projection_owner: app:projection_owner_fixture
      artifact_cleanup: kickside.uploads.persist:artifact_cleanup_repo
      artifacts: kickside.uploads.persist:artifact_content_repo
      enrichment_consts: kickside.kb10.graph:enrichment_consts
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      provision: kickside.core.threads:provision
      projections: kickside.core.projections.persist:writer
      groups: kickside.users.persist:user_groups_repo
      session: kickside.users:session
      store: kickside.kb10.persist:store
      test: wippy.test:test
      threads: kickside.core.threads.persist:writer
      uploads: kickside.uploads.persist:upload_record_repo

  - name: conflict_page
    kind: registry.entry
    meta: {type: kickside.core.threads.event}
    schema:
      type: object
      properties:
        page_id: {type: string}
        title: {type: string}
        text: {type: string}
      required: [page_id, title, text]

  - name: source_fixture_component
    kind: contract.binding
    meta:
      events:
        input: [{type: "app:conflict_page"}, {type: "app:registered_fanout_event"}]
        output:
          - {type: "kickside.knowledge.events:content.upserted"}
          - {type: "kickside.knowledge.events:content.deleted"}
          - {type: "kickside.knowledge.events:graph.changed"}
          - {type: "kickside.knowledge.events:digest.requested"}
          - {type: "kickside.knowledge.events:treatment.requested"}
    contracts:
      - contract: kickside.contract:component
        methods: {get_status: "kickside.core.threads:thread_status"}

  # Keep the earlier single-event checkpoint worker covered independently.
  - name: checkpoint_fixture_descriptor
    kind: registry.entry
    meta:
      impl_id: app:source_fixture_component
      thread: {class: kb10.test.checkpoint}
      projections:
        - kind: knowledge.injection.source
          projection_key: source
          cursor_key: source
          worker_ref: proc://kickside.kb10.injection:checkpoint_source_worker
          input_mode: prefetch_events
          worker_config: {materialization: {summary_model: false, chunk_enrichment_model: false}}
          events:
            input:
              - {type: "kickside.knowledge.events:content.upserted"}
              - {type: "kickside.knowledge.events:content.deleted"}

  - name: primary_fixture_descriptor
    kind: registry.entry
    meta:
      impl_id: app:source_fixture_component
      thread: {class: kb10.test.primary}
      projections:
        - kind: knowledge.injection.source
          projection_key: source
          cursor_key: source
          worker_ref: proc://kickside.kb10.injection:primary_source_worker
          input_mode: prefetch_events
          worker_config: {materialization: {summary_model: false, chunk_enrichment_model: false}}
          events:
            input:
              - {type: "kickside.knowledge.events:content.upserted"}
              - {type: "kickside.knowledge.events:content.deleted"}
              - {type: "app:finalizer_empty_source"}

  - name: source_fanout_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint}
    source: file://source_fanout_test.lua
    method: run
    modules: [contract, funcs, security, sql]
    imports:
      fixtures: app:source_worker_fixtures
      projection_owner: app:projection_owner_fixture
      store: kickside.kb10.persist:store
      source_worker: kickside.kb10.injection:source_worker_lib
      test: wippy.test:test

  - name: fanout_materialize_fixture
    kind: function.lua
    meta: {type: test_helper}
    source: file://source_fanout_test.lua
    method: materialize
    modules: [contract, funcs, security, sql]
    imports:
      fixtures: app:source_worker_fixtures
      projection_owner: app:projection_owner_fixture
      store: kickside.kb10.persist:store
      source_worker: kickside.kb10.injection:source_worker_lib
      test: wippy.test:test

  - name: registered_fanout_event
    kind: registry.entry
    meta: {type: kickside.core.threads.event}
    schema:
      type: object
      properties:
        text: {type: string}
      required: [text]

  - name: registered_fanout_extractor
    kind: function.lua
    meta:
      type: projection.extractor
      source: test.registered.fanout
      event_types: ["app:registered_fanout_event"]
    source: file://registered_fanout_extractor.lua
    method: run

  - name: registered_source_test
    kind: function.lua
    meta: {type: test, suite: kb10_source_checkpoint}
    source: file://registered_source_test.lua
    method: run
    modules: [channel, contract, json, process, security, sql, time, uuid]
    imports:
      enrichment_consts: kickside.kb10.graph:enrichment_consts
      jobs: kickside.core.jobs:jobs
      models: kickside.models.persist:repo
      projection_owner: app:projection_owner_fixture
      projections: kickside.core.projections.persist:writer
      store: kickside.kb10.persist:store
      test: wippy.test:test
