organization: kickside
module: kb10
type: plugin
description: KickSide KB10 — the document/graph knowledge-base engine. Owns the kb10_* schema and node/edge/embedding store, durable embeddable/queryable/deletable bindings, and the kb_store engine contract used by kickside/knowledge.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/providers
homepage: https://wippy.ai
keywords:
  - kickside
  - knowledge
  - kb10
  - rag
  - embeddings
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
embed:
  - kickside.kb10.ui:ui_fs
exclude:
  - "app:**"
  - "app.env:**"
  - "app.fixtures:**"
  - "ui/node_modules/**"
  - "ui/dist/**"
  - "static/*.map"
  - "static/**/*.map"
  - "ui/node_modules:**"
  - "ui/coverage/**"
  - "ui/coverage:**"
  - "test/**"
  - "test:**"
  - ".wippy/**"
  - ".wippy:**"
  - "test/stubs/**"
  - "test/stubs:**"
  - "src/**/stubs/**"
  - "src/**/*.spec.ts"
  - "src/**/*.spec.tsx"
  - "ui/src/**/*.spec.ts"
  - "ui/src/**/*.spec.tsx"
  - "tests/**"
  - "test-support/**"
  - "app.**:**"
