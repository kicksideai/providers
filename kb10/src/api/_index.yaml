version: "1.0"
namespace: kickside.kb10.api

# HTTP surface the kb10 engine owns, on its OWN /kb10/ domain (not knowledge's
# /knowledge/ public API): browse/graph reads over the kb10 node+edge store plus
# canonical concept management. Raw node deletion is rejected at the HTTP
# boundary so source content deletes stay on the durable knowledge thread. The
# same backend serves every kb10 UI (document/graph/wiki).
# {id} is the KB component id. Access is enforced by the component service; the
# store is reached through the kb_store engine contract.
# The maintenance start and status behaviour is additionally exposed here as
# library seams, so a caller outside kb10 schedules and follows a run through the
# same code path the endpoints run rather than executing the verb itself.

entries:
  - name: query_params
    kind: library.lua
    meta:
      name: query_params
      comment: Strict query-param parsing shared by kb10 endpoints.
    source: file://query_params.lua
    modules: [http]

  - name: request
    kind: library.lua
    meta:
      name: request
      comment: The shared preamble for kb10's {id}-addressed endpoints -- http context, actor, kb id and access -- so every endpoint refuses in one vocabulary.
    source: file://request.lua
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component

  - name: browse
    kind: function.lua
    source: file://browse.lua
    modules: [http, json, security, sql]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      node_store: kickside.kb10.persist:node_store
      query_params: kickside.kb10.api:query_params
    method: handler

  - name: browse.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: GET
    func: browse
    path: /kb10/{id}/browse

  - name: graph_implementation
    kind: library.lua
    meta:
      comment: Focused implementation for kickside.kb10.api:graph; invoked by its one-method function wrapper.
    source: file://graph.lua
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      query_params: kickside.kb10.api:query_params

  - name: graph
    kind: function.lua
    source: file://_fn_graph.lua
    imports:
      operation_impl: kickside.kb10.api:graph_implementation
    method: handler

  - name: graph.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: GET
    func: graph
    path: /kb10/{id}/graph

  - name: search
    kind: function.lua
    source: file://search.lua
    modules: [http, security]
    imports:
      component: kickside.component:component
      query_params: kickside.kb10.api:query_params
      http_errors: kickside.contract:http_errors
    method: handler

  - name: search.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: GET
    func: search
    path: /kb10/{id}/search

  - name: delete_node
    kind: function.lua
    source: file://delete_node.lua
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      node_store: kickside.kb10.persist:node_store
    method: handler

  - name: delete_node.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: DELETE
    func: delete_node
    path: /kb10/{id}/nodes/{node_id}

  - name: concepts_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://concepts.lua
    modules: [http, json, security, logger]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      thread_ingest: kickside.knowledge.injection:thread_ingest
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines

  - name: concepts_create
    kind: function.lua
    source: file://concepts_create.lua
    modules: [http, json, security, logger]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      thread_ingest: kickside.knowledge.injection:thread_ingest
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      implementation: kickside.kb10.api:concepts_implementation
    method: create_concept

  - name: concepts_create.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: POST
    func: concepts_create
    path: /kb10/{id}/concepts

  - name: concepts_update
    kind: function.lua
    source: file://concepts_update.lua
    modules: [http, json, security, logger]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      thread_ingest: kickside.knowledge.injection:thread_ingest
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      implementation: kickside.kb10.api:concepts_implementation
    method: update_concept

  - name: concepts_update.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: PATCH
    func: concepts_update
    path: /kb10/{id}/concepts/{node_id}

  - name: concepts_move
    kind: function.lua
    source: file://concepts_move.lua
    modules: [http, json, security, logger]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      thread_ingest: kickside.knowledge.injection:thread_ingest
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      implementation: kickside.kb10.api:concepts_implementation
    method: move_concept

  - name: concepts_move.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: PUT
    func: concepts_move
    path: /kb10/{id}/concepts/{node_id}/parent

  - name: concepts_delete
    kind: function.lua
    source: file://concepts_delete.lua
    modules: [http, json, security, logger]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      thread_ingest: kickside.knowledge.injection:thread_ingest
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      implementation: kickside.kb10.api:concepts_implementation
    method: delete_concept

  - name: concepts_delete.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: DELETE
    func: concepts_delete
    path: /kb10/{id}/concepts/{node_id}

  - name: source
    kind: function.lua
    source: file://source.lua
    modules: [http, security]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      upload_tokens: kickside.uploads.persist:upload_tokens
    method: handler

  - name: source.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: GET
    func: source
    path: /kb10/{id}/nodes/{node_id}/source

  - name: enrichment
    kind: function.lua
    meta:
      comment: "POST /kb10/{id}/enrichment — re-run concept-graph enrichment for every document without a concept categorization; the manual recovery handle after a failed placement pass. Clears the KB's enrichment_error attention flag and re-dispatches each unplaced document to the enrichment service under the requesting actor's identity."
    source: file://enrichment.lua
    modules: [http, logger, security]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      node_store: kickside.kb10.persist:node_store
      kc: kickside.kb10:types
      engines: kickside.knowledge:engines
      execution_identity: kickside.execution:execution_identity
      enrichment_consts: kickside.kb10.graph:enrichment_consts
    method: handler

  - name: enrichment.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: POST
    func: enrichment
    path: /kb10/{id}/enrichment

  # The maintenance surface: two deferred verbs and the run record they report
  # through. Every caller mints a job -- the HTTP endpoints below and, through
  # the library seams beside them, another module's tool;
  # kickside.kb10.engine:maintenance_worker runs it.
  - name: maintenance_implementation
    kind: library.lua
    meta:
      comment: "POST /kb10/{id}/resummarize, POST /kb10/{id}/reembed and GET /kb10/{id}/maintenance -- mint a maintenance job under the caller's frozen identity and read back the run record it reports through."
    source: file://maintenance.lua
    modules: [http, time]
    imports:
      component: kickside.component:component
      execution_identity: kickside.execution:execution_identity
      jobs: kickside.core.jobs:jobs
      job_types: kickside.core.jobs:types
      request: kickside.kb10.api:request
      maintenance_runs: kickside.kb10.persist:maintenance_runs

  # The same start and status behaviour as libraries, for a caller that has no
  # HTTP request behind it: the Knowledge Manager tool's maintenance actions
  # reach these through the knowledge module's engine requirements, so both
  # surfaces defer a run through one path instead of one deferring and the other
  # blocking. Each answers (value, err).
  - name: schedule_resummarize
    kind: library.lua
    meta:
      comment: "Cross-module start seam: run(component_id) mints the resummarize job POST /kb10/{id}/resummarize mints, and answers the scheduling receipt."
    source: file://schedule_resummarize.lua
    imports:
      maintenance: kickside.kb10.api:maintenance_implementation
      maintenance_runs: kickside.kb10.persist:maintenance_runs

  - name: schedule_reembed
    kind: library.lua
    meta:
      comment: "Cross-module start seam: run(component_id) mints the re-embed job POST /kb10/{id}/reembed mints, and answers the scheduling receipt."
    source: file://schedule_reembed.lua
    imports:
      maintenance: kickside.kb10.api:maintenance_implementation
      maintenance_runs: kickside.kb10.persist:maintenance_runs

  - name: maintenance_status
    kind: library.lua
    meta:
      comment: "Cross-module status seam: run(component_id) answers the latest resummarize and re-embed run of a KB with in_flight, the read GET /kb10/{id}/maintenance answers with."
    source: file://maintenance_status.lua
    imports:
      maintenance: kickside.kb10.api:maintenance_implementation

  - name: reembed
    kind: function.lua
    meta:
      name: reembed
      comment: "POST /kb10/{id}/reembed — schedule regeneration of the KB's vectors from stored node content with the KB's own embedding model."
    source: file://reembed.lua
    imports:
      implementation: kickside.kb10.api:maintenance_implementation
    method: handler

  - name: reembed.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: POST
    func: reembed
    path: /kb10/{id}/reembed

  - name: resummarize
    kind: function.lua
    meta:
      name: resummarize
      comment: "POST /kb10/{id}/resummarize — schedule regeneration of the KB's stored document summaries (and dependent chunk contextual prefixes) under current materialization settings, from stored content, without re-delivering the source."
    source: file://resummarize.lua
    imports:
      implementation: kickside.kb10.api:maintenance_implementation
    method: handler

  - name: resummarize.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: POST
    func: resummarize
    path: /kb10/{id}/resummarize

  - name: maintenance_get
    kind: function.lua
    meta:
      name: maintenance_get
      comment: "GET /kb10/{id}/maintenance — the latest resummarize and re-embed run for this KB: progress while one is in flight, terminal counts and failure reason once it settles."
    source: file://maintenance_get.lua
    imports:
      implementation: kickside.kb10.api:maintenance_implementation
    method: handler

  - name: maintenance_get.endpoint
    kind: http.endpoint
    meta:
      router: ""
    method: GET
    func: maintenance_get
    path: /kb10/{id}/maintenance
