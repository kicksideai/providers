version: "1.0"
namespace: app
entries:
  - name: oauth_fixture
    kind: function.lua
    source: file://oauth_fixture.lua
    method: handler
    modules: [http, json, sql, uuid, hash, base64]
    security:
      actor: {id: mcp-oauth-fixture-server}
      policies: [app:oauth_fixture_all]
  - name: fixture_router
    kind: http.router
    meta: {server: gateway}
    prefix: ""
  - name: oauth_fixture.endpoint
    kind: http.endpoint
    meta: {router: fixture_router}
    method: GET
    path: /fixture/{action}
    func: oauth_fixture
  - name: oauth_fixture.metadata
    kind: http.endpoint
    meta: {router: fixture_router}
    method: GET
    path: /.well-known/oauth-authorization-server
    func: oauth_fixture
  - name: oauth_fixture_all
    kind: security.policy
    policy: {resources: '*', actions: '*', effect: allow}
  - name: oauth_init_proxy
    kind: function.lua
    source: file://oauth_init_source.lua
    method: handler
    modules: [http, contract, env, logger, process, security, funcs]
    imports:
      http_errors: kickside.contract:http_errors
      component: kickside.component:component
      runtime_config: kickside.oauth:runtime_config
    security:
      actor: {id: 8fcff8a1-01ad-423c-8e20-a34860574b23}
      policies: [app:oauth_fixture_all]
  - name: oauth_init_proxy.endpoint
    kind: http.endpoint
    meta: {router: fixture_router}
    method: POST
    path: /test-oauth/{provider_name}/init
    func: oauth_init_proxy
  - name: oauth_e2e_test
    kind: function.lua
    source: file://oauth_e2e_test.lua
    method: run
    meta: {type: test, suite: mcp_oauth_e2e}
    modules: [http_client, json, sql, funcs, security, time, process, channel]
    imports:
      test: wippy.test:test
      oauth: kickside.mcp_client.oauth:service
      component: kickside.component:component
      oauth_repo: kickside.oauth.persist:oauth_repo
      oauth_read_repo: kickside.oauth.persist:oauth_read_repo
      oauth_token_repo: kickside.oauth.persist:oauth_token_repo
      refresh_schedule: kickside.oauth:refresh_schedule
      oauth_config: kickside.mcp_client.oauth:config
      client: kickside.mcp_client:http_client

  - name: oauth_fixture.post
    kind: http.endpoint
    meta: {router: fixture_router}
    method: POST
    path: /fixture/{action}
    func: oauth_fixture
  - name: oauth_fixture.delete
    kind: http.endpoint
    meta: {router: fixture_router}
    method: DELETE
    path: /fixture/{action}
    func: oauth_fixture

  - name: public_api_url
    kind: env.variable
    variable: PUBLIC_API_URL
    storage: app:env_storage
    default: http://127.0.0.1:19129
