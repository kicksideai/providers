version: '1.0'
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
vars:
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_mcp_client
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
      app:db:pool.max_open: 16
      app:db:pool.max_idle: 8
workspace:
  replacements:
    kickside/mcp-client: ..
    kickside/component: ../../../kickside/core/component
    kickside/connection: ../../../kickside/platform/connection
    kickside/contract: ../../../kickside/core/contract
    kickside/core: ../../../kickside/core/core
    kickside/execution: ../../../kickside/core/execution
    kickside/jobs: ../../../kickside/core/jobs
    kickside/settings: ../../../kickside/platform/settings
    kickside/uploads: ../../../kickside/platform/uploads
    kickside/users: ../../../kickside/platform/users
