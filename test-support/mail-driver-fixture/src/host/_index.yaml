version: "1.0"
namespace: test.mail_driver_fixture.host
entries:
  - name: site_title
    kind: registry.entry
    meta: {type: "kickside.settings:definition"}
    namespace: kickside.ui
    key: title
    scope: global
    value_type: string
    default: Example Workspace
  - name: unrelated_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: app.unrelated
    key: api_key
    scope: global
    value_type: secret
    read_access: admin
    default: ""
  - name: db
    kind: db.sql.sqlite
    file: ./.wippy/driver-test.sqlite
    foreign_keys: true
    pool: { max_open: 1, max_idle: 1 }
  - name: env_storage
    kind: env.storage.file
    meta: { type: envstorage }
    file_path: ./.wippy/test.env
    auto_create: true
  - name: uploads
    kind: fs.directory
    directory: ./.wippy/uploads
    auto_init: true
  - name: processes
    kind: process.host
    lifecycle: { auto_start: true }
  - name: gateway
    kind: http.service
    addr: "127.0.0.1:0"
    lifecycle: { auto_start: true }
  - name: api
    kind: http.router
    meta: { server: test.mail_driver_fixture.host:gateway }
    prefix: /api
    middleware: [token_auth]
    post_middleware: [endpoint_firewall]
    options: { token_store: kickside.users.security:tokens }
  - name: public
    kind: http.router
    meta: { server: test.mail_driver_fixture.host:gateway }
    prefix: /public
  - name: user
    kind: security.scope
  - name: mail_senders
    kind: security.scope
  - name: mail_senders_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: test.mail_driver_fixture.host:mail_senders
    policies: [kickside.mail.security:send_access, app:stub_private_ip]
  - name: user_admins
    kind: security.scope
  - name: uploaders
    kind: security.scope
  - name: uploaders_composition
    kind: registry.entry
    meta: { type: kickside.security.group_composition }
    group_id: test.mail_driver_fixture.host:uploaders
    policies:
      - kickside.contract.security:module_access
      - kickside.component.security:module_access
      - kickside.uploads.security:module_access
      - test.mail_driver_fixture.host:uploads_database_access
      - test.mail_driver_fixture.host:content_provider_methods
      - test.mail_driver_fixture.host:content_provider_security
  - name: uploads_storage_access
    kind: security.policy
    policy:
      resources: [test.mail_driver_fixture.host:uploads]
      actions: [fs.get, fs.read, fs.stat]
      effect: allow
  - name: uploads_database_access
    kind: security.policy
    policy:
      resources: [test.mail_driver_fixture.host:db]
      actions: [db.get]
      effect: allow
  - name: content_provider_methods
    kind: security.policy
    policy:
      resources: [get_info, get_content, get_access_context]
      actions: [contract.call]
      effect: allow
  - name: content_provider_security
    kind: security.policy
    policy:
      resources: [security]
      actions: [contract.security, funcs.security]
      effect: allow
  - name: dep.test
    kind: ns.dependency
    component: wippy/test
    version: "*"
  - name: dep.bootloader
    kind: ns.dependency
    component: wippy/bootloader
    version: "*"
    parameters:
      - { name: wippy.bootloader:application_host, value: "test.mail_driver_fixture.host:processes" }
      - { name: wippy.bootloader:env_storage, value: "test.mail_driver_fixture.host:env_storage" }
  - name: dep.migration
    kind: ns.dependency
    component: wippy/migration
    version: "*"
    parameters:
      - { name: wippy.migration:app_db, value: "test.mail_driver_fixture.host:db" }
  - name: dep.uploads
    kind: ns.dependency
    component: kickside/uploads
    version: "*"
    parameters:
      - { name: "kickside.uploads:database_resource", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.uploads:storage_id", value: "test.mail_driver_fixture.host:uploads" }
      - { name: "kickside.uploads:env_storage", value: "test.mail_driver_fixture.host:env_storage" }
      - { name: "kickside.uploads:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.uploads:ui_server", value: "test.mail_driver_fixture.host:gateway" }
      - { name: "kickside.uploads.security:user_security_scope", value: "test.mail_driver_fixture.host:uploaders" }
      - { name: "kickside.uploads:storage_runtime_policy", value: "test.mail_driver_fixture.host:uploads_storage_access" }
      - { name: "kickside.component:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.component:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.core:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.core.lifecycle:process_host", value: "test.mail_driver_fixture.host:processes" }
      - { name: "kickside.core.lifecycle:user_lifecycle_grant", value: { subject_id: "test.mail_driver_fixture.host:user", subject_type: group, access_mask: 2 } }
      - { name: "kickside.core.lifecycle:admin_lifecycle_grant", value: { subject_id: "test.mail_driver_fixture.host:user", subject_type: group, access_mask: 3 } }
      - { name: "kickside.core.retention:process_host", value: "test.mail_driver_fixture.host:processes" }
      - { name: "kickside.core.threads:process_host", value: "test.mail_driver_fixture.host:processes" }
      - { name: "kickside.core.retention:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.core.threads:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.core.projections:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.core.jobs:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.core.jobs:process_host", value: "test.mail_driver_fixture.host:processes" }
  - name: dep.users
    kind: ns.dependency
    component: kickside/users
    version: "*"
    parameters:
      - { name: "kickside.users:env_storage", value: "test.mail_driver_fixture.host:env_storage" }
      - { name: "kickside.users:public_router", value: "test.mail_driver_fixture.host:public" }
      - { name: "kickside.users:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.users:ui_server", value: "test.mail_driver_fixture.host:gateway" }
      - { name: "kickside.users:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.users:admin_security_scope", value: "test.mail_driver_fixture.host:user_admins" }
      - { name: "kickside.users:login_role_resource", value: "test.mail_driver_fixture.host:*" }
      - { name: "kickside.security:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.security:process_host", value: "test.mail_driver_fixture.host:processes" }
      - { name: "kickside.security:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.security:ui_server", value: "test.mail_driver_fixture.host:gateway" }
      - { name: "kickside.settings:target_db", value: "test.mail_driver_fixture.host:db" }
      - { name: "kickside.settings:api_router", value: "test.mail_driver_fixture.host:api" }
      - { name: "kickside.settings:ui_server", value: "test.mail_driver_fixture.host:gateway" }
  - name: dep.views
    kind: ns.dependency
    component: wippy/views
    version: "*"
    parameters:
      - { name: wippy.views:server, value: "test.mail_driver_fixture.host:gateway" }
      - { name: wippy.views:api_router, value: "test.mail_driver_fixture.host:public" }
      - { name: wippy.views:env_storage, value: "test.mail_driver_fixture.host:env_storage" }
  - name: dep.session
    kind: ns.dependency
    component: wippy/session
    version: "*"
    parameters:
      - { name: wippy.session.forms.ui:ui_server, value: "test.mail_driver_fixture.host:gateway" }
      - { name: wippy.session:api_router, value: "test.mail_driver_fixture.host:api" }
      - { name: wippy.session:database_resource, value: "test.mail_driver_fixture.host:db" }
      - { name: wippy.session:default_host, value: "test.mail_driver_fixture.host:processes" }
      - { name: wippy.session:env_storage, value: "test.mail_driver_fixture.host:env_storage" }
      - { name: wippy.session:delegation_func_id, value: "userspace.dataflow.session:delegate" }
  - name: test_scope
    kind: security.policy
    groups: [test.mail_driver_fixture.host:user]
    policy:
      resources: ['app:actor_probe']
      actions: [funcs.call]
      effect: allow
  - name: settings_probe_access
    kind: security.policy
    policy:
      resources: [kickside.settings:settings, kickside.settings:settings_binding, get_namespace]
      actions: [contract.get, contract.open, contract.call]
      effect: allow
