version: "1.0"
namespace: example.mail.relay.settings
entries:
  - name: setting_api_key
    kind: registry.entry
    meta: { type: "kickside.settings:definition" }
    namespace: example.mail.relay
    key: api_key
    title: API key
    description: API key authorized to send mail through Example Relay.
    scope: global
    value_type: secret
    read_access: admin
    default: ""
    order: 10
    validate_func: example.mail.relay.settings:validate_api_key
  - name: validate_api_key
    kind: function.lua
    source: file://validate.lua
    method: api_key
    imports: {config: kickside.mail.driver:config}
  - name: settings_block
    kind: registry.entry
    meta:
      type: kickside.settings:block
      comment: The Example Relay entry in System Settings, beside Mail; the shared settings card edits this namespace.
    key: mail-driver-example
    title: Example Relay
    icon: lucide:mail
    group: Integrations
    order: 40
    component_tag: kickside-settings-provider
    namespace: example.mail.relay
    config:
      namespace: example.mail.relay
      title: Example Relay
      icon: lucide:mail
      help: Example Relay API key for Mail delivery.
