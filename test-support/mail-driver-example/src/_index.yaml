version: "1.0"
namespace: kickside.mail.example
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta: { title: Example Relay }
  - name: dep.mail
    kind: ns.dependency
    component: kickside/mail
    version: "*"
  - name: dep.settings
    kind: ns.dependency
    component: kickside/settings
    version: "*"
  - name: endpoints
    kind: registry.entry
    endpoints: {}
  - name: api_base_url
    kind: ns.requirement
    meta:
      value_type: string
      comment: Sets the delivery URL and its outbound HTTP grant.
      description: Complete HTTPS URL for the Example Relay email delivery endpoint.
    default: https://delivery.example.invalid/messages
    targets:
      - { entry: "kickside.mail.example:endpoints", path: ".endpoints.api" }
      - { entry: kickside.mail.example.security:http_access, path: ".policy.resources +=" }
  - name: transport
    kind: contract.binding
    contracts:
      - contract: kickside.mail:transport
        methods:
          send: kickside.mail.example.transport:send
          status: kickside.mail.example.transport:status
