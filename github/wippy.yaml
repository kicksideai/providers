organization: kickside
module: github
type: plugin
description: KickSide GitHub — OAuth connection provider with repository issue/PR source and reader/writer/manager agent traits.
license: LicenseRef-KickSide-Community-1.0
repository: https://github.com/kicksideai/providers
homepage: https://wippy.ai
keywords:
  - kickside
  - github
  - oauth
  - connection
  - code
  - issues
exclude_meta:
  type:
    - test
    - test_helper
    - test_support
embed:
  - kickside.github.ui:ui_fs
exclude:
