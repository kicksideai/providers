version: "1.0"
namespace: kickside.github.client

entries:
  - name: types
    kind: library.lua
    meta: { name: types, comment: Shared constants and type surfaces for GitHub. }
    source: file://types.lua
    imports:
      endpoints: kickside.connection:endpoints

  - name: api
    kind: library.lua
    meta: { name: api, comment: Low-level GitHub REST API client. }
    source: file://api.lua
    modules: [http_client, json, time]
    imports:
      capacity_http: kickside.connection:capacity_http
      types: kickside.github.client:types

  - name: transport
    kind: library.lua
    meta: { name: transport, comment: Actor-scoped GitHub connection resolver and API transport. }
    source: file://transport.lua
    imports:
      component: kickside.component:component
      api: kickside.github.client:api
      types: kickside.github.client:types

  - name: output
    kind: library.lua
    meta: { name: output, comment: "GitHub tool output redaction of secret-like keys." }
    source: file://output.lua

  - name: data_error
    kind: library.lua
    meta: { name: data_error, comment: Maps GitHub client results onto kickside.data DataError envelopes. }
    source: file://data_error.lua

    imports:
      capacity_http: kickside.connection:capacity_http
