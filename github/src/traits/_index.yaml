version: "1.0"
namespace: kickside.github.traits

entries:
  - name: reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: GitHub Reader
      public: true
      icon: tabler:brand-github
      comment: Reads GitHub repositories, issues, pull requests, comments, and file contents.
      tags: [github, git, code, issues, pull-requests, read-only]
      web_component: kickside-connection-trait-picker
      provider: github
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: GitHub connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      Use GitHubRead for account, issue and comment reads, and GitHubRepoRead
      for repositories, source, branches, commits, pull requests, reviews and CI.
      Follow the tool's pagination fields. This capability supplies read tools.
      The connection is already selected. Do not ask the user for a connection id.
    tools:
      - kickside.github.traits:read_tool
      - kickside.github.traits:repo_read_tool

  - name: read_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read]
      title: GitHub Read
      tags: [github, git, code, issues, pull-requests, read-only]
      llm_alias: GitHubRead
      llm_description: "Read GitHub. list_issues/list_issue_comments/list_pull_files return compact summary rows with limit/page and next_page. get_repo/get_issue/get_issue_comment/get_pull/get_file return complete records. Use get_file for file content; list_pull_files omits patch bodies."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "comment_id": {"type": "string", "description": "Comment id for get_issue_comment."},
            "action": {
              "type": "string",
              "description": "The read action to perform",
              "enum": ["viewer", "get_repo", "list_issues", "get_issue", "list_issue_comments", "get_pull", "list_pull_files", "get_file", "get_issue_comment"]
            },
            "owner": { "type": "string", "description": "Repository owner or organization" },
            "repo": { "type": "string", "description": "Repository name" },
            "number": { "type": "string", "description": "Issue or pull request number" },
            "path": { "type": "string", "description": "Repository file path for get_file" },
            "ref": { "type": "string", "description": "Branch, tag, or commit SHA for get_file" },
            "state": { "type": "string", "description": "Issue state for list_issues", "enum": ["open", "closed", "all"] },
            "limit": { "type": "integer", "description": "Max rows to return for list actions (default 25, max 100)" },
            "page": { "type": "integer", "description": "GitHub page number for list actions (starts at 1); request page+1 while a page returns limit rows" },
            "since": { "type": "string", "description": "Only list issues updated at or after this ISO timestamp" }
          },
          "required": ["action"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Read GitHub. list_issues/list_issue_comments/list_pull_files return compact summary rows with limit/page and next_page. get_repo/get_issue/get_issue_comment/get_pull/get_file return complete records. Use get_file for file content; list_pull_files omits patch bodies. Provider rejections return {success:false,error,status_code?,data?}; infrastructure failures return (nil, typed error).",
          "properties": {
            "success": {"type": "boolean", "description": "true when the action succeeded; false with error otherwise."},
            "error": {"type": "string", "description": "GitHub's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "error_kind": {"type": "string", "description": "Rejection class: unauthorized, forbidden, not_found, rate_limited, server_error or request_failed."},
            "data": {"description": "GitHub's error body of a rejected request."},
            "issues": {"type": "array", "items": {"type": "object"}},
            "comments": {"type": "array", "items": {"type": "object"}},
            "files": {"type": "array", "items": {"type": "object"}},
            "page": {"type": "integer"},
            "next_page": {"type": "integer"}
          }
        }
    source: file://_fn_read_tool.lua
    method: handler
    modules: [ctx]
    imports:
      transport: kickside.github.client:transport
      output: kickside.github.client:output
      implementation: kickside.github.traits:read_tool_lib

  - name: read_tool_lib
    kind: library.lua
    meta: { name: read_tool_lib, comment: "GitHubRead handler module for tests." }
    source: file://read_tool.lua
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.github.client:transport
      output: kickside.github.client:output

  - name: writer
    kind: registry.entry
    meta:
      type: agent.trait
      title: GitHub Writer
      public: true
      icon: tabler:brand-github
      comment: GitHub issue, branch, file, pull-request, review and workflow mutations.
      tags: [github, git, code, issues, write]
      web_component: kickside-connection-trait-picker
      provider: github
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: GitHub connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      Use GitHubWrite for create_issue, update_issue and create_issue_comment.
      Use GitHubRepoWrite for explicitly requested branch, file, pull-request,
      review, merge and workflow actions. File changes require an explicit branch
      and commit message; updates require the current file SHA. Merges require
      the expected pull-request head SHA. Inspect state with a Reader or Manager
      capability before a change. Never infer permission to merge or run CI.
      The connection is already selected. Do not ask the user for a connection id.
    tools:
      - kickside.github.traits:write_tool
      - kickside.github.traits:repo_write_tool

  - name: manager
    kind: registry.entry
    meta:
      type: agent.trait
      title: GitHub Manager
      public: true
      icon: tabler:brand-github
      comment: GitHub repository and issue read/write access through separate tool surfaces.
      tags: [github, git, code, issues, pull-requests, read-write]
      web_component: kickside-connection-trait-picker
      provider: github
      context_schema:
        type: object
        properties:
          connection_id:
            type: string
            description: GitHub connection component id selected by the trait picker.
        additionalProperties: false
    prompt: |
      Use GitHubRead and GitHubRepoRead to inspect repositories, source, issues,
      pull requests, reviews and CI. Use GitHubWrite for issue mutations, and
      GitHubRepoWrite for explicitly requested repository operations.
      Do not mutate repository files through GitHubWrite; use GitHubRepoWrite
      with an explicit branch, commit message, and current file SHA for updates.
      Merges require the expected pull-request head SHA. Inspect current state
      before changes and never infer permission to merge, approve or run CI.
      The connection is already selected. Do not ask the user for a connection id.
    tools:
      - kickside.github.traits:read_tool
      - kickside.github.traits:write_tool
      - kickside.github.traits:repo_read_tool
      - kickside.github.traits:repo_write_tool

  - name: write_tool
    kind: function.lua
    meta:
      type: tool
      mcp:
        required_scopes: [state.read, state.write]
      title: GitHub Write
      tags: [github, git, code, issues, write]
      llm_alias: GitHubWrite
      llm_description: "Create and update GitHub issues via the configured connection. Actions: create_issue, update_issue, create_issue_comment. Requires owner and repo. Returns the GitHub API payload object with secret-like keys redacted; a rejected request returns { success: false, error, status_code, error_kind, data }."
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "description": "The write action to perform",
              "enum": ["create_issue", "update_issue", "create_issue_comment"]
            },
            "owner": { "type": "string", "description": "Repository owner or organization" },
            "repo": { "type": "string", "description": "Repository name" },
            "number": { "type": "string", "description": "Issue number for update_issue/create_issue_comment" },
            "title": { "type": "string", "description": "Issue title for create_issue or update_issue" },
            "body": { "type": "string", "description": "Issue or comment body" },
            "state": { "type": "string", "description": "Issue state for update_issue", "enum": ["open", "closed"] },
            "labels": { "type": "array", "items": { "type": "string" }, "description": "Labels for create_issue/update_issue" },
            "assignees": { "type": "array", "items": { "type": "string" }, "description": "Assignees for create_issue/update_issue" }
          },
          "required": ["action", "owner", "repo"],
          "additionalProperties": false
        }
      output_schema: |
        {
          "type": "object",
          "description": "Fields below; a rejected GitHub request returns { success: false, error, status_code, error_kind, data, headers }. The GitHub REST API payload for the created or updated issue or comment, with secret-like keys redacted.",
          "properties": {
            "success": {"type": "boolean", "description": "true when the action succeeded; false with error otherwise."},
            "error": {"type": "string", "description": "GitHub's error message when success is false."},
            "status_code": {"type": "integer", "description": "HTTP status of a rejected request."},
            "error_kind": {"type": "string", "description": "Rejection class: unauthorized, forbidden, not_found, rate_limited, server_error or request_failed."},
            "data": {"description": "GitHub's error body of a rejected request."}
          }
        }
    source: file://_fn_write_tool.lua
    method: handler
    modules: [ctx]
    imports:
      transport: kickside.github.client:transport
      output: kickside.github.client:output
      implementation: kickside.github.traits:write_tool_lib

  - name: write_tool_lib
    kind: library.lua
    meta: { name: write_tool_lib, comment: "GitHubWrite handler module for tests." }
    source: file://write_tool.lua
    modules: [ctx]
    imports:
      tool_result: kickside.contract:tool_result
      transport: kickside.github.client:transport
      output: kickside.github.client:output

  - name: repo_read_tool
    kind: function.lua
    source: file://repo_read_tool.lua
    method: handler
    imports:
      repository: kickside.github.repository:service
    meta:
      type: tool
      title: GitHub Repository Read
      llm_alias: GitHubRepoRead
      llm_description: "Read GitHub repositories, source, branches, commits, issues, pull or merge requests, reviews and CI. The connection is configured on the capability. Returns {success,data,next_page?}; inspect success before continuing. "
      mcp:
        required_scopes: [state.read]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "enum": [
                "list_repositories",
                "get_repo",
                "list_pull_requests",
                "get_pull_request",
                "list_pull_files",
                "list_pull_reviews",
                "list_pull_comments",
                "list_branches",
                "get_branch",
                "list_commits",
                "get_commit",
                "get_ref",
                "get_file",
                "get_tree",
                "list_check_runs",
                "get_commit_status",
                "list_workflow_runs",
                "get_workflow_run"
              ]
            },
            "owner": {
              "type": "string"
            },
            "repo": {
              "type": "string"
            },
            "number": {
              "type": "string"
            },
            "ref": {
              "type": "string"
            },
            "path": {
              "type": "string"
            },
            "state": {
              "type": "string"
            },
            "workflow_id": {
              "type": "string"
            },
            "page": {
              "type": "integer",
              "minimum": 1
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            },
            "recursive": {
              "type": "boolean"
            }
          },
          "required": [
            "action"
          ],
          "additionalProperties": false
        }
      output_schema: |
        {"type":"object","properties":{"success":{"type":"boolean"},"data":{},"next_page":{"type":["string","integer"]},"error":{"type":"string"}}}

  - name: repo_write_tool
    kind: function.lua
    source: file://repo_write_tool.lua
    method: handler
    imports:
      repository: kickside.github.repository:service
    meta:
      type: tool
      title: GitHub Repository Write
      llm_alias: GitHubRepoWrite
      llm_description: "Perform explicitly requested GitHub repository mutations using a named action and its typed payload. The connection is configured on the capability. Returns {success,data,next_page?}; inspect success before continuing. For merges supply the expected head SHA where supported. upsert_file takes base64 content and an existing file SHA for updates. create_branch takes refs/heads/<name> and the starting SHA."
      mcp:
        required_scopes: [state.read, state.write]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "enum": [
                "create_branch",
                "upsert_file",
                "delete_file",
                "create_pull_request",
                "update_pull_request",
                "create_pull_review",
                "request_pull_reviewers",
                "merge_pull_request",
                "dispatch_workflow"
              ]
            },
            "owner": {
              "type": "string"
            },
            "repo": {
              "type": "string"
            },
            "number": {
              "type": "string"
            },
            "ref": {
              "type": "string"
            },
            "path": {
              "type": "string"
            },
            "state": {
              "type": "string"
            },
            "workflow_id": {
              "type": "string"
            },
            "page": {
              "type": "integer",
              "minimum": 1
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            },
            "recursive": {
              "type": "boolean"
            },
            "payload": {
              "type": "object",
              "properties": {
                "base": {
                  "type": "string"
                },
                "body": {
                  "type": "string"
                },
                "branch": {
                  "type": "string"
                },
                "comments": {
                  "type": "array",
                  "items": {
                    "type": "object",
                    "properties": {
                      "path": {
                        "type": "string"
                      },
                      "position": {
                        "type": "integer"
                      },
                      "body": {
                        "type": "string"
                      },
                      "line": {
                        "type": "integer"
                      },
                      "side": {
                        "type": "string",
                        "enum": [
                          "LEFT",
                          "RIGHT"
                        ]
                      }
                    },
                    "required": [
                      "path",
                      "body"
                    ],
                    "additionalProperties": false
                  }
                },
                "commit_id": {
                  "type": "string"
                },
                "commit_message": {
                  "type": "string"
                },
                "commit_title": {
                  "type": "string"
                },
                "content": {
                  "type": "string"
                },
                "draft": {
                  "type": "boolean"
                },
                "event": {
                  "type": "string",
                  "enum": [
                    "APPROVE",
                    "REQUEST_CHANGES",
                    "COMMENT"
                  ]
                },
                "head": {
                  "type": "string"
                },
                "inputs": {
                  "type": "object",
                  "additionalProperties": {
                    "type": "string"
                  }
                },
                "maintainer_can_modify": {
                  "type": "boolean"
                },
                "merge_method": {
                  "type": "string"
                },
                "message": {
                  "type": "string"
                },
                "ref": {
                  "type": "string"
                },
                "reviewers": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "sha": {
                  "type": "string"
                },
                "state": {
                  "type": "string"
                },
                "team_reviewers": {
                  "type": "array",
                  "items": {
                    "type": "string"
                  }
                },
                "title": {
                  "type": "string"
                }
              },
              "additionalProperties": false
            }
          },
          "required": [
            "action"
          ],
          "additionalProperties": false,
          "oneOf": [
            {
              "properties": {
                "action": {
                  "const": "create_branch"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "ref": {
                      "type": "string"
                    },
                    "sha": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "ref",
                    "sha"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "upsert_file"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    },
                    "content": {
                      "type": "string"
                    },
                    "sha": {
                      "type": "string"
                    },
                    "branch": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "message",
                    "content",
                    "branch"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "delete_file"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "message": {
                      "type": "string"
                    },
                    "sha": {
                      "type": "string"
                    },
                    "branch": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "message",
                    "sha",
                    "branch"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "create_pull_request"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "title": {
                      "type": "string"
                    },
                    "head": {
                      "type": "string"
                    },
                    "base": {
                      "type": "string"
                    },
                    "body": {
                      "type": "string"
                    },
                    "draft": {
                      "type": "boolean"
                    },
                    "maintainer_can_modify": {
                      "type": "boolean"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "title",
                    "head",
                    "base"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "update_pull_request"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "title": {
                      "type": "string"
                    },
                    "body": {
                      "type": "string"
                    },
                    "state": {
                      "type": "string"
                    },
                    "base": {
                      "type": "string"
                    },
                    "maintainer_can_modify": {
                      "type": "boolean"
                    }
                  },
                  "additionalProperties": false
                }
              }
            },
            {
              "properties": {
                "action": {
                  "const": "create_pull_review"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "commit_id": {
                      "type": "string"
                    },
                    "body": {
                      "type": "string"
                    },
                    "event": {
                      "type": "string",
                      "enum": [
                        "APPROVE",
                        "REQUEST_CHANGES",
                        "COMMENT"
                      ]
                    },
                    "comments": {
                      "type": "array",
                      "items": {
                        "type": "object",
                        "properties": {
                          "path": {
                            "type": "string"
                          },
                          "position": {
                            "type": "integer"
                          },
                          "body": {
                            "type": "string"
                          },
                          "line": {
                            "type": "integer"
                          },
                          "side": {
                            "type": "string",
                            "enum": [
                              "LEFT",
                              "RIGHT"
                            ]
                          }
                        },
                        "required": [
                          "path",
                          "body"
                        ],
                        "additionalProperties": false
                      }
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "event"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "request_pull_reviewers"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "reviewers": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    },
                    "team_reviewers": {
                      "type": "array",
                      "items": {
                        "type": "string"
                      }
                    }
                  },
                  "additionalProperties": false
                }
              }
            },
            {
              "properties": {
                "action": {
                  "const": "merge_pull_request"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "sha": {
                      "type": "string"
                    },
                    "commit_title": {
                      "type": "string"
                    },
                    "commit_message": {
                      "type": "string"
                    },
                    "merge_method": {
                      "type": "string"
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "sha"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            },
            {
              "properties": {
                "action": {
                  "const": "dispatch_workflow"
                },
                "payload": {
                  "type": "object",
                  "properties": {
                    "ref": {
                      "type": "string"
                    },
                    "inputs": {
                      "type": "object",
                      "additionalProperties": {
                        "type": "string"
                      }
                    }
                  },
                  "additionalProperties": false,
                  "required": [
                    "ref"
                  ]
                }
              },
              "required": [
                "payload"
              ]
            }
          ]
        }
      output_schema: |
        {"type":"object","properties":{"success":{"type":"boolean"},"data":{},"next_page":{"type":["string","integer"]},"error":{"type":"string"}}}
