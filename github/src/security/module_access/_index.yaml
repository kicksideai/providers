version: '1.0'
namespace: kickside.github.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Github
    surface: kickside.github
    intent: module_access
    includes:
    - kickside.github.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.github:*
    - kickside.github.repository:*
    - kickside.github.client:*
    - kickside.github.connection:*
    - kickside.github.security:*
    - kickside.github.source:*
    - kickside.github.traits:*
    - kickside.github.ui:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.github:*
    - kickside.github.repository:*
    - kickside.github.client:*
    - kickside.github.connection:*
    - kickside.github.security:*
    - kickside.github.source:*
    - kickside.github.traits:*
    - kickside.github.ui:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
