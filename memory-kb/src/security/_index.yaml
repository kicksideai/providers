version: '1.0'
namespace: kickside.memory_kb.security

# Module access for Memory. The public policy composes discovery of the module
# with its private runtime policy and the exact member endpoints; the host binds
# user_security_scope to the group whose members use the memory surface.
# Component ACL decides access to each memory knowledge base.

entries:
- name: module_access
  kind: security.policy
  meta:
    title: Memory
    surface: kickside.memory_kb
    intent: module_access
    includes:
    - kickside.memory_kb.security:module_runtime
    - kickside.memory_kb.security:endpoint_access
  groups: []
  policy:
    resources:
    - kickside.memory_kb:*
    - kickside.memory_kb.agent:*
    - kickside.memory_kb.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow

- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.memory_kb:*
    - kickside.memory_kb.agent:*
    - kickside.memory_kb.security:*
    - kickside.memory_kb.engine:*
    - kickside.memory_kb.persist:*
    - kickside.memory_kb.api:*
    - kickside.memory_kb.events:*
    - kickside.memory_kb.migrations:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow

- name: endpoint_access
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.memory_kb.api:list_memories.endpoint
    - kickside.memory_kb.api:list_topics.endpoint
    - kickside.memory_kb.api:list_items.endpoint
    - kickside.memory_kb.api:get_item.endpoint
    - kickside.memory_kb.api:create_item.endpoint
    - kickside.memory_kb.api:edit_item.endpoint
    - kickside.memory_kb.api:forget_item.endpoint
    - kickside.memory_kb.api:archive_item.endpoint
    - kickside.memory_kb.api:restore_item.endpoint
    - kickside.memory_kb.api:list_conflicts.endpoint
    - kickside.memory_kb.api:resolve_conflict.endpoint
    - kickside.memory_kb.api:status.endpoint
    actions: access
    effect: allow

# The deferred workers re-admit the identity their run records hold.
- name: deferred_owner
  kind: security.policy
  meta:
    private: true
  policy:
    resources:
    - kickside.memory_kb.engine:derive_worker
    - kickside.memory_kb.engine:consolidate_worker
    - kickside.memory_kb.engine:reembed_worker
    actions: kickside.execution.defer
    effect: allow

- name: user_security_scope
  kind: ns.requirement
  default: kickside.security.groups:members
  meta:
    value_kind: security.scope
    description: Application security group allowed to use the memory HTTP endpoints.
  targets:
  - entry: kickside.memory_kb.security:endpoint_access
    path: .groups +=
