version: "1.0"
namespace: kickside.discord.connection

entries:
  - name: discord_connection
    kind: contract.binding
    meta:
      title: Discord
      comment: Connect a Discord bot token to discover guilds/channels and send replies.
      icon: tabler:brand-discord
      provider: discord
      group: Messaging
      tags: [discord, messaging, bot, dm, reply_provider]
      class:
        - connection
        - reply_provider
      # Static reply capabilities (replaces the get_capabilities contract method):
      # declarative metadata the shared reply_sender reads to chunk, and future
      # consumers read to gate features. max_length is Discord's hard message cap.
      reply:
        max_length: 2000
        content_types: [text/plain, text/markdown]
        attachments: false
        embeds: false
      projections:
        - kind: discord.gateway.lifecycle
          on: lifecycle
          worker_ref: func://kickside.discord.gateway:lifecycle_reconcile
          events:
            input:
              - type: kickside.component.events:created
              - type: kickside.component.events:updated
              - type: kickside.component.events:deleted
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: bot_token
            label: Bot token
            type: password
            required: true
            placeholder: Discord bot token
            help: Create a bot in the Discord Developer Portal and use its bot token. The agent, model and actor are chosen per channel when you add a responder automation, not here.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.discord.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.discord.connection:get_status
          test_connection: kickside.discord.connection:test_connection
          discover_resources: kickside.discord.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.discord.connection:delete
      - contract: kickside.connection:reply_provider
        context_required:
          - component_id
        methods:
          send_reply: kickside.discord.connection:send_reply
          update_reply: kickside.discord.connection:update_reply
          send_status: kickside.discord.connection:send_status
  - name: get_status
    kind: function.lua
    meta: { comment: "discord connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: test_connection
    kind: function.lua
    meta: { comment: "discord connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: discover_resources
    kind: function.lua
    meta: { comment: "discord connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: send_reply
    kind: function.lua
    meta: { comment: "discord reply_provider - send_reply" }
    source: file://send_reply.lua
    method: send_reply
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: update_reply
    kind: function.lua
    meta: { comment: "discord reply_provider - update_reply" }
    source: file://update_reply.lua
    method: update_reply
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: send_status
    kind: function.lua
    meta: { comment: "discord reply_provider - send_status" }
    source: file://send_status.lua
    method: send_status
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  - name: delete
    kind: function.lua
    meta: { comment: "discord connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      implementation: kickside.discord.connection:connection_lib

  # The shared implementation exposed as a library so the flow's pure shaping /
  # validation can be unit-tested as one module.
  - name: connection_lib
    kind: library.lua
    meta: { name: connection_lib, comment: "discord connection - shared implementation (for tests)" }
    source: file://connection.lua
    imports:
      preconditions: kickside.discord.client:preconditions
      transport: kickside.discord.client:transport
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
