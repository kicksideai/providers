version: "1.0"
namespace: app.suites

# Unit suites for kickside/discord. They live in the harness because the module
# is loaded through a workspace replacement, which applies the module's
# exclude_meta and drops meta.type=test entries from its own tree.

entries:
  - name: hub_fixture
    kind: library.lua
    source: file://hub_fixture.lua
    modules: [process]
  - name: hub_health_fixture
    kind: library.lua
    source: file://hub_fixture.lua
    modules: [process]
  - name: hub_notifier_fixture
    kind: library.lua
    source: file://hub_fixture.lua
    modules: [process]
  - name: hub_process_fixture
    kind: library.lua
    source: file://hub_process_fixture.lua
    modules: [process]
  - name: hub_worker_fixture
    kind: process.lua
    source: file://hub_worker_fixture.lua
    method: main
    modules: [process]
  - name: hub_supervisor
    kind: process.lua
    source: file://src_link/gateway/hub.lua
    method: main
    modules: [channel, logger, env, time, registry]
    imports:
      process: app.suites:hub_process_fixture
      connection: kickside.connection:base_connection
      component: app.suites:hub_fixture
      health: app.suites:hub_health_fixture
      notifier: app.suites:hub_notifier_fixture
  - name: hub_supervision_test
    kind: function.lua
    meta: { type: test, suite: discord }
    source: file://hub_supervision_test.lua
    method: run
    modules: [process, channel, time]
    imports:
      test: wippy.test:test
      fixture: app.suites:hub_fixture
  - name: lifecycle_process_fixture
    kind: library.lua
    source: file://lifecycle_process_fixture.lua
  - name: lifecycle_observer_under_test
    kind: library.lua
    source: file://src_link/gateway/lifecycle_reconcile.lua
    imports:
      process: app.suites:lifecycle_process_fixture
      connection: kickside.connection:base_connection
      consts: kickside.discord.gateway:consts
  - name: lifecycle_names
    kind: library.lua
    source: file://lifecycle_names.lua
  - name: lifecycle_observer_real
    kind: library.lua
    source: file://src_link/gateway/lifecycle_reconcile.lua
    modules: [process]
    imports:
      connection: kickside.connection:base_connection
      consts: app.suites:lifecycle_names
  - name: lifecycle_registry_test
    kind: function.lua
    meta: { type: test, suite: discord }
    source: file://lifecycle_registry_test.lua
    method: run
    modules: [process, channel, time]
    imports:
      test: wippy.test:test
      observer: app.suites:lifecycle_observer_real
      names: app.suites:lifecycle_names
  - name: lifecycle_reconcile_test
    kind: function.lua
    meta: { type: test, suite: discord }
    source: file://lifecycle_reconcile_test.lua
    method: run
    imports:
      test: wippy.test:test
      observer: app.suites:lifecycle_observer_under_test
      fixture: app.suites:lifecycle_process_fixture
  - name: reply_transport_state
    kind: library.lua
    source: file://reply_transport_state.lua
  - name: reply_transport_api
    kind: library.lua
    source: file://reply_transport_api.lua
    modules: [sql]
    imports:
      state: app.suites:reply_transport_state
  - name: reply_transport_under_test
    kind: library.lua
    source: file://src_link/client/transport.lua
    modules: [security]
    imports:
      preconditions: kickside.discord.client:preconditions
      component: kickside.component:component
      api: app.suites:reply_transport_api
      types: kickside.discord.client:types
      base: kickside.connection:base_connection
      reply_authorization: kickside.connection:reply_authorization
  - name: connection_under_test
    kind: library.lua
    source: file://src_link/connection/connection.lua
    imports:
      preconditions: kickside.discord.client:preconditions
      base: kickside.connection:base_connection
      transport: app.suites:reply_transport_under_test
      types: kickside.discord.client:types
  - name: transport_probe
    kind: contract.definition
    methods:
      - name: run
  - name: transport_probe_func
    kind: function.lua
    source: file://reply_transport_probe.lua
    method: run
    imports:
      connection: app.suites:connection_under_test
  - name: transport_probe_binding
    kind: contract.binding
    contracts:
      - contract: app.suites:transport_probe
        context_required: [component_id]
        methods:
          run: app.suites:transport_probe_func
  - name: transport_access_test
    kind: function.lua
    meta: { type: test, suite: discord }
    source: file://transport_access_test.lua
    method: run
    modules: [contract, sql, json, uuid, security]
    imports:
      test: wippy.test:test
      state: app.suites:reply_transport_state
      persist: kickside.channel.persist:repo
  - name: api_test
    kind: function.lua
    meta:
      type: test
      suite: discord
    source: file://api_test.lua
    method: run
    imports:
      test: wippy.test:test
      api: kickside.discord.client:api

  - name: data_error_test
    kind: function.lua
    meta:
