version: "1.0"
namespace: app

# Application-owned harness for the reusable provider. Production exposes only
# requirements; this test root chooses concrete routers, storage, process hosts, and
# security scopes through one dependency edge.

entries:
  - name: dep.kickside.security
    kind: ns.dependency
    version: '*'
    component: kickside/security
    parameters:
      - {name: api_router, value: app:api}
      - {name: ui_server, value: app:gateway}
      - {name: target_db, value: app:db}
      - {name: process_host, value: app:processes}

  - name: db
    kind: db.sql.sqlite
    foreign_keys: true
    meta: { comment: "In-memory database for provider transitive dependencies." }
    file: ":memory:"

  - name: gateway
    kind: http.service
    meta: { comment: "Test HTTP server." }
    addr: :19131
    lifecycle: { auto_start: true }

  - name: api
    kind: http.router
    meta: { comment: "Authenticated test API router.", server: gateway }
    prefix: /api

  - name: api_public
    kind: http.router
    meta: { comment: "Separate views router.", server: gateway }
    prefix: /public

  - name: processes
    kind: process.host
    meta: { comment: "Test process host." }
    lifecycle: { auto_start: true }

  - name: env_storage
    kind: env.storage.file
    meta: { type: envstorage }
    file_path: ./.wippy/test.env
    auto_create: true

  - name: user
    kind: security.policy
    meta: { comment: "Permissive named scope for provider suites." }
    groups: [code_execution_test]
    policy:
      resources: '*'
      actions: '*'
      effect: allow

  - name: admin
    kind: security.policy
    groups: [code_execution_test_admin]
    policy: { resources: '*', actions: '*', effect: allow }

  - name: dep.kickside.users
    kind: ns.dependency
    component: kickside/users
    version: "*"
    parameters:
      - { name: kickside.users:public_router, value: app:api_public }
      - { name: kickside.users:api_router, value: app:api }
      - { name: kickside.users:target_db, value: app:db }
      - { name: kickside.users:user_security_scope, value: app:user }
      - { name: kickside.users:admin_security_scope, value: app:admin }
      - { name: kickside.users:login_role_resource, value: 'app:*' }
      - { name: kickside.users:ui_server, value: app:gateway }

  - name: dep.kickside.code_execution
    kind: ns.dependency
    component: kickside/code-execution
    version: '*'
    parameters:
    - name: kickside.settings:target_db
      value: app:db
    - name: kickside.settings:api_router
      value: app:api
    - name: kickside.settings:ui_server
      value: app:gateway
    - name: kickside.code_execution:api_router
      value: app:api
    - name: kickside.code_execution:ui_server
      value: app:gateway
    - name: kickside.code_execution.security:user_security_scope
      value: app:user
    - name: userspace.dataflow:target_db
      value: app:db
    - name: userspace.dataflow:user_security_scope
      value: app:user
    - name: wippy.bootloader:application_host
      value: app:processes
    - name: wippy.bootloader:env_storage
      value: app:env_storage
    - name: wippy.llm:process_host
      value: app:processes
    - name: wippy.llm:env_storage
      value: app:env_storage
    - name: wippy.migration:app_db
      value: app:db
    - name: wippy.relay:user_security_scope
      value: app:user
    - name: wippy.relay:env_storage
      value: app:env_storage
    - name: wippy.relay:application_host
      value: app:processes
    - name: wippy.session:api_router
      value: app:api
    - name: wippy.session:database_resource
      value: app:db
    - name: wippy.session:default_host
      value: app:processes
    - name: wippy.session:env_storage
      value: app:env_storage
    - name: wippy.session:delegation_func_id
      value: userspace.dataflow.session:delegate
    - name: wippy.views:api_router
      value: app:api_public
    - name: wippy.views:env_storage
      value: app:env_storage

  - name: dep.kickside.blocks
    kind: ns.dependency
    component: kickside/blocks
    version: '*'
    meta:
      comment: Test-only canonical Block validator and lowerer; not a production Code Execution dependency.
    parameters:
    - name: kickside.blocks:process_host
      value: app:processes
    - name: kickside.component:target_db
      value: app:db
    - name: kickside.component:api_router
      value: app:api
    - name: kickside.component:lifecycle_impl
      value: kickside.core.lifecycle:component_lifecycle_impl
    - name: kickside.core:target_db
      value: app:db
    - name: kickside.core.jobs:target_db
      value: app:db
    - name: kickside.core.lifecycle:process_host
      value: app:processes
    - name: kickside.core.lifecycle:user_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 2
    - name: kickside.core.lifecycle:admin_lifecycle_grant
      value:
        subject_id: app:user
        subject_type: group
        access_mask: 3
    - name: kickside.core.retention:process_host
      value: app:processes
    - name: kickside.core.threads:process_host
      value: app:processes
    - name: kickside.core.projections:process_host
      value: app:processes
    - name: kickside.core.jobs:process_host
      value: app:processes
    - name: kickside.core.scheduler:process_host
      value: app:processes
    - name: kickside.core.retention:api_router
      value: app:api
    - name: kickside.core.threads:api_router
      value: app:api
    - name: kickside.core.threads.hydration:api_router
      value: app:api
    - name: kickside.core.projections:api_router
      value: app:api
    - name: kickside.core.retention:env_storage
      value: app:env_storage
    - name: kickside.core.projections:env_storage
      value: app:env_storage
    - name: kickside.core.retention:user_security_scope
      value: app:user
    - name: kickside.core.threads:user_security_scope
      value: app:user
    - name: kickside.core.threads.hydration:user_security_scope
      value: app:user

  - name: dep.kickside.widgets
    kind: ns.dependency
    component: kickside/widgets
    version: "*"
    meta:
      comment: Test-host wiring for the canonical picker dependency used by Code Execution.
    parameters:
      - { name: kickside.widgets:api_router, value: app:api }
      - { name: kickside.widgets:ui_server, value: app:gateway }

  - name: dep.wippy.test
    kind: ns.dependency
    component: wippy/test
    version: "*"

  # Broad scope for the suite actor. eval.* is deliberately absent; run_code adds its
  # narrowly attached eval policy while preserving this ambient actor.
  - name: code_execution_suite_policy
    kind: security.policy
    meta: { comment: "Provider suite scope without ambient eval authority." }
    policy:
      resources: '*'
      actions: [funcs.call, funcs.security, registry.get, registry.find]
      effect: allow

  - name: stub_echo_tool
    kind: function.lua
    meta:
      type: tool
      title: Echo
      input_schema: |
        {"type":"object","properties":{"message":{"type":"string"}},"required":["message"],"additionalProperties":false}
      output_schema: |
        {"type":"object","properties":{"echoed":{"type":"object"},"actor_id":{"type":"string"}},"required":["actor_id"]}
    source: file://stub_tools.lua
    method: echo
    modules: [security]

  - name: stub_filter_tool
    kind: function.lua
    meta:
      type: tool
      llm_alias: FilterFixture
      input_schema: |
        {"type":"object","properties":{"filters":{"type":"array","items":{"type":"object","properties":{"value":{}}}}},"additionalProperties":false}
    source: file://stub_tools.lua
    method: echo
    modules: [security]

  - name: stub_empty_object_tool
    kind: function.lua
    meta:
      type: tool
      title: Empty object
      input_schema: '{"type":"object","properties":{},"additionalProperties":false}'
    source: file://stub_tools.lua
    method: secret
    modules: [security]

  - name: stub_secret_tool
    kind: function.lua
    meta: { type: tool, title: Secret }
    source: file://stub_tools.lua
    method: secret
    modules: [security]

  # Harness-owned suite declarations keep test entries out of the publishable provider
  # while exercising the replacement's real libraries/functions.
  - name: code_execution_test
    kind: function.lua
    meta: { type: test, suite: code_execution }
    source: file://suites/run_code_test.lua
    method: run
    modules: [funcs, security, json, registry, time]
    imports:
      test: wippy.test:test
      sdk: kickside.code_execution:sdk
      sdk_sim: kickside.code_execution:sdk_sim

  - name: code_execution_generator_test
    kind: function.lua
    meta: { type: test, suite: code_execution_generator }
    source: file://suites/generate_code_test.lua
    method: run
    modules: [funcs, security, json]
    imports:
      test: wippy.test:test
      generator: kickside.code_execution:generator
      gen_flow: kickside.code_execution:generate_code

  - name: code_execution_generator_node_test
    kind: function.lua
    meta: { type: test, suite: code_execution_generator_node }
    source: file://suites/gen_node_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      gen_node: kickside.code_execution:node_generate_lib

  - name: assist_api_fixture
    kind: library.lua
    source: file://assist_api_fixture.lua

  - name: assist_api_http
    kind: library.lua
    source: file://assist_api_http.lua
    imports: { fixture: app:assist_api_fixture }

  - name: assist_api_security
    kind: library.lua
    source: file://assist_api_security.lua
    imports: { fixture: app:assist_api_fixture }

  - name: assist_api_funcs
    kind: library.lua
    source: file://assist_api_funcs.lua
    imports: { fixture: app:assist_api_fixture }

  # Load the production endpoint source unchanged, with aliases that capture
  # its HTTP-to-generator boundary in the native harness.
  - name: assist_under_test
    kind: library.lua
    source: file://assist_under_test.lua
    modules: [json]
    imports:
      http: app:assist_api_http
      security: app:assist_api_security
      funcs: app:assist_api_funcs

  - name: code_execution_assist_api_test
    kind: function.lua
    meta: { type: test, suite: code_execution_assist_api }
    source: file://suites/assist_api_test.lua
    method: run
    modules: [json]
    imports:
      test: wippy.test:test
      assist: app:assist_under_test
      fixture: app:assist_api_fixture

  - name: code_execution_recommend_test
    kind: function.lua
    meta: { type: test, suite: code_execution_recommend }
    source: file://suites/recommend_tools_test.lua
    method: run
    modules: [funcs, security, json]
    imports:
      test: wippy.test:test
      recommender: app:recommend_under_test
      model_fixture: app:recommend_model_fixture

  - name: code_execution_sdk_reference_test
    kind: function.lua
    meta: { type: test, suite: code_execution_sdk_reference }
    source: file://suites/sdk_reference_test.lua
    method: run
    imports:
      test: wippy.test:test
      surface: kickside.code_execution:surface

  - name: code_execution_trait_test
    kind: function.lua
    meta: { type: test, suite: code_execution_trait }
    source: file://suites/code_execution_trait_test.lua
    method: run
    modules: [funcs, security, json]
    imports: { test: wippy.test:test }

  - name: code_execution_block_ownership_test
    kind: function.lua
    meta: { type: test, suite: code_execution_blocks }
    source: file://suites/block_ownership_test.lua
    method: run
    modules: [funcs, security, registry]
    imports:
      test: wippy.test:test
      blocks: kickside.blocks:blocks
      lower: kickside.blocks:lower

  - name: code_execution_packaging_test
    kind: function.lua
    meta:
      type: test
      suite: code_execution_packaging
      comment: Every code-execution HTTP endpoint is routed through the host api_router requirement; runtime packages stay unpinned.
    source: file://suites/packaging_test.lua
    method: run
    modules: [registry, security]
    imports: { test: wippy.test:test }

  - name: user_endpoint_policy_test
    kind: function.lua
    meta:
      type: test
      suite: member_endpoint_policy
    source: file://user_endpoint_policy_test.lua
    method: run
    modules:
    - registry
    - security
    imports:
      test: wippy.test:test

  - name: dep.member_endpoint_contract
    kind: ns.dependency
    component: kickside/contract
    version: '*'
    parameters:
    - name: kickside.contract.http:user_security_scope
      value: app:user

  - name: recommend_model_fixture
    kind: library.lua
    source: file://recommend_model_fixture.lua
  - name: recommend_under_test
    kind: library.lua
    source: file://recommend_source.lua
    imports:
      llm: app:recommend_model_fixture
      prompt: wippy.llm:prompt
      surface: kickside.code_execution:surface
