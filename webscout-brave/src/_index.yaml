version: "1.0"
namespace: kickside.webscout.providers.brave

# Brave search provider — a self-contained submodule, shaped after
# kickside/sso-google. It owns its provider descriptor, its API key in its own
# namespace, and the Brave Research Source. WebScout carries no Brave code.
entries:
  - name: definition
    kind: ns.definition
    readme: file://README.md
    meta:
      title: KickSide WebScout — Brave
      comment: Brave search provider for WebScout — trait search plus the typed Research Source.

  - name: dep.kickside.webscout
    version: '>=0.1.32'
    kind: ns.dependency
    meta:
      comment: Supplies the provider protocol, the HTTP client and the transport defaults.
    component: kickside/webscout

  - name: dep.kickside.settings
    version: '*'
    kind: ns.dependency
    meta:
      comment: Supplies this provider's own credential setting.
    component: kickside/settings

  # ─── This provider's own credential, in its own namespace ───
  - name: setting_api_key
    kind: registry.entry
    meta:
      type: kickside.settings:definition
      comment: Brave Search API subscription token (encrypted setting).
    namespace: kickside.webscout.providers.brave
    key: api_key
    value_type: secret
    default: ""
    description: Brave Search API subscription token for web and news discovery.
    scope: global
    editable: true

  # ─── Where a person finds that key ───
  # Without this record the settings page invents a section for the namespace:
  # kickside/settings humanizes `kickside.webscout.providers.brave` into
  # "Webscout Providers Brave" and, because an auto-section declares no group,
  # sorts it after every grouped one. The key would then sit at the bottom of
  # the menu under the module's internal address, while the person looking for
  # it reads the integrations next to WebScout. The title is held to the nav
  # column's 160px of label -- about 20-22 characters at 13px.
  - name: settings_block
    kind: registry.entry
    meta:
      type: kickside.settings:block
      comment: Brave Search settings section for the admin Settings page.
    key: brave_search
    title: Brave Search
    icon: simple-icons:brave
    group: Integrations
    order: 20
    namespace: kickside.webscout.providers.brave
    config:
      namespace: kickside.webscout.providers.brave
      title: Brave Search
      icon: simple-icons:brave
      help: Brave Search API subscription token. WebScout uses it once Brave is the selected search provider.

  # ─── Search provider protocol ───
  - name: provider
    kind: registry.entry
    meta:
      type: kickside.webscout:search_provider
      comment: Brave search provider descriptor.
    id: brave
    label: Brave
    icon: simple-icons:brave
    description: Brave Search over an independent web index.
    search_func: kickside.webscout.providers.brave:search
    # The Research Source asks the same question of the same key, so one gate
    # answers both its availability_ref and this descriptor.
    available_func: kickside.webscout.providers.brave:available
    settings_ns: kickside.webscout.providers.brave
    max_results: 20
    order: 20

  - name: search
    kind: function.lua
    meta:
      comment: Run one Brave web search query and normalize the results.
    source: file://search.lua
    modules:
      - json
      - http_client
    imports:
      client: kickside.webscout.client:client
      config: kickside.webscout:config
    method: search

  # ─── Typed Research Source, moved from kickside.webscout.research ───
  # The records themselves are unchanged: only the namespace and the references
  # between them follow the move. control_bounds.policy_ref and its digest are
  # deliberately left as they were — the digest seals the policy identity, and
  # re-pointing it would invalidate receipts already issued under it.
  - name: available
    kind: function.lua
    meta: { comment: Report whether Brave-backed discovery is configured. }
    source: file://available.lua
    method: available
    imports:
      config: kickside.webscout:config

  - name: source_core
    kind: library.lua
    meta: { comment: Normalize independent Brave web and news discovery results. }
    source: file://source.lua
    modules: [http_client, json]
    imports:
      config: kickside.webscout:config
      operation_policy: kickside.webscout.research:operation_policy

  - name: run
    kind: function.lua
    meta: { comment: Execute one Brave Research Source operation under the ambient actor. }
    source: file://source.lua
    method: run
    modules: [http_client, json]
    imports:
      config: kickside.webscout:config
      operation_policy: kickside.webscout.research:operation_policy

  - name: block.source
    kind: registry.entry
    meta:
      type: kickside.block
      public: false
      title: Brave Research Source
      description: Discover public web and news results through Brave's independent indexes.
    data:
      block:
        api_version: kickside.block/v1
        input:
          type: object
          additionalProperties: false
          required: [case_id, idempotency_key, operation, capability, subject, input, limits]
          properties:
            case_id: { type: string, minLength: 1, maxLength: 256 }
            idempotency_key: { type: string, minLength: 1, maxLength: 256 }
            operation: { type: string, enum: [company_discovery, prospect_context, person_context, product_proof, relationship_context, company_news] }
            capability: { type: string, minLength: 1, maxLength: 256 }
            subject:
              type: object
              additionalProperties: false
              required: [kind, ref]
              properties:
                kind: { type: string, minLength: 1 }
                ref: { type: string, minLength: 1 }
            input:
              type: object
              additionalProperties: false
              properties:
                query: { type: string, minLength: 1, maxLength: 2000 }
                user_agent: { type: string, minLength: 1 }
                freshness: { type: string, minLength: 1 }
                safe_search: { type: string, minLength: 1 }
            limits:
              type: object
              additionalProperties: false
              properties:
                max_results: { type: integer, minimum: 1 }
                timeout_seconds: { type: integer, minimum: 1 }
        config:
          type: object
          additionalProperties: false
          required: [control_bounds, operation_policy]
          properties:
            control_bounds: { type: object, additionalProperties: true }
            operation_policy: { type: object, additionalProperties: true }
            operation_policies: { type: object, additionalProperties: true }
        output:
          type: object
          additionalProperties: false
          required: [source_id, operation, artifacts]
          properties:
            source_id: { type: string, const: "kickside.webscout.providers.brave:source" }
            operation: { type: string }
            retrieval:
              type: object
              additionalProperties: false
              required: [transport, status, outcome_code, escalatable]
              properties:
                transport: { type: string, const: brave }
                status: { type: string, const: succeeded }
                outcome_code: { type: string, const: static_content }
                escalatable: { type: boolean, const: false }
            artifacts:
              type: array
              minItems: 1
              items: &brave_artifact
                type: object
                additionalProperties: false
                required: [source_artifact_key, canonical_uri, title, media_type, content, subject_refs, ordinal]
                properties:
                  source_artifact_key: { type: string, minLength: 1, maxLength: 8200 }
                  canonical_uri: { type: string, pattern: "^https?://", maxLength: 8192 }
                  title: { type: string, minLength: 1, maxLength: 512 }
                  media_type: { type: string, const: application/vnd.kickside.brave-search-result+json }
                  published_at: { type: string, maxLength: 256 }
                  content:
                    type: object
                    additionalProperties: false
                    required: [query, snippet, display_domain, provider, result_kind]
                    properties:
                      query: { type: string, maxLength: 2000 }
                      snippet: { type: string, maxLength: 4000 }
                      display_domain: { type: string, maxLength: 512 }
                      provider: { type: string, const: brave }
                      result_kind: { type: string, enum: [web, news] }
                  subject_refs:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [kind, ref]
                      properties:
                        kind: { type: string, minLength: 1 }
                        ref: { type: string, minLength: 1 }
                  ordinal: { type: integer, minimum: 1 }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string, minLength: 1 }
            message: { type: string, minLength: 1 }
        ports:
          - { id: result, label: Discovery, direction: out }
          - { id: failed, label: Failed, direction: out }
        presentation:
          category: Research Sources
          icon: simple-icons:brave
          blurb: Search independent web and news indexes, then capture authoritative pages.
        execution:
          kind: function
          function_id: kickside.webscout.providers.brave:run

  - name: source
    kind: registry.entry
    meta:
      type: kickside.research.source
      title: Brave web and news
      description: Independent web and news discovery; results are leads for subsequent authoritative page capture.
      icon: simple-icons:brave
    data:
      block_ref: kickside.webscout.providers.brave:block.source
      availability_ref: kickside.webscout.providers.brave:available
      config_schema:
        type: object
        additionalProperties: false
        required: [control_bounds, operation_policies]
        properties:
          control_bounds: { type: object, additionalProperties: true }
          operation_policies: { type: object, additionalProperties: true }
      operations:
        - id: company_discovery
          capability: market.company.discovery
          strategy_stage: standard
          control_bounds: &brave_bounds
            version: SourceOperationControlBounds/v1
            # Not a registry address and never resolved as one: policy_ref is the
            # policy's own identity, and it is sealed into the digest below. It
            # keeps its pre-move spelling on purpose, so receipts already issued
            # under this policy still verify. Google's source-control is the same
            # kind of label. Changing it means recomputing the digest.
            policy_ref: kickside.webscout.research:brave-control
            revision: webscout-brave-v1
            digest: 87e48e2270b0d06ea96286d2aa3b4ebf4703a03a7400f2d400253fa22313a0c5
            limits:
              max_results: { minimum: 1, maximum: 100 }
              timeout_seconds: { minimum: 1, maximum: 600 }
            catalog:
              page_size: { minimum: 1, maximum: 100 }
              max_provider_calls: { minimum: 1, maximum: 10 }
              max_provider_pages: { minimum: 1, maximum: 10 }
            lifecycle:
              stale_after_seconds: { minimum: 1, maximum: 2592000 }
            storage:
              limit_chars: { minimum: 1, maximum: 200000 }
              retention:
                class: source_specific
                max_age_seconds: { minimum: 1, maximum: 2592000 }
            controls:
              response_body_bytes: { minimum: 1, maximum: 2000000 }
            search:
              freshness: [day, week, month, year]
              safe_search: [off, moderate, strict]
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Discover company candidates through a short product or market query; capture authoritative pages before relying on claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
        - id: prospect_context
          capability: prospect.current_context
          strategy_stage: standard
          control_bounds: *brave_bounds
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Search current company context; capture authoritative result pages before relying on claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
        - id: person_context
          capability: person.current_context
          strategy_stage: standard
          control_bounds: *brave_bounds
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Search a person with company or role context; capture authoritative pages before relying on claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
        - id: product_proof
          capability: product.relevant_proof
          strategy_stage: standard
          control_bounds: *brave_bounds
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Search seller product proof; capture first-party pages before relying on claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
        - id: relationship_context
          capability: relationship.external_context
          strategy_stage: standard
          control_bounds: *brave_bounds
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Search public relationship and event context; capture authoritative pages before relying on claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
        - id: company_news
          capability: company.news.discovery
          strategy_stage: standard
          control_bounds: *brave_bounds
          effect: read_only
          access_profile: { id: brave_search, decision: allowed }
          description: Search the dedicated news index for an exact company identity; capture the article before relying on consequential claims.
          allowed_subject_fields: [kind, ref]
          input_schema: { type: object, additionalProperties: false, required: [query, user_agent, freshness, safe_search], properties: { query: { type: string, minLength: 1, maxLength: 2000 }, user_agent: { type: string, minLength: 1 }, freshness: { type: string, minLength: 1 }, safe_search: { type: string, minLength: 1 } } }
          artifact_schema: *brave_artifact
