version: '1.0'
namespace: kickside.webscout.providers.brave.security
entries:
- name: module_access
  kind: security.policy
  meta:
    title: Webscout Brave
    surface: kickside.webscout.providers.brave
    intent: module_access
    includes:
    - kickside.webscout.providers.brave.security:module_runtime
  groups: []
  policy:
    resources:
    - kickside.webscout.providers.brave:*
    - kickside.webscout.providers.brave.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
- name: module_runtime
  kind: security.policy
  meta:
    private: true
  groups: []
  policy:
    resources:
    - kickside.webscout.providers.brave:*
    - kickside.webscout.providers.brave.security:*
    actions:
    - registry.get
    - registry.find
    - contract.get
    - contract.open
    - contract.call
    - contract.implementations
    - contract.security
    - funcs.call
    - funcs.security
    effect: allow
