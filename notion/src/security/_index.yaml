version: '1.0'
namespace: kickside.notion.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      title: Notion
      surface: kickside.notion
      intent: module_access
      includes:
        - kickside.notion.security:module_runtime
    groups: []
    policy:
      resources:
        - kickside.notion:*
        - kickside.notion.client:*
        - kickside.notion.connection:*
        - kickside.notion.oauth:*
        - kickside.notion.traits:*
        - kickside.notion.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta:
      private: true
    groups: []
    policy:
      resources:
        - kickside.notion:*
        - kickside.notion.client:*
        - kickside.notion.connection:*
        - kickside.notion.oauth:*
        - kickside.notion.traits:*
        - kickside.notion.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
