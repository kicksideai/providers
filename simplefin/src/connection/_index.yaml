version: "1.0"
namespace: kickside.simplefin.connection

entries:
  - name: simplefin_connection
    kind: contract.binding
    meta:
      title: SimpleFIN
      comment: Connect SimpleFIN Bridge with a setup token to read bank accounts, transactions and investment holdings.
      icon: tabler:building-bank
      provider: simplefin
      group: Finance
      tags: [simplefin, bank, finance, transactions, holdings]
      class:
        - connection
      component:
        icon: tabler:building-bank
        create: { view: kickside.simplefin:connect_view }
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: setup_token
            label: Setup token
            type: password
            required: true
            placeholder: Paste the SimpleFIN setup token
            help: Create one at bridge.simplefin.org under My Account, Apps, New App. The token is claimed once and replaced by the access URL it unlocks.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.simplefin.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.simplefin.connection:get_status
          test_connection: kickside.simplefin.connection:test_connection
          discover_resources: kickside.simplefin.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.simplefin.connection:delete

  - name: connection_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://connection.lua
    imports:
      transport: kickside.simplefin.client:transport
      types: kickside.simplefin.client:types
      base: kickside.connection:base_connection

  - name: get_status
    kind: function.lua
    meta: { comment: "simplefin connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      implementation: kickside.simplefin.connection:connection_implementation

  - name: test_connection
    kind: function.lua
    meta: { comment: "simplefin connection - test_connection; claims a pending setup token" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      implementation: kickside.simplefin.connection:connection_implementation

  - name: discover_resources
    kind: function.lua
    meta: { comment: "simplefin connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      implementation: kickside.simplefin.connection:connection_implementation

  - name: delete
    kind: function.lua
    meta: { comment: "simplefin connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      implementation: kickside.simplefin.connection:connection_implementation
