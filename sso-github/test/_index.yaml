version: '1.0'
namespace: app

# Hosts kickside/sso-github on its real kickside/sso core: the module loads
# through its workspace replacement and this harness supplies only the concrete
# host resources its dependencies require.
entries:
- name: db
  kind: db.sql.sqlite
  foreign_keys: true
  file: ':memory:'
- name: env_storage
  kind: env.storage.file
  meta:
    type: envstorage
  file_path: ./.wippy/test.env
  auto_create: true
- name: processes
  kind: process.host
  lifecycle:
    auto_start: true
- name: gateway
  kind: http.service
  addr: :0
  lifecycle:
    auto_start: true
- name: api.public
  kind: http.router
  meta:
    server: gateway
  middleware:
  - token_auth
  options:
    token_store: kickside.users.security:tokens
  prefix: /api/public
- name: api
  kind: http.router
  meta:
    server: gateway
  middleware:
  - token_auth
  post_middleware:
  - endpoint_firewall
  options:
    token_store: kickside.users.security:tokens
  prefix: /api/v1
- name: user_scope
  kind: security.policy
  groups:
  - app.security:user
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: admin_scope
  kind: security.policy
  groups:
  - app.security:admin
  policy:
    resources: '*'
    actions: '*'
    effect: allow
- name: dep.wippy.test
  kind: ns.dependency
  component: wippy/test
  version: '*'
- name: dep.kickside.sso_github
  kind: ns.dependency
  component: kickside/sso-github
  version: '*'
  parameters:
  - name: kickside.sso:credential_eligibility
    value: kickside.users.binding:credential_eligibility
  - name: kickside.sso:target_db
    value: app:db
  - name: kickside.sso:public_api_router
    value: app:api.public
  - name: kickside.sso:api_router
    value: app:api
  - name: kickside.sso:ui_server
    value: app:gateway
  - name: kickside.settings:target_db
    value: app:db
  - name: kickside.settings:api_router
    value: app:api
  - name: kickside.settings:ui_server
    value: app:gateway
  - name: kickside.users:env_storage
    value: app:env_storage
  - name: kickside.users:public_router
    value: app:api.public
  - name: kickside.users:api_router
    value: app:api
  - name: kickside.users:ui_server
    value: app:gateway
  - name: kickside.users:target_db
    value: app:db
  - name: kickside.users:user_security_scope
    value: app.security:user
  - name: kickside.users:admin_security_scope
    value: app.security:admin
  - name: kickside.users:login_role_resource
    value: app.security:*
  - name: kickside.component:target_db
    value: app:db
  - name: kickside.component:api_router
    value: app:api
  - name: kickside.component:lifecycle_impl
    value: kickside.core.lifecycle:component_lifecycle_impl
  - name: kickside.core:target_db
    value: app:db
  - name: kickside.core.lifecycle:process_host
    value: app:processes
  - name: kickside.core.lifecycle:user_lifecycle_grant
    value:
      subject_id: app.security:user
      subject_type: group
      access_mask: 2
  - name: kickside.core.lifecycle:admin_lifecycle_grant
    value:
      subject_id: app.security:admin
      subject_type: group
      access_mask: 3
  - name: kickside.core.retention:process_host
    value: app:processes
  - name: kickside.core.threads:process_host
    value: app:processes
  - name: kickside.core.retention:api_router
    value: app:api
  - name: kickside.core.threads:api_router
    value: app:api
  - name: kickside.core.projections:api_router
    value: app:api
  - name: kickside.core.retention:user_security_scope
    value: app.security:user
  - name: kickside.core.threads:user_security_scope
    value: app.security:user
  - name: kickside.core.jobs:target_db
    value: app:db
  - name: kickside.core.jobs:process_host
    value: app:processes
  - name: kickside.security:target_db
    value: app:db
  - name: kickside.security:api_router
    value: app:api
  - name: kickside.security:ui_server
    value: app:gateway
  - name: kickside.security:process_host
    value: app:processes
  - name: wippy.migration:app_db
    value: app:db
  - name: wippy.views:api_router
    value: app:api
  - name: wippy.views:env_storage
    value: app:env_storage
- name: dep.wippy.bootloader
  kind: ns.dependency
  component: wippy/bootloader
  version: '*'
  parameters:
  - name: wippy.bootloader:application_host
    value: app:processes
  - name: wippy.bootloader:env_storage
    value: app:env_storage
- name: validator_test
  kind: function.lua
  meta:
    type: test
    suite: sso-github
  source: file://validator_test.lua
  method: run
  modules: [contract, security]
  imports:
    test: wippy.test:test
- name: endpoints_test
  kind: function.lua
  meta: { type: test, suite: endpoints }
  source: file://endpoints_test.lua
  method: run
  modules: [registry]
  imports:
    test: wippy.test:test
