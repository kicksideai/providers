version: "1.0"
namespace: kickside.atlassian.connection

# The single stored-credential Atlassian connection binding (provider: atlassian),
# implementing kickside.connection:connection + kickside.contract:deletable. One
# connection serves both Jira and Confluence (one site + one credential). OAuth
# connections are created by the oauth flow against the kickside.atlassian:atlassian
# provider entry; this binding covers the Cloud API token / Server PAT path. The
# connect web component (kickside.atlassian.ui:connect) creates either kind.

entries:
  - name: atlassian_connection
    kind: contract.binding
    meta:
      title: Atlassian
      comment: Connect to Atlassian with a Cloud API token or Server/Data Center PAT.
      icon: simple-icons:atlassian
      provider: atlassian
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Save connection
        fields:
          - key: site_url
            label: Site URL
            type: url
            required: true
            placeholder: https://your-org.atlassian.net
          - key: deployment
            label: Deployment
            type: select
            required: true
            options:
              - label: Cloud
                value: cloud
              - label: Server / Data Center
                value: server
          - key: email
            label: Account email
            type: email
            required_if:
              key: deployment
              equals: cloud
          - key: api_token
            label: API token
            type: password
            required_if:
              key: deployment
              equals: cloud
          - key: personal_access_token
            label: Personal access token
            type: password
            required_if:
              key: deployment
              equals: server
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.atlassian.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.atlassian.connection:get_status
          test_connection: kickside.atlassian.connection:test_connection
          discover_resources: kickside.atlassian.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.atlassian.connection:delete

  - name: connection_implementation
    kind: library.lua
    meta: { comment: Shared implementation behind individually owned function entries. }
    source: file://connection.lua
    imports:
      transport: kickside.atlassian.client:transport
      types: kickside.atlassian.client:types
      base: kickside.connection:base_connection

  - name: get_status
    kind: function.lua
    meta: { comment: "Reports whether the stored Atlassian credential still looks configured (does not call the Atlassian API)." }
    source: file://get_status.lua
    method: get_status
    imports:
      transport: kickside.atlassian.client:transport
      types: kickside.atlassian.client:types
      base: kickside.connection:base_connection
      implementation: kickside.atlassian.connection:connection_implementation

  - name: test_connection
    kind: function.lua
    meta: { comment: "Verifies the credential by calling Jira /myself and, on failure, Confluence /space; succeeds if either product answers." }
    source: file://test_connection.lua
    method: test_connection
    imports:
      transport: kickside.atlassian.client:transport
      types: kickside.atlassian.client:types
      base: kickside.connection:base_connection
      implementation: kickside.atlassian.connection:connection_implementation

  - name: discover_resources
    kind: function.lua
    meta: { comment: "Lists the Jira projects and Confluence spaces this connection can reach, typed as jira_project/confluence_space rows; tolerates either product being inaccessible." }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      transport: kickside.atlassian.client:transport
      types: kickside.atlassian.client:types
      base: kickside.connection:base_connection
      implementation: kickside.atlassian.connection:connection_implementation

  - name: delete
    kind: function.lua
    meta: { comment: "Removes the stored Atlassian connection credential." }
    source: file://delete.lua
    method: delete
    imports:
      transport: kickside.atlassian.client:transport
      types: kickside.atlassian.client:types
      base: kickside.connection:base_connection
      implementation: kickside.atlassian.connection:connection_implementation
