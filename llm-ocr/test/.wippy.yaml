version: '1.0'
vars:
  kickside_root: ../../../kickside
  converters_root: ../../../converters
  pg_host: localhost
  pg_port: 5433
  pg_database: kickside_test_llm_ocr_v2
  pg_username: kickside
  pg_password: kickside
profiles:
  postgres:
    override:
      app:db:kind: db.sql.postgres
      app:db:host: ${pg_host}
      app:db:port: ${pg_port}
      app:db:database: ${pg_database}
      app:db:username: ${pg_username}
      app:db:password: ${pg_password}
      app:db:options.sslmode: disable
workspace:
  replacements:
    kickside/llm-ocr: ..
    kickside/component: ${kickside_root}/core/component
    kickside/contract: ${kickside_root}/core/contract
    kickside/core: ${kickside_root}/core/core
    kickside/doc2md: ${converters_root}/doc2md
    kickside/execution: ${kickside_root}/core/execution
    kickside/jobs: ${kickside_root}/core/jobs
    kickside/settings: ${kickside_root}/platform/settings
    kickside/uploads: ${kickside_root}/platform/uploads
    kickside/users: ${kickside_root}/platform/users
registry:
  dispatch_internal_kinds:
  - registry.entry
  - ns.requirement
  - ns.dependency
  - ns.definition
  - security.scope
