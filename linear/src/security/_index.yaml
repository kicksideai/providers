version: '1.0'
namespace: kickside.linear.security
entries:
  - name: module_access
    kind: security.policy
    meta:
      title: Linear
      surface: kickside.linear
      intent: module_access
      includes:
        - kickside.linear.security:module_runtime
    groups: []
    policy:
      resources:
        - kickside.linear:*
        - kickside.linear.client:*
        - kickside.linear.connection:*
        - kickside.linear.oauth:*
        - kickside.linear.traits:*
        - kickside.linear.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
  - name: module_runtime
    kind: security.policy
    meta:
      private: true
    groups: []
    policy:
      resources:
        - kickside.linear:*
        - kickside.linear.client:*
        - kickside.linear.connection:*
        - kickside.linear.oauth:*
        - kickside.linear.traits:*
        - kickside.linear.security:*
      actions:
        - registry.get
        - registry.find
        - contract.get
        - contract.open
        - contract.call
        - contract.implementations
        - contract.security
        - funcs.call
        - funcs.security
      effect: allow
