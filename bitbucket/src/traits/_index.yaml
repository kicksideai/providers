version: "1.0"
namespace: kickside.bitbucket.traits

entries:
  - name: reader
    kind: registry.entry
    meta:
      type: agent.trait
      title: Bitbucket Reader
      public: true
      icon: tabler:brand-bitbucket
      comment: Bitbucket repository reader capability.
      provider: bitbucket
      web_component: kickside-connection-trait-picker
      context_schema:
        type: object
        properties:
          connection_id: {type: string}
        required: [connection_id]
        additionalProperties: false
    prompt: |
      Use the selected Bitbucket connection; never ask the user for credentials or a connection id.
      Inspect repository state before changes. Execute writes, approvals, merges and CI runs only when requested.
      Follow provider pagination using next_page; propagate permission and rate-limit failures.
    tools:
      - kickside.bitbucket.traits:read_tool

  - name: writer
    kind: registry.entry
    meta:
      type: agent.trait
      title: Bitbucket Writer
      public: true
      icon: tabler:brand-bitbucket
      comment: Bitbucket repository writer capability.
      provider: bitbucket
      web_component: kickside-connection-trait-picker
      context_schema:
        type: object
        properties:
          connection_id: {type: string}
        required: [connection_id]
        additionalProperties: false
    prompt: |
      Use the selected Bitbucket connection; never ask the user for credentials or a connection id.
      Inspect repository state before changes. Execute writes, approvals, merges and CI runs only when requested.
      Follow provider pagination using next_page; propagate permission and rate-limit failures.
    tools:
      - kickside.bitbucket.traits:write_tool

  - name: manager
    kind: registry.entry
    meta:
      type: agent.trait
      title: Bitbucket Manager
      public: true
      icon: tabler:brand-bitbucket
      comment: Bitbucket repository manager capability.
      provider: bitbucket
      web_component: kickside-connection-trait-picker
      context_schema:
        type: object
        properties:
          connection_id: {type: string}
        required: [connection_id]
        additionalProperties: false
    prompt: |
      Use the selected Bitbucket connection; never ask the user for credentials or a connection id.
      Inspect repository state before changes. Execute writes, approvals, merges and CI runs only when requested.
      Follow provider pagination using next_page; propagate permission and rate-limit failures.
    tools:
      - kickside.bitbucket.traits:read_tool
      - kickside.bitbucket.traits:write_tool

  - name: read_tool
    kind: function.lua
    source: file://read_tool.lua
    method: handler
    imports:
      repository: kickside.bitbucket.repository:service
    meta:
      type: tool
      title: Bitbucket Repository Read
      llm_alias: BitbucketRead
      llm_description: "Read Bitbucket repositories, source, branches, commits, issues, pull or merge requests, reviews and CI. The connection is configured on the capability. Returns {success,data,next_page?}; inspect success before continuing. "
      mcp:
        required_scopes: [state.read]
      input_schema: |
        {
          "type": "object",
          "properties": {
            "action": {
              "type": "string",
              "enum": [
                "viewer",
                "get_repo",
                "list_repositories",
                "list_issues",
                "get_issue",
                "list_pull_requests",
                "get_pull_request",
                "list_pull_request_comments",
                "get_pull_request_diff",
                "list_pull_request_diffstat",
                "list_branches",
                "get_branch",
                "list_commits",
                "get_commit",
                "get_file",
                "list_directory",
                "list_pipelines",
                "get_pipeline",
                "list_commit_statuses"
              ]
            },
            "workspace": {
              "type": "string"
            },
            "repo": {
              "type": "string"
            },
            "number": {
              "type": "string"
            },
            "ref": {
              "type": "string"
            },
            "path": {
              "type": "string"
            },
            "state": {
              "type": "string"
            },
            "q": {
              "type": "string"
            },
            "pipeline_id": {
              "type": "string"
            },
            "page": {
              "type": "integer",
              "minimum": 1
            },
            "limit": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100
            }
          },
          "required": [
            "action"
          ],
          "additionalProperties": false
        }
      output_schema: |
        {"type":"object","properties":{"success":{"type":"boolean"},"data":{},"next_page":{"type":["string","integer"]},"error":{"type":"string"}}}

  - name: write_tool
    kind: function.lua
    source: file://write_tool.lua
    method: handler
