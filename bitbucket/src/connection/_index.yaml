version: "1.0"
namespace: kickside.bitbucket.connection

entries:
  - name: bitbucket_connection
    kind: contract.binding
    meta:
      title: Bitbucket
      comment: Connect Bitbucket Cloud with an Atlassian API token or a workspace, project, or repository access token.
      icon: tabler:brand-bitbucket
      provider: bitbucket
      group: Developer
      tags: [bitbucket, atlassian, git, code, repositories]
      class:
        - connection
      credential_schema:
        version: "1.0"
        submit_label: Connect
        fields:
          - key: auth_type
            label: Authentication
            type: select
            required: true
            options:
              - label: Atlassian API token
                value: api_token
              - label: Workspace, project, or repository access token
                value: access_token
            help: API tokens act as your Atlassian account across its workspaces; access tokens are bound to one workspace.
          - key: email
            label: Atlassian account email
            type: email
            required_if:
              key: auth_type
              equals: api_token
            placeholder: you@example.com
          - key: api_token
            label: API token
            type: password
            required_if:
              key: auth_type
              equals: api_token
            help: Create a scoped API token for Bitbucket at id.atlassian.com (Security -> API tokens) with the read:user:bitbucket, read:workspace:bitbucket, and read:repository:bitbucket scopes.
          - key: access_token
            label: Access token
            type: password
            required_if:
              key: auth_type
              equals: access_token
            help: Create it under the workspace, project, or repository settings (Access tokens) with at least Repositories Read.
          - key: workspace
            label: Workspace
            type: text
            required_if:
              key: auth_type
              equals: access_token
            placeholder: my-workspace
            help: Workspace slug (bitbucket.org/<slug>). Required for access tokens; optional for API tokens to limit discovery to one workspace.
    contracts:
      - contract: kickside.contract:component
        methods:
          get_status: kickside.bitbucket.connection:get_status
      - contract: kickside.connection:connection
        context_required:
          - component_id
        methods:
          get_status: kickside.bitbucket.connection:get_status
          test_connection: kickside.bitbucket.connection:test_connection
          discover_resources: kickside.bitbucket.connection:discover_resources
      - contract: kickside.contract:deletable
        context_required:
          - component_id
        methods:
          delete: kickside.bitbucket.connection:delete

  - name: get_status
    kind: function.lua
    meta: { comment: "bitbucket connection - get_status" }
    source: file://get_status.lua
    method: get_status
    imports:
      implementation: kickside.bitbucket.connection:connection_lib

  - name: test_connection
    kind: function.lua
    meta: { comment: "bitbucket connection - test_connection" }
    source: file://test_connection.lua
    method: test_connection
    imports:
      implementation: kickside.bitbucket.connection:connection_lib

  - name: discover_resources
    kind: function.lua
    meta: { comment: "bitbucket connection - discover_resources" }
    source: file://discover_resources.lua
    method: discover_resources
    imports:
      implementation: kickside.bitbucket.connection:connection_lib

  - name: delete
    kind: function.lua
    meta: { comment: "bitbucket connection - delete" }
    source: file://delete.lua
    method: delete
    imports:
      implementation: kickside.bitbucket.connection:connection_lib

  - name: connection_lib
    kind: library.lua
    meta: { name: connection_lib, comment: "bitbucket connection - shared implementation behind the contract methods" }
    source: file://connection.lua
    imports:
      transport: kickside.bitbucket.client:transport
      types: kickside.bitbucket.client:types
      base: kickside.connection:base_connection
